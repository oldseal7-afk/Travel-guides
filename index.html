 Calificado\", \"36개월\", \"단일 포도밭, 수령 10년 이상 나무, 손 수확\"]]}, {\"t\": \"list\", \"items\": [\"Guarda Superior 세 등급은 2025년 수확분부터 유기농 포도만 쓸 수 있습니다. 보증 라벨 색은 Guarda 초록, Reserva 은색, Gran Reserva 금색입니다.\", \"당도는 Brut Nature (리터당 당 3g 이하) → Extra Brut (6g 이하) → Brut (12g 이하) 순으로 올라갑니다. 드라이한 쪽을 원하면 Brut Nature나 Extra Brut을 고르세요.\", \"2019년 그라모나·레카레도 등 페네데스 생산자들이 더 엄격한 기준을 내걸고 까바 DO를 떠나 ‘코르피나트 (Corpinnat)’라는 이름을 씁니다. 그보다 앞선 2012년에는 라벤토스 이 블랑이 먼저 떠났습니다. 바르셀로나 와인바에서 라벨에 Cava 대신 Corpinnat이나 Clàssic Penedès가 적혀 있어도 같은 방식으로 만든 고급 스파클링입니다.\"]}], \"city\": \"바르셀로나\"}, {\"id\": \"rioja\", \"cat\": \"와인\", \"title\": \"리오하: 스페인 최고의 와인 산지\", \"lead\": \"스페인 최초의 최고 등급(DOCa) 와인 산지로, 템프라니요 품종과 정교한 오크 숙성 미학이 빚어낸 우아함과 깊이 있는 풍미를 자랑합니다.\", \"links\": {\"q\": \"La Rioja\", \"wp\": \"https://ko.wikipedia.org/wiki/%EB%9D%BC%EB%A6%AC%EC%98%A4%ED%95%98%EC%A3%BC_(%EC%8A%A4%ED%8E%98%EC%9D%B8)\", \"yt\": \"리오하 와인\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/beb3d794239ddc6e19264a757126541c.jpg\", \"caption\": \"\", \"credit\": \"\"}, {\"t\": \"h\", \"text\": \"1. 지리와 테루아: 3개의 세부 산지 (Sub-zones)\"}, {\"t\": \"p\", \"text\": \"에브로강(Ebro River)을 따라 형성된 리오하는 북쪽의 칸타브리아 산맥이 대서양의 차갑고 습한 바람을 막아주고, 남쪽의 이베리아 산맥이 내륙의 극심한 더위를 완충해 주는 천혜의 미기후를 지닙니다. 토양과 기후 차이에 따라 3개 구역으로 나뉩니다.\"}, {\"t\": \"table\", \"head\": [\"세부 산지\", \"기후·토양\", \"와인 스타일\"], \"rows\": [[\"리오하 알타\\n\\n\\n(Rioja Alta)\", \"기후·토양: 서쪽 고지대(해발 400~800m). 대서양 영향이 남아 서늘하고 일교차가 크며 석회질·철분 점토 및 충적토 분포.\\n\\n\\n\", \"우아함과 구조감의 정점. 산도가 높고 타닌이 섬세하며 장기 숙성 잠재력이 가장 뛰어남.\"], [\"리오하 알라베사\\n\\n\\n(Rioja Alavesa)\", \"기후·토양: 에브로강 북쪽(바스크 지방 소속) 남향 경사지. 일조량이 풍부하며 백악질 석회암(Calcareous clay) 위주.\", \"아로마와 생동감. 미네랄리티가 선명하고 붉은 과실 향이 화사하며 세련된 질감을 지님.\"], [\"리오하 오리엔탈\\n\\n\\n(Rioja Oriental, 구 바하)\", \"기후·토양: 동남쪽 저지대. 지중해성 기후로 덥고 건조하며 충적토·사질토·철분 점토 분포.\\n\", \"풍부한 과실미와 바디감. 알코올 도수가 높고 색상이 짙으며 가르나차 재배에 최적.\"]]}, {\"t\": \"tip\", \"label\": \"참고\", \"text\": \"고전 블렌딩의 미학: 전통적인 리오하 생산자들은 산도가 좋은 리오하 알타/알라베사의 포도와 과실 풍미가 짙은 리오하 오리엔탈의 포도를 블렌딩하여 균형을 맞추곤 했습니다. 반면 현대 생산자들은 단일 마을이나 단일 밭의 테루아를 순수하게 드러내는 추세입니다.\"}, {\"t\": \"h\", \"text\": \"2. 리오하 와인의 등급: 숙성 기간에 따른 등급 체계\"}, {\"t\": \"table\", \"head\": [\"등급 (레드)\", \"총 숙성\", \"오크통\", \"병\", \"뒷면 보증 라벨\"], \"rows\": [[\"헤네리코(Genérico)\", \"규정 없음\", \"—\", \"—\", \"초록\"], [\"크리안자(Crianza)\", \"2년\", \"1년 이상\", \"—\", \"빨강\"], [\"레세르바(Reserva)\", \"3년\", \"1년 이상\", \"6개월 이상\", \"진홍\"], [\"그란 레세르바(Gran Reserva)\", \"5년\", \"2년 이상\", \"2년 이상\", \"파랑\"]]}, {\"t\": \"h\", \"text\": \"3. 2017년 개편된 테루아 기반 상위 분류\"}, {\"t\": \"list\", \"items\": [\"비뇨 데 소나 (Vino de Zona): 3개 세부 산지(알타, 알라베사, 오리엔탈) 중 한 곳의 포도만 사용\", \"비뇨 데 무니시피오 (Vino de Municipio): 특정 마을(아로, 라과르디아 등) 내 포도밭에서 생산\", \"비녜도 싱굴라르 (Viñedo Singular): 리오하 최상위 '싱글 빈야드' 인증. 수령 35년 이상의 포도나무, 수확량 제한, 손수확, 엄격한 테이스팅 심사를 통과한 단일 포도밭 와인\"]}, {\"t\": \"h\", \"text\": \"4. 리오하 와인의 품종\"}, {\"t\": \"table\", \"head\": [\"품종\", \"향과 맛\", \"역할\"], \"rows\": [[\"템프라니요 (Tempranillo)\", \"딸기, 붉은 체리, 자두 같은 신선한 과실 향. 숙성되면서 피어나는 가죽, 담뱃잎, 감초, 말린 무화과, 삼나무 향\", \"구조감과 우아함을 담당하며, 특히 아메리칸 오크에서 숙성할 때 바닐라·코코넛 향과 결합해 리오하만의 독보적인 스타일을 완성합니다.\"], [\"가르나차 (Garnacha)\", \"산딸기(라즈베리), 붉은 자두, 흰 후추 같은 화사하고 스파이시한 아로마\", \"과실의 단맛(달콤한 뉘앙스), 부드러운 질감\"], [\"그라시아노 (Graciano)\", \"강렬한 진보랏빛 색상, 날카롭고 생생한 산도, 제비꽃, 흑후추, 허브 향\", \"뛰어난 산도와 신선함, 장기 숙성 잠재력을 부여\"], [\"마수엘로 (Mazuelo / 카리냥)\", \"산도와 타닌이 높음\", \"장기 숙성 와인의 산화 방지와 구조감 유지\"]]}], \"city\": \"마드리드\"}, {\"id\": \"g-mwp5nwuc\", \"cat\": \"와인\", \"title\": \"테일러스 와이너리\", \"city\": \"포르투\", \"lead\": \"\", \"blocks\": [{\"t\": \"h\", \"text\": \"역사와 혁신의 발자취\"}, {\"t\": \"list\", \"items\": [\"330년을 이어온 독립 가문(1692년): 영국인 상인 잡 베어슬리(Job Bearsley)가 설립한 이래, 19세기 합류한 테일러(Taylor)와 예트먼(Yeatman), 플랫게이트(Fladgate) 가문이 대를 이어 경영을 이어오고 있습니다.\", \"도우루 상류 포도밭 개척의 선구자: 1744년 영국 상인으로는 최초로 도우루 계곡에 직접 포도밭(킨타 데 루가르 다스 라제스)을 매입해 원료 생산부터 숙성까지 일원화하는 기틀을 마련했습니다.\", \"포트 와인 스타일의 혁신: 1934년 세계 최초의 드라이 화이트 포트인 '칩 드라이(Chip Dry)'를 선보였고, 1970년에는 빈티지 포트와 루비 포트의 장점을 결합한 '레이트 보틀드 빈티지(LBV)' 카테고리를 최초로 창시하며 현대 포트 와인 시장을 선도했습니다.\"]}, {\"t\": \"h\", \"text\": \"포도밭과 핵심 포도 품종\"}, {\"t\": \"list\", \"items\": [\"테일러의 와인은 도우루 계곡에서도 가장 험준하고 일교차가 큰 테라스형 포도밭에서 생산됩니다. 특히 테일러의 심장부로 불리는 킨타 데 바르젤라스(Quinta de Vargellas)를 비롯해 테라 페이타(Terra Feita), 준코(Junco) 등 최상급 등급(A등급) 포도밭의 편암(Schist) 토양이 와인의 깊이를 결정짓습니다.\"]}, {\"t\": \"table\", \"head\": [\"대표 품종\", \"특징 및 역할\"], \"rows\": [[\"투리가 나시오날 (Touriga Nacional)\", \"테일러 빈티지 포트의 핵심 품종. 짙은 블랙베리·카시스 풍미와 우아한 제비꽃 향, 수십 년을 버티는 강력한 구조감을 부여합니다.\"], [\"투리가 프랑카 (Touriga Franca)\", \"섬세한 꽃향기와 붉은 과실미, 부드러운 타닌을 더해 강건한 투리가 나시오날과 완벽한 조화를 이룹니다.\"], [\"틴타 호리즈 (Tinta Roriz)\", \"풍부한 색소와 무게감, 은은한 향신료 노트를 더해 블렌딩에 복합미를 불어넣습니다\"], [\"틴탕 카웅 (Tinto Cão)\", \"알이 작고 수확량이 적지만, 산도가 뛰어나 장기 숙성 시에도 생동감과 균형을 유지하게 합니다.\"], [\"말바시아 피나 & 고베이우 (Malvasia Fina & Gouveio)\", \"화이트 포트 생산에 쓰이는 청포도 품종. 신선한 시트러스 아로마와 깔끔한 산미, 견과류 뉘앙스를 만들어냅니다.\"]]}]}, {\"id\": \"g-mwp6fj1q\", \"cat\": \"와인\", \"title\": \"산드만 와이너리\", \"city\": \"포르투\", \"lead\": \"\", \"blocks\": [{\"t\": \"h\", \"text\": \"역사와 브랜드 정체성\"}, {\"t\": \"list\", \"items\": [\"창립과 가이아 셀러 정착: 1790년 스코틀랜드 출신 조지 샌드맨(George Sandeman)이 런던에서 와인 상인으로 출발한 뒤 1811년 가이아 강변 셀러를 확보하며 포트 와인 사업을 본격화했습니다.\", \"원산지 표기 선구와 '더 돈': 1805년경 오크통에 'GSC(George Sandeman & Co.)' 이니셜을 찍어 품질과 출처를 보증한 선구적 시도로 꼽히며, 포르투갈 대학생 망토(카파)와 안달루시아 챙 넓은 모자(솜브레로)를 결합한 검은 실루엣 '더 돈'으로 강한 브랜드 정체성을 구축했습니다.\", \"공간과 관람 분위기: 도우루강 바로 앞 평지에 있어 가파른 언덕을 크게 오르지 않고도 이동하기 수월하며, 가이드가 '더 돈' 복장을 착용하고 안내하는 회차도 운영되어 활기차고 입체적인 분위기가 돋보입니다.\"]}, {\"t\": \"h\", \"text\": \"포도 품종과 와인 스타일\"}, {\"t\": \"list\", \"items\": [\"핵심 포도밭과 품종: 도우루 계곡의 편암(Schist) 토양에 자리한 킨타 두 세이쇼(Quinta do Seixo) 등의 포도를 바탕으로 투리가 나시오날, 투리가 프랑카, 틴타 호리즈, 틴탕 카웅(수상) 등 전통 적포도 품종과 청포도 품종을 활용합니다.\", \"대표 스타일: 산뜻한 화이트와 과실미가 살아 있는 루비·LBV·빈티지 포트부터 오크 숙성을 거친 에이지드 토니(10·20·30·40년)까지 폭넓은 라인업을 갖추고 있습니다.\"]}]}, {\"id\": \"g-mwsr6mu9\", \"cat\": \"건축\", \"title\": \"모루 정원과 세하 두 필라르 수도원\", \"city\": \"포르투\", \"lead\": \"1809년 웰링턴 공작의 나폴레옹군 기습 지휘소이자, 1832년 포르투갈 내전 당시 1년간의 집중 포격을 견뎌낸 최후의 보루입니다. 오늘날에는 유네스코 세계유산 원형 수도원과 맞닿은 포르투 최고의 일몰 명소로 사랑받고 있습니다.\", \"blocks\": [{\"t\": \"h\", \"text\": \"1. 왕위 계승 전쟁의 최후 보루 (1832~1833년 포르투 공방전)\"}, {\"t\": \"list\", \"items\": [\"형제의 내전과 요새화된 수도원: 19세기 초 포르투갈에서는 자유주의 헌법을 지지하는 형 페드루 4세(브라질 초대 황제)와 절대왕정을 고수하는 동생 미겔 1세 사이에 내전(자유주의 전쟁)이 벌어졌습니다. 1832년 페드루 4세가 이끄는 자유주의 군대가 포르투를 점령하자, 미겔 1세의 대군이 도시를 포위하며 1년 넘게 이어진 포르투 공방전이 시작되었습니다.\", \"유일하게 지켜낸 강 남쪽 거점: 당시 도우루강 남쪽(빌라 노바 드 가이아) 일대는 모두 미겔 1세의 군대에게 넘어갔지만, 언덕 꼭대기의 세하 두 필라르 수도원만은 함락되지 않았습니다. 수도사들이 떠나고 요새로 개조된 이 수도원은 1년 내내 집중 포격을 받으면서도 끝까지 버텨내며 강 북쪽 포르투 시내를 지키는 결정적 방어선 역할을 했습니다. 오늘날 전망대에서 내려다보는 평화로운 강변은 당시 포연이 자욱했던 치열한 격전지였습니다.\"]}, {\"t\": \"h\", \"text\": \"2. 나폴레옹 군대를 쫓아낸 웰링턴 공작의 비밀 도하 (1809년)\"}, {\"t\": \"list\", \"items\": [\"불가능을 뚫은 와인 바지선 작전: 1809년 나폴레옹의 프랑스군이 포르투를 점령했을 때, 영국군 사령관 웰링턴 공작은 세하 두 필라르 수도원 언덕에 지휘소를 차리고 강 건너 프랑스군의 움직임을 낱낱이 감시했습니다.\", \"배 다리를 폭파한 프랑스군의 방심: 프랑스군은 도우루강에 놓인 배 다리(부교)를 폭파하고 모든 배를 북쪽으로 옮겨두었기 때문에 영국군이 강을 건너올 수 없다고 확신했습니다. 그러나 웰링턴 공작은 수도원 뒤편 사각지대를 이용해 현지인들이 숨겨둔 포트 와인 운반용 바지선(라벨루) 몇 척을 은밀히 확보했고, 대낮에 기습 도하 작전을 감행해 프랑스군을 포르투에서 몰아냈습니다.\"]}, {\"t\": \"h\", \"text\": \"3. 모루 정원의 탄생 배경\"}, {\"t\": \"list\", \"items\": [\"1927년 시민 휴식처로 탈바꿈: 1886년 동루이스 1세 다리가 개통된 이후 가이아 지역과 포르투 도심의 왕래가 잦아지자, 1927년 빌라 노바 드 가이아 시 당국이 이 바위 언덕을 정비해 야자수와 산책로를 갖춘 공원으로 조성했습니다. 당시 이국적인 분위기를 내기 위해 심은 야자수들이 100년 가까이 자라 오늘날 모루 정원만의 독특한 실루엣을 만들어냈습니다.\"]}, {\"t\": \"h\", \"text\": \"4. 유네스코 세계유산이 된 독특한 '원형 교회'\"}, {\"t\": \"list\", \"items\": [\"유럽에서 보기 드문 원형 설계: 16세기에 지어진 세하 두 필라르 수도원은 일반적인 십자가 형태가 아니라, 로마의 판테온을 본뜬 완벽한 원형(Rotunda) 구조의 교회와 원형 회랑이 맞붙어 있는 독특한 건축물입니다. 당시 포르투갈 건축에서 매우 이례적인 형태였던 덕분에 1996년 포르투 역사지구와 함께 유네스코 세계유산으로 등재되었습니다.\"]}]}]}";</script><style>#vedit,.cchip-add,.cmore,.tab-add,.tmore,.dtedit,.addbox,[data-e="branch-day-add"],[data-e="branch-edit"],[data-e="stop-edit"],[data-e="stop-edit"]{display:none!important}.hero>.vai{right:58px!important}</style>

.hero>.vgear{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.hero>.vedit{right:58px}.hero>.vai{right:102px}
.vgear[aria-pressed="true"]{background:#fff;color:#27322b;border-color:#fff}
.vset-bg{position:fixed;inset:0;z-index:70;background:rgba(14,16,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.vset-bg[hidden]{display:none}
.vset{width:min(100%,380px);max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px;padding:20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.vset h3{margin:0 0 4px;font-size:17px}
.vset .vsec{margin-top:16px}
.vset .vsec>.lbl{display:block;margin-bottom:6px;color:var(--sub);opacity:1}
.vset .swatches,.vset .fsrow{margin-top:0}
.vset .sw i{border-color:var(--line)}
.vset .sw[aria-checked="true"] i{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.vset .fsb{border-color:var(--line);background:transparent;color:var(--ink)}
.vset .fsb[aria-checked="true"]{background:var(--accent);border-color:var(--accent-ink);color:var(--on)}
.vset .fxrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-top:8px;font-size:13px}.vset .fxrow input{width:96px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;text-align:right}.vset .fxnote{margin:6px 0 0;font-size:12px;color:var(--sub)}
.vset details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--sub)}
.vset summary{cursor:pointer;font-weight:700}
.vset details .fsb{margin-top:10px}
.vset .vclose{display:block;width:100%;margin-top:18px;min-height:44px;border-radius:999px;border:0;background:var(--accent);color:var(--on);font-weight:800;font-size:14px;cursor:pointer}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--font-body);
  word-break:keep-all;text-wrap:pretty;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.eyebrow,.lbl{font-size:calc(11px * var(--fs));font-weight:700;letter-spacing:.14em;text-transform:uppercase}

/* 히어로 */
header.top{padding:14px 14px 0;max-width:660px;margin:0 auto}
.hero{position:relative;overflow:hidden;border-radius:26px;color:#f6f7ef;padding:40px 22px 24px;
  background:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 46%),linear-gradient(160deg,var(--hero1),var(--hero2));
  background-size:cover;background-position:center}
.hero.has-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,30,24,.25),rgba(20,30,24,.75))}
.hero>*{position:relative}
.hero .eyebrow{opacity:.85}
.hero h1{font:700 calc(36px * var(--fs))/1.2 var(--font-body);letter-spacing:-.03em;margin:12px 0 14px;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tags span{background:#f3f1e4;color:#27322b;font-size:calc(12.5px * var(--fs));font-weight:700;border-radius:999px;padding:3px 12px}
.hero p{margin:0;font-size:calc(14px * var(--fs));opacity:.9}
/* 글자 크기: --fs 배율 (작게 .92 · 보통 1 · 크게 1.1) */
:root{--fs:.92}
.fsrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.fsrow .lbl{margin-right:6px;opacity:.8}
.fsb{min-height:32px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.fsb[aria-checked="true"]{background:#fff;color:#27322b;border-color:#fff}
/* 모바일 미리보기 (PC 화면에서 폰 크기로 보기) */
.phone-btn{display:none}
@media (min-width:700px){.phone-btn{display:inline-flex !important;align-items:center;justify-content:center;gap:4px;flex:0 0 auto !important;padding:0 16px;line-height:1}}
html.phone .edit-toggle,html.phone .vedit,html.phone .vai,html.phone .phone-btn{display:none !important}
.phone-ov{position:fixed;inset:0;z-index:40;background:rgba(14,16,20,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;overflow:auto}
.phone-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.phone-devs{display:flex;gap:6px}
.phone-bar button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:700 13px var(--font-body);cursor:pointer}
.phone-bar button[aria-checked="true"]{background:#fff;color:#15171a;border-color:#fff}
.device{box-sizing:content-box;border:10px solid #15171a;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px #3a3d42;flex:0 0 auto}
.screen{height:100%;overflow:auto;overscroll-behavior:contain}
.screen::-webkit-scrollbar{width:0}
.phone-note{margin:0;font-size:12px;color:rgba(255,255,255,.65)}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:18px}
.swatches .sw i{box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.swatches .lbl{margin-right:8px;opacity:.8}
.sw{width:36px;height:36px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.sw i{display:block;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.sw[aria-checked="true"] i{box-shadow:0 0 0 2px var(--hero1),0 0 0 4px #fff}
.sw:focus-visible{outline:2px solid #fff;outline-offset:0}

/* 내비 */

.pill{padding:14px 16px;font-size:calc(12px * var(--fs));color:var(--sub)}
.pill+.pill{border-left:1px solid var(--line)}
.pill b{display:block;font-size:calc(20px * var(--fs));font-weight:700;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* 링크 행 (아이콘 배지 + 제목 + 화살표) */
.linkrow{display:flex;align-items:center;gap:14px;width:100%;margin:12px 0 0;padding:14px 16px;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:22px;background:var(--card)}
.linkrow .badge{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--paper);display:grid;place-items:center;
  font-size:calc(12px * var(--fs));font-weight:700;letter-spacing:.04em}
.linkrow .badge svg{width:20px;height:20px}
.linkrow .body{flex:1;min-width:0}
.linkrow .lbl{display:block;color:var(--sub);font-size:calc(10.5px * var(--fs))}
.linkrow .ttl{display:block;font-size:calc(16.5px * var(--fs));font-weight:700;letter-spacing:-.02em;line-height:1.4}
.linkrow .sub{display:block;font-size:calc(13px * var(--fs));color:var(--sub);line-height:1.5}
.nrow{position:relative}.nrow .linkrow{padding-right:104px}.nmove{position:absolute;right:38px;top:calc(50% + 6px);transform:translateY(-50%);border:1px solid var(--line,#ddd);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 9px;font:inherit;font-size:calc(11.5px * var(--fs));font-weight:700;cursor:pointer;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .arrow{flex:0 0 auto;font-size:calc(18px * var(--fs));font-weight:700}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 4px 10px;font-size:calc(14px * var(--fs));color:var(--sub)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:linear-gradient(135deg,color-mix(in oklch,var(--accent-ink) 32%,var(--accent)),color-mix(in oklch,var(--accent-ink) 58%,var(--accent)))}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* 일정 카드 */
ol.timeline{list-style:none;margin:12px 0 0;padding:0}
li.stop{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 14px;scroll-margin-top:140px}
.card .lbl{color:var(--sub)}
.card.must{border:2px solid var(--accent-ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 38%,transparent)}
.mustb{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent-ink);color:#fff;font-size:calc(10.5px * var(--fs));font-weight:800;letter-spacing:.02em;vertical-align:1px;white-space:nowrap}
li.stop.is-off .card.must{box-shadow:none}
.name{font-size:calc(20px * var(--fs));font-weight:700;letter-spacing:-.025em;line-height:1.35;margin:6px 0 0}
/* 일몰·야경: 카드 색은 그대로 두고 라벨 문구에만 포인트 */
:root{--sunpill:rgba(240,138,60,.17);--sunpillink:#b4580f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sunpill:rgba(232,150,79,.22);--sunpillink:#ffb987}}
:root[data-theme="dark"]{--sunpill:rgba(232,150,79,.22);--sunpillink:#ffb987}
li.stop[data-kind="sunset"] .card{background:var(--sun-soft);border-color:var(--sun)}
li.stop[data-kind="sunset"] .lbl{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--sunpill);color:var(--sunpillink)}
/* 야경: 연한 보랏빛 파스텔. 일몰과 야경을 둘 다 지정하면 따뜻한 일몰 색에서 보라색으로 이어지는 그라데이션 */
:root{--night-bg:#ebe5f8;--night-line:#cfc3ec}

li.stop[data-kind="sunset"]:not([data-night="1"]) .card{background:var(--sunset-grad);border-color:var(--sunset-line)}
li.stop[data-night="1"]:not([data-sun="1"]) .card .memo{background:rgba(255,255,255,.4);border-radius:4px 14px 14px 4px;padding:4px 12px 4px 12px}
li.stop[data-night="1"]:not([data-sun="1"]) .card{--accent:#e6dcf9;--accent-ink:#7a62c2;--on:#3a2a73}
:root[data-theme="dark"] li.stop[data-night="1"]:not([data-sun="1"]) .card{--accent:#cdb8f0;--accent-ink:#cdb8f0;--on:#2a1b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) li.stop[data-night="1"]:not([data-sun="1"]) .card{--accent:#cdb8f0;--accent-ink:#cdb8f0;--on:#2a1b57}}
li.stop[data-night="1"]:not([data-sun="1"]) .card{background:var(--night-stars) center top/100% 170px no-repeat,var(--night-photo) center bottom/100% auto no-repeat,var(--night-grad);border-color:var(--night-only-line);padding-bottom:50px}
li.stop[data-night="1"] .card.must{border-color:var(--accent-ink)}
/* 야경 카드: 아래 도시 사진 자리를 위해 아래 여백만 늘린다 ("가이드 보기"는 다른 카드와 같은 모양) */
li.stop[data-night="1"]:not([data-sun="1"]) .card{padding-bottom:64px}
:root[data-theme="dark"] li.stop[data-night="1"]:not([data-sun="1"]) .card .memo{background:rgba(20,12,45,.45)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) li.stop[data-night="1"]:not([data-sun="1"]) .card .memo{background:rgba(20,12,45,.45)}}
li.stop[data-night="1"]:not([data-sun="1"]) .lbl{background:rgba(255,255,255,.4);color:#5b44a0}
:root[data-theme="dark"] li.stop[data-night="1"]:not([data-sun="1"]) .lbl{background:rgba(205,184,240,.18);color:#d9c8f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) li.stop[data-night="1"]:not([data-sun="1"]) .lbl{background:rgba(205,184,240,.18);color:#d9c8f7}}
li.stop[data-kind="meal"] .card{background:var(--accent-soft);border-color:var(--accent)}
/* 숙소 카드는 다른 카드와 같은 모양 (강조 없음). 변수는 입력 창 강조에만 쓴다 */
:root{--stay-bg:#e8f1f8;--stay-line:#c6dbeb;--stay-pill:rgba(70,130,180,.15);--stay-ink:#2f6a94}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stay-bg:#1f2b36;--stay-line:#35495b;--stay-pill:rgba(130,180,220,.2);--stay-ink:#a9d0f0}}
:root[data-theme="dark"]{--stay-bg:#1f2b36;--stay-line:#35495b;--stay-pill:rgba(130,180,220,.2);--stay-ink:#a9d0f0}
.stayadd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 0}
.stayadd .eadd{margin:0;font-size:calc(13.5px * var(--fs))}
.stayadd .eadd:only-child{grid-column:1/-1}
.addbox{margin:14px 0 12px;padding:12px 12px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.addbox .stayadd.eadd-top{margin:8px 0 0}
.addbox .eadd{background:var(--paper)}
.addcap{margin:0 2px;font-size:calc(13px * var(--fs));font-weight:800;color:var(--accent-ink)}
.addcap small{margin-left:6px;font-size:calc(11.5px * var(--fs));font-weight:400;color:var(--sub)}
.stayadd.eadd-top{grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.stayadd.eadd-top .eadd{min-height:40px;padding:0 2px;font-size:calc(11.5px * var(--fs));white-space:nowrap}
.eadd-top.eadd{margin:0 0 10px}
.stayadd.eadd-top{margin:12px 0 12px}
li.stop .card{position:relative}
li.stop.is-off .card{background:var(--opt);border-style:dashed;border-color:var(--line);box-shadow:none;color:var(--opt-ink)}
li.stop.is-off .lbl{background:transparent;color:var(--opt-ink);padding-left:0}
li.stop.is-off .lbl::before{display:none}
li.stop.is-off .meta span{background:var(--paper);color:var(--sub)}
li.stop.is-off .lbl,li.stop.is-off .memo,li.stop.is-off .name{color:var(--opt-ink)}
li.stop.is-off .card>*:not(.lbl):not(.name):not(.sw-card){opacity:.6}
.sw-card{position:absolute;top:14px;right:14px}
li.stop{-webkit-touch-callout:none}
li.stop.dragging .card{opacity:.45}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-120%);max-width:78vw;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.tdragging,html.tdragging *{-webkit-user-select:none;user-select:none}
/* 장소 간 이동 방법 (접이식) */
.mvrow{margin:8px 0 0}
.mvbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 14px;border:1px dashed color-mix(in srgb,var(--accent-ink) 40%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,var(--paper));font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.mvbtn .ic{font-size:calc(18px * var(--fs));line-height:1}
.mvbtn .t{flex:1;min-width:0;font-size:calc(13.5px * var(--fs));line-height:1.4}
.mvbtn .t small{display:block;margin-bottom:1px;font-size:calc(11px * var(--fs));letter-spacing:.08em;font-weight:700;color:var(--sub)}
.mvbtn .t b{font-weight:700}
/* 이동 카드가 길어지지 않도록: 접힌 상태에서는 머리글 1줄, 요약 2줄, 금액·걸음수는 한 줄에 나란히. 펼치면 전부 보여요 */
.mvbtn:has(> i)[aria-expanded="false"] .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvbtn:has(> i)[aria-expanded="false"] .t b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.mvbtn .t .mvcost,.mvbtn .t .mvwalk{display:inline-block;margin:3px 8px 0 0;white-space:nowrap;font-size:calc(11.5px * var(--fs))}
.mvbtn i{font-style:normal;font-size:calc(20px * var(--fs));line-height:1;color:var(--accent-ink)}
.mvbody{margin:6px 0 0;padding:11px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-size:calc(13.5px * var(--fs));line-height:1.75;color:var(--ink)}
.mvbody[hidden]{display:none}
.mvctl{display:flex;align-items:center;gap:10px;margin:0 4px 12px;font-size:calc(13px * var(--fs));color:var(--ink)}
.mvctl span{flex:1}
.mvctl .mvexp{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:calc(12px * var(--fs));font-weight:700;color:var(--sub);cursor:pointer}
.mvopts{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.mvchip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;padding:8px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;text-align:left;color:var(--ink);cursor:pointer}
.mvchip .n{font-size:calc(13px * var(--fs));font-weight:700;white-space:nowrap}
.mvchip .rec{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--sunpill,rgba(240,138,60,.17));color:var(--sunpillink,#b4580f);font-style:normal;font-size:calc(10.5px * var(--fs));font-weight:700;letter-spacing:.02em;vertical-align:1px}
.mvchip[aria-checked="true"] .rec{background:rgba(255,255,255,.9);color:var(--accent-ink)}

.mvbtn{min-height:38px;padding:6px 12px;border-radius:14px}
.card .lbl,.card .name{padding-right:50px}
}
.aibtn{font:inherit;font-size:12px;border:1px solid var(--line,#ddd);background:transparent;color:inherit;border-radius:999px;padding:3px 10px;cursor:pointer}
.mvgl-b button.aibtn{font-family:inherit;cursor:pointer;margin:0}.aikey{margin:10px 0;border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 10px}.aikey summary{cursor:pointer;font-weight:600;font-size:13px}.aikey .fld{margin:8px 0}.aikey input,.aikey select{width:100%;box-sizing:border-box}
.akline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.akline>span{font-size:13px;font-weight:600}.akline .akedit{flex:1 1 100%}
.smmv .smmvt{display:flex;flex-direction:column;gap:2px;white-space:normal;min-width:0}.smmv .smmvt small{font-size:calc(10.5px * var(--fs));font-weight:500;line-height:1.35;color:var(--sub)}
.mvgl .mvgl-b{flex-direction:row;flex-wrap:nowrap;align-items:stretch;gap:8px}.mvgl .mvgl-grp{flex:1 1 0;min-width:0}.mvgl .mvgl-grp a{flex-direction:column;gap:3px;min-height:56px;font-size:calc(12px * var(--fs)) !important}.mvgl .mvgl-grp{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);overflow:hidden}.mvgl .mvgl-grp a{flex:1 1 0;min-width:0;border:0;border-radius:0;background:transparent;min-height:36px;padding:0 6px}.mvgl .mvgl-grp a+a{border-left:1px solid var(--line)}.mvgl .mvgl-b button.aibtn{flex:0 0 31%;width:auto;min-height:56px;flex-direction:column;gap:3px;line-height:1.25;padding:0 6px;text-align:center;border:1px solid var(--accent);background:var(--accent);color:var(--on);font-size:calc(14px * var(--fs));font-weight:800;box-shadow:none}
.mvgl .mvgl-b button.aibtn svg.emo{width:30px;height:30px;filter:saturate(1.3) drop-shadow(0 0 .6px var(--on)) drop-shadow(0 0 .6px var(--on)) drop-shadow(0 1px 1px color-mix(in srgb,var(--on) 45%,transparent))}

/* 카드 추가 박스: 아이콘 위, 글자 아래의 한 줄 타일 */
.addbox{padding:14px 12px 12px;border-radius:24px;background:linear-gradient(180deg,var(--card),var(--paper));box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(0,0,0,.18)}
.addbox .stayadd.eadd-top{grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 0}
.addbox .stayadd.eadd-top .eadd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:62px;padding:8px 2px 7px;border-radius:18px;border:1px solid var(--line);background:var(--paper);font-size:calc(11.5px * var(--fs));font-weight:700;line-height:1.1;color:var(--ink);transition:transform .12s,background .15s,border-color .15s}
.addbox .stayadd.eadd-top .eadd svg{width:1.75em;height:1.75em;margin:0;vertical-align:0;color:var(--accent-ink)}
.addbox .stayadd.eadd-top .eadd:active{transform:scale(.95)}
.addbox .stayadd.eadd-top .eadd:hover{background:var(--accent);color:var(--on);border-color:var(--accent)}
.addbox .stayadd.eadd-top .eadd:hover svg{color:var(--on)}

/* 꼭 가야 할 곳(★) 버튼: 일몰·야경 버튼 왼쪽 */
.schedbtn.mustbtn{filter:none;color:var(--sub);font-size:17px;font-weight:800}
.schedbtn.mustbtn.on{color:#f2b632;border-color:transparent;background:var(--sunpill)}

/* 출국·귀국 항공 카드 */
.immgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.immgrid>div{padding:9px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);min-width:0}
.immgrid dt{margin:0 0 2px;font-size:calc(11px * var(--fs));font-weight:700;color:var(--sub)}
.immgrid dd{margin:0;font-size:calc(15px * var(--fs));font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.immgrid .wide{grid-column:1/-1}
.immempty{margin:10px 0 2px;font-size:calc(13px * var(--fs));color:var(--sub)}

/* 갈림길(안) 선택: 가로 세그먼트 + 연한 색 상자로 묶어 3안 이상도 한눈에 */
.brs2{gap:5px;padding:4px 6px 4px 4px;border-radius:18px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent)}

.brsb{border:0;padding:3px 10px;white-space:nowrap;text-align:center}
.brt{flex-direction:column;gap:3px;padding:0}
.brt button{width:22px;height:22px;font-size:13px}.brt button svg{width:12px;height:12px}
/* ⋯ 대신 연필 아이콘: 편집 메뉴임이 보이게 */
.cmore svg{width:15px;height:15px;opacity:.8;pointer-events:none}
.cchip.cchip-add{white-space:nowrap}

.brsb em{font-style:normal;font-weight:600;font-size:.88em;margin-left:3px;display:inline-block;max-width:3.6em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;opacity:.9}

/* 안 버튼: 안마다 따로 작은 상자 */
.brsw{padding:0;border:0;background:transparent;border-radius:0;gap:4px}
.brsb{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:3px 9px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.brsb[aria-checked="true"]{border-color:var(--accent-ink)}

/* 안(갈림길): 안마다 한 줄 상자로 세로 병렬 배치 */
.brl{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;margin:0 6px 0 0;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent-ink) 28%,transparent)}
.brln{display:flex;align-items:center;gap:5px;padding:2px 4px 2px 3px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.brln.on{border-color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 22%,var(--paper))}
.brlh{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.4em;max-width:5.6em;padding:2px 6px;border:0;border-radius:9px;background:transparent;color:var(--sub);font:inherit;font-size:calc(11.5px * var(--fs));font-weight:800;line-height:1.15;cursor:pointer}
.brln.on .brlh{background:var(--accent-ink);color:var(--bg)}
.brlh em{font-style:normal;font-weight:600;font-size:.86em;max-width:5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brln .brc{gap:4px}

.brln .tab small{display:none}
.brln .brt{flex-direction:row;gap:3px}
.brln .brt button{width:22px;height:22px}

/* 안 상자와 앞뒤 일차를 잇는 점선: 상자 세로 중앙, 점선 */
.brl{position:relative;margin:0 15px}
.brl::before,.brl::after{top:50%;width:15px;height:0;border-top:2px dotted var(--accent-ink);border-left:0;transform:translateY(-1px)}
.brl::before{left:-15px}.brl::after{right:-15px}

/* 안 이름은 줄을 바꿔 최대한 다 보이게 */
.brlh{max-width:8.5em;min-width:4.2em}
.brlh em{max-width:none;overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;text-align:center;font-size:.8em;line-height:1.15}

/* 일차 제목 옆 수정 버튼: 도시·일차 줄의 수정 버튼과 같은 점선 상자 */
.dtedit{width:34px;height:30px;margin-top:6px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--sub)}
.dtedit svg{width:15px;height:15px;opacity:.8}

/* 좁은 화면·큰 글씨에서도 이동 링크 줄이 칸을 넘지 않게 */
.mvgl .mvgl-grp a{font-size:clamp(9.5px,3.1vw,calc(12px * var(--fs))) !important;white-space:nowrap;letter-spacing:-.02em}
.mvgl .mvgl-b button.aibtn{font-size:clamp(10.5px,3.5vw,calc(14px * var(--fs)));word-break:keep-all;overflow-wrap:normal;padding:0 4px;min-width:0;line-height:1.2}
.mvgl .mvgl-b button.aibtn svg.emo{width:clamp(22px,7.5vw,30px);height:clamp(22px,7.5vw,30px)}

/* 카드 제목줄: 오른쪽 수정 버튼·스위치와 겹치지 않게 자리를 비우고, 아이콘은 좁으면 다음 줄로 */
.card .lbl,.card .name{padding-right:112px}
.card .name{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:6px}
.card .name .schedrow{display:inline-flex;margin:0;flex:0 0 auto;vertical-align:0}

.card .lbl{padding-right:0;max-width:calc(100% - 112px);flex-wrap:wrap}
li.stop[data-kind="sunset"] .card .lbl{padding:4px 11px;row-gap:3px;border-radius:16px}

/* AI 이동편 검색 버튼: 실제 기기(글자 크기 설정이 큰 경우)에서도 아이콘+글자가 칸 안에 확실히 들어가게 */
.mvgl .mvgl-b{align-items:stretch}
.mvgl .mvgl-b button.aibtn{min-height:68px;height:auto;padding:8px 4px 10px;gap:3px;justify-content:center;line-height:1.15;font-size:clamp(10.5px,3.2vw,calc(13.5px * var(--fs)));overflow:visible;box-sizing:border-box}
.mvgl .mvgl-b button.aibtn svg.emo{width:clamp(22px,6.2vw,26px);height:clamp(22px,6.2vw,26px);flex:0 0 auto}
.mvgl .mvgl-grp a{min-height:68px}
.hero .eyebrow{padding-right:132px;line-height:1.5}
</style>
</head>

<script>
/* ============================================================
   1) 여행 데이터 — 새 여행은 TRIP.days 와 NOTES 두 블록만 바꾸면 됩니다.

   ※ 화면의 "✎ 편집"으로 고친 내용은 db에 저장되며, 저장본이 있으면 이 기본값보다 우선합니다.

   일정(days[].stops[])
     kind  : main(일정) | sunset(일몰·야경) | meal(식사) | stay(숙소: stay:"prev" 전일 숙박 = 일차 맨 앞 · "night" 당일 숙박 = 일차 맨 끝, 일몰·야경 칩 없음)     off: true 이면 꺼진 일정(걸음 수에서 제외, 화면에서 켜고 끌 수 있음)
     q     : 구글 지도 검색어   wiki : 나무위키 문서 제목   wp : 위키백과 문서 제목 (나무위키가 없을 때)   yt : 유튜브 검색어
     steps : 예상 걸음 수       price: 금액(금액 함께)
     tagline: 한 줄 문구(이름 아래 강조)   hours: 영업시간(계절이 다르면 "동절기(10/19~3/19) 월~일 10:00–18:00" 줄과 "하절기(3/20~10/18) 월~일 09:30–19:00" 줄, 항상 같으면 "연중 월~일 10:00–18:00", 휴무는 마지막 줄 "휴무 12월 25일, 1월 1일")   memo: 장소 설명(**굵게** 가능)   tip: 현장 팁
     note  : 가이드 id  → 카드에 "가이드 보기" 줄이 생기고 해당 글로 이동

   가이드(NOTES[])
     id(영문·숫자·하이픈) · cat(분류) · title · lead(한 줄 요약) · links{q,wiki,yt}
     blocks: h(소제목) p(문단) list(목록) steps(번호 목록) facts(핵심 정보)
             table(표) tip(팁) photo(사진 칸)
     글 안 링크: [글자](note:다른글id) 또는 [글자](https://...), 굵게 **글자**
     "관련 일정" 칩은 stop.note 로 자동 생성되고, 글에서 일정으로 돌아가는 길도 자동입니다.
   ============================================================ */
let TRIP = {stub:true,eyebrow:"",tags:[],palette:"lime",cover:"",title:"불러오는 중",subtitle:"",days:[{tab:"1일차",sub:"",city:"",title:"불러오는 중",routeMode:"walking",route:[],stops:[]}]};
let NOTES = [];

/* ============================================================
   2) 렌더러
   ============================================================ */
const $ = (s,el=document)=>el.querySelector(s);
const enc = encodeURIComponent;
const mapUrl  = q => "https://www.google.com/maps/search/?api=1&query="+enc(q);
/* 예전 "선택 일정"은 이제 꺼진 일정(off)으로 바꿔 불러옵니다 */
const MVI={walk:"🚶",metro:"🚇",tram:"🚋",bus:"🚌",taxi:"🚕",car:"🚗",cable:"🚡",etc:"🧭"};
const MVN={walk:"도보",metro:"지하철",tram:"트램",bus:"버스",taxi:"택시",car:"자동차",cable:"푸니쿨라·케이블카",etc:"기타"};
const mvOpts = s => (s.mvs||[]).filter(o=>o&&(o.sum||o.text));
function healStays(){ /* 체크인 카드가 있는데 같은 날 당일 숙박 (밤) 카드가 빠져 있으면 채운다 (마지막 장소에서 숙소로 돌아오는 경로가 필요해서) */
  let fixed=false;
  TRIP.days.forEach(dd=>{ dd.stops.filter(x=>x.kind==="stay"&&stayType(x)==="in"&&x.grp).forEach(t=>{
    if(dd.stops.some(x=>x.kind==="stay"&&stayType(x)==="night")) return;
    const c={kind:"stay",stay:"night",name:t.name,grp:t.grp}; copyStay(c,t); placeStay(dd,c); fixed=true; }); });
  return fixed;
}
function normalizeData(){
  try{ fixBranches(); }catch(e){}
  TRIP.days.forEach(d=>{ let seen=false; d.stops=d.stops.filter(s=>{ if(s.kind!=="band") return true; if(s.band==="day"||seen) return false; seen=true; s.band="night"; s.name="야간 일정"; return true; }); }); /* 띠는 하루에 하나: 이 줄부터가 야간 일정 */
  TRIP.days.forEach(d=>d.stops.forEach(s=>{
    if(s.mv&&!s.mvs){ s.mvs=[{mode:s.mvMode||"etc",sum:s.mv,text:s.mvText||""}]; }
    delete s.mv; delete s.mvText; delete s.mvMode;
    if(s.kind==="optional"){ s.kind="main"; s.off=true; }
    if(s.kind==="main"&&/일몰|야경/.test(s.badge||"")) s.kind="sunset";
  }));
}
normalizeData();
const wikiUrl = t => /^https?:\/\//.test(t) ? t : "https://namu.wiki/w/"+enc(String(t).trim().replace(/\s+\(/g,"("));
const wpUrl = t => /^https?:\/\//.test(t) ? t : "https://ko.wikipedia.org/wiki/"+enc(String(t).trim().replace(/ /g,"_"));
const wikiBtn = (n,w) => n ? lnk(wikiUrl(n),ICON.wiki,"나무위키") : w ? lnk(wpUrl(w),ICON.wiki,"위키백과") : "";
const lnk = (href,icon,label) => href
  ? `<a href="${href}" target="_blank" rel="noopener">${icon}${label}</a>`
  : `<span class="off" role="link" aria-disabled="true" title="연결된 링크가 없어요">${icon}${label}</span>`;
const ytUrl   = q => { q=String(q).trim(); if(/^(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(q)) q="https://"+q; return /^https?:\/\//i.test(q)?q.replace(/["<>\s]/g,encodeURIComponent):"https://www.youtube.com/results?search_query="+enc(q); };
const routeUrl = (pts,mode)=>{
  if(pts.length<2) return mapUrl(pts[0]||"");
  const w=pts.slice(1,-1).join("|");
  return "https://www.google.com/maps/dir/?api=1&origin="+enc(pts[0])+"&destination="+enc(pts[pts.length-1])+
    (w?"&waypoints="+enc(w):"")+"&travelmode="+(mode||"walking");
};
const fmt = n => n.toLocaleString("ko-KR");
let FX={}; try{ FX=JSON.parse(localStorage.getItem("tripFx")||"{}")||{}; }catch(e){ FX={}; }
const noWon = s => String(s==null?"":s).replace(/\s*\(약 [\d,~\-–]+원[^()]*\)/g,"").replace(/,\s*약 [\d,~\-–]+원\)/g,")");
function won(s){ s=noWon(s); if(!(FX.eur>0||FX.usd>0||FX.jpy>0)) return s;
  const N="(\\d+(?:,\\d{3})*(?:\\.\\d+)?)", num=x=>parseFloat(x.replace(/,/g,""));
  const f=(a,b,r)=>{ const g=v=>(Math.round(v*r/10)*10).toLocaleString("ko-KR"); return " (약 "+g(a)+(b!=null?"~"+g(b):"")+"원)"; };
  return s.replace(new RegExp("(€|(?:US)?\\$|¥)\\s?"+N+"(?:\\s?[~–-]\\s?(?:[€$¥]\\s?)?"+N+")?|"+N+"(?:\\s?[~–-]\\s?"+N+")?\\s?엔","g"),(m,c,a,b,ja,jb)=>{
    if(c==="€"&&FX.eur>0) return m+f(num(a),b?num(b):null,FX.eur);
    if(c&&c!=="€"&&c!=="¥"&&FX.usd>0) return m+f(num(a),b?num(b):null,FX.usd);
    if(c==="¥"&&FX.jpy>0) return m+f(num(a),b?num(b):null,FX.jpy/100);
    if(ja&&FX.jpy>0) return m+f(num(ja),jb?num(jb):null,FX.jpy/100);
    return m; }); }

function sunFlags(s){ const b=s.badge||""; let sun=/일몰/.test(b), night=/야경/.test(b); if(s.kind==="sunset"&&!sun&&!night) sun=true; return {sun:s.kind==="sunset"&&sun,night:s.kind==="sunset"&&night}; }
function sunLabel(s){ const f=sunFlags(s), b=s.badge||""; if(b&&!/^(일몰|야경|일몰·야경)( 추천| 일정)?$/.test(b)) return b; return (f.sun&&f.night?"일몰·야경":f.night?"야경":"일몰")+" 일정"; }
/* 일몰·야경 "일정" (kind:"sunset" + badge, 보는 사람이 지정)과 "추천 장소" (rec: sun|night|both|none, 편집자가 장소 자체에 지정)는 서로 다른 설정이다.
   rec가 비어 있는 예전 카드는 일정 지정에서 추천 여부를 물려받는다. */
function recOf(s){ const r=s&&s.rec; if(r===undefined){ if(!s||s.kind!=="sunset") return {sun:false,night:false}; const f=sunFlags(s); return {sun:f.sun,night:f.night}; } return {sun:r==="sun"||r==="both",night:r==="night"||r==="both"}; }
function recStrOf(s){ const r=recOf(s); return r.sun&&r.night?"both":r.sun?"sun":r.night?"night":"none"; }
function sunEmoji(s){ const f=sunFlags(s); return (f.sun?"🌅":"")+(f.night?"🌃":""); }
const pad2 = n => String(n).padStart(2,"0");
const noteById = id => NOTES.find(n=>n.id===id);

/* 인라인 문법: **굵게**, [글자](note:id), [글자](https://...) */
function inline(t){
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\(note:([a-z0-9-]+)\)/g,'<a class="in" href="#note-$2" data-go="note-$2">$1</a>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a class="in" href="$2" target="_blank" rel="noopener">$1</a>');
}

/* ---------- 내비게이션 ---------- */
const bcity=d=>(d&&(d.base||d.city))||"";
/* 앞 일차에 이어지는 일차 (cont): 같은 날 도시가 바뀌는 날 (예: 바르셀로나 출발 → 포르투 도착)을 한 탭 안에 나눠 보여 준다 */
const tabSub=i=>{ const gs=grpStart(i), ge=grpEnd(gs), cs=[]; for(let k=gs;k<=ge;k++){ const c=String((TRIP.days[k]||{}).city||"").trim(); if(c&&cs[cs.length-1]!==c) cs.push(c); } if(cs.length) return cs.join("→"); const d=TRIP.days[gs]; return (d&&d.sub)||""; }; /* 일차 칩에는 도시만 (같은 날 다른 도시로 가면 A→B) */
const grpStart=i=>{ i=Math.max(0,Math.min(i|0,TRIP.days.length-1)); while(i>0&&TRIP.days[i]&&TRIP.days[i].cont) i--; return i; };
const grpEnd=i=>{ let j=i; while(TRIP.days[j+1]&&TRIP.days[j+1].cont) j++; return j; };
const dayNo=i=>{ const d0=TRIP.days[i], m0=d0&&/^(\d+)일차$/.exec(d0.tab||""); if(m0) return +m0[1]; let n=0; for(let k=0;k<=i&&k<TRIP.days.length;k++) if(!TRIP.days[k].cont&&!(TRIP.days[k].alt&&TRIP.days[k].alt.n>1)) n++; return Math.max(1,n); };
const grpHasCity=(i,c)=>{ for(let k=grpStart(i);k<=grpEnd(grpStart(i));k++) if(bcity(TRIP.days[k])===c) return true; return false; }; /* 같은 날 이어지는 일차 묶음 안에 그 도시 일정이 있으면 그 도시 칩에도 보인다 */

    const chip=({d,i},plain)=>`<button class="tab" role="tab" id="tab-${i}" aria-selected="${i===grpStart(state.day)}" data-go="day-${i+1}" data-dayi="${i}" draggable="true">${esc(d.tab)}<small>${esc(tabSub(i))}</small></button>`;
    let out="", k=0; while(k<items.length){ const it=items[k];

const LANGKW={

function mealKw(n,lang){ n=String(n||""); const K=LANGKW[lang]||LANGKW.en;
  if(/아침|브런치/.test(n)) return K.b; if(/점심/.test(n)) return K.l; if(/저녁|디너|만찬/.test(n)) return K.d; if(/간식|카페|커피|디저트/.test(n)) return K.s; return K.r; }

function safeMapUrl(u){

function depHub(m){ return DEP_HUB[m]||"다음 도시"; }
function depName(m,city){ return ({flight:"공항으로 이동",train:"기차역으로 이동",bus:"버스 터미널로 이동"}[m])||((city||"다음 도시")+" 이동"); }
function arrName(m,city){ return ({flight:"공항 도착",train:"기차역 도착",bus:"버스 터미널 도착"}[m])||((city||"새 도시")+" 도착"); }
function ensureArrCard(di){ /* 도시 이동으로 도착하는 일차의 맨 처음에 도착 교통편 카드를 만든다 */
  const d=TRIP.days[di]; if(!d||!d.moveMode||!d.city||d.stops.some(s=>s.arr)) return;
  d.stops.unshift({kind:"main",name:arrName(d.moveMode,d.city),memo:"",arr:1,transit:1,badge:"교통편"});
}
function ensureDepMove(ci){ /* ci: 새 도시 이동 일차의 위치. 그 앞 일차(전 도시)의 맨 마지막에 도시 이동 카드를 만든다. 마지막 장소에서 이 카드까지의 이동편은 자동으로 계산된다 */
  const di=ci-1, m=depMove(di); if(!m) return; const d=TRIP.days[di];
  if(d.stops.some(s=>s.dep)) return;
  d.stops.push({kind:"main",name:depName(m,TRIP.days[ci].city),memo:"",dep:1,badge:"교통편"});
}
function nextVis(d,i){ for(let j=i+1;j<d.stops.length;j++) if(!d.stops[j].off&&d.stops[j].kind!=="meal"&&d.stops[j].kind!=="band") return d.stops[j]; return null; }
function legLookup(s,nm){
  const m=mvOpts(s); if(m.length&&(s.mvFor===undefined||s.mvFor===nm)) return {opts:m,h:s,sel:"mvSel",kind:"main"};
  const so=(s.mvsSkip||[]).filter(legOk); if(so.length&&s.mvsSkipFor===nm) return {opts:so,h:s,sel:"mvSelSkip",kind:"skip"};
  const a=s.mvAuto&&s.mvAuto[nm]; if(a&&Array.isArray(a.opts)&&a.opts.filter(legOk).length) return {opts:a.opts.filter(legOk),h:a,sel:"sel",kind:"auto"};
  return null;
}

/* 하루 총 운전거리·시간: 선택한 이동편 중 mode가 car인 구간의 거리(km)와 시간을 더한다 (범위는 가운데 값) */
function parseMins(sum){
  const seg=String(sum||"").split("·")[0].replace(/약|운전|렌터카|자동차|이내|택시/g,"").trim(); if(!/(시간|분)/.test(seg)) return null;
  const parts=seg.split("~").map(x=>x.trim()).filter(Boolean); const hasMin=/분/.test(seg), hasH=/시간/.test(seg); const vals=[];
  for(const q of parts){ const h=q.match(/(\d+)\s*시간/), m=q.match(/(\d+)\s*분/); let v=0;
    if(h) v+=parseInt(h[1],10)*60; if(m) v+=parseInt(m[1],10);
    if(!h&&!m){ const b=q.match(/^(\d+)$/); if(b) v=parseInt(b[1],10)*(hasMin?1:(hasH?60:1)); else continue; }
    vals.push(v); }
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
function driveInfo(d){
  let km=0, mins=0, legs=0, noKm=0, noMin=0;
  (d.stops||[]).forEach((s,i)=>{ const c=mvCtx(d,i); if(!c||!c.opts||!c.opts.length) return;
    const k=Math.min(Math.max((c.h[c.sel]|0),0),c.opts.length-1), o=c.opts[k]; if(!o||o.mode!=="car") return;
    legs++; const m=String(o.sum||"").match(/(\d+(?:\.\d+)?)\s*km/i); if(m) km+=parseFloat(m[1]); else noKm++;
    const t=parseMins(o.sum); if(t!=null) mins+=t; else noMin++; });
  return {legs,km,mins,noKm,noMin};
}
function fmtMins(m){ m=Math.round(m/5)*5; const h=Math.floor(m/60), r=m%60; return (h?h+"시간":"")+(r?(h?" ":"")+r+"분":"")||"0분"; }
function driveHTML(d){
  const r=driveInfo(d); if(!r.legs) return "";
  return `<div class="drive"><span class="di" aria-hidden="true">🚗</span><div><b>총 운전 약 ${Math.round(r.km)}km · 약 ${fmtMins(r.mins)}</b><small>선택한 이동편 중 자동차 ${r.legs}구간 합계</small></div></div>`;
}
function mvCtx(d,i){
  const s=d.stops[i]; if(!s||s.off||s.kind==="meal"||s.kind==="band") return null; const nx=nextVis(d,i); if(sameLodge(s,nx)) return null;
  const L=legLookup(s,nx?nx.name:""); if(!L) return null;
  L.nx=nx; L.skip=L.kind==="skip"; return L;
}
function mvKeys(di){
  const d=TRIP.days[di]; if(!d) return [];
  return d.stops.map((x,i)=>{ const c=mvCtx(d,i); return c&&(c.opts[0].text||c.opts.length>1)?di+"-"+i:null; }).filter(Boolean);
}
/* 이동편의 역·정류장 안내 박스 (stn)와 구글 지도 연결 (mp: "탑승: 검색어" 줄 모음) */
/* 걸음수 → 거리 (1km당 약 1,300보). 이미 거리가 적혀 있으면 그대로 둔다 */
function stepsToDist(n){ const m=n/1.3; if(m<1000) return Math.max(10,Math.round(m/10)*10)+"m"; return (Math.round(m/100)/10).toString().replace(/\.0$/,"")+"km"; }
function withDist(s){ s=String(s||""); if(/\d\s*(m|km|미터|킬로)\b|\d\s*(미터|킬로)/i.test(s)) return s;
  return s.replace(/약\s*([\d,]+)\s*보/g,(m,n)=>{ const v=parseInt(n.replace(/,/g,""),10); return v>0?"약 "+stepsToDist(v)+" ("+fmt(v)+"보)":m; }); }
function mpParse(mp){ const o=[]; String(mp||"").split("\n").forEach(x=>{ const m=x.match(/^\s*([^:：]+?)\s*[:：]\s*(.+?)\s*$/); if(m) o.push([m[1],m[2]]); }); return o; }
function mvStnHTML(mc){
  const pts=mpParse(mc.mp);
  const rows=String(mc.stn||"").split("\n").filter(x=>x.trim()).map(x=>{
    const m=x.match(/^\s*(탑승|하차|환승|도보)\s*[:：]\s*(.*)$/);
    if(!m) return `<div><b></b><span>${esc(x)}</span></div>`;
    const pt=pts.find(q=>q[0]===m[1]);
    return `<div><b>${m[1]}</b><span>${esc(m[1]==="도보"?withDist(m[2]):m[2])}${pt?`<a class="mvpin" href="${mapUrl(pt[1])}" target="_blank" rel="noopener">지도</a>`:""}</span></div>`;
  });
  let route="";
  if(pts.length>=2){
    const a=pts.find(q=>q[0]==="탑승")||pts[0], b=[...pts].reverse().find(q=>q[0]==="하차")||pts[pts.length-1];
    if(a[1]!==b[1]) route=`<a class="mvroute" href="${routeUrl([a[1],b[1]],"transit")}" target="_blank" rel="noopener">${ICON.map}탑승 → 하차 경로 (구글 지도)</a>`;
  }
  return (rows.length?`<div class="mvstn">${rows.join("")}</div>`:"")+route;
}
/* 선택한 이동편의 걸음 수 (wk) 합계. 화면에 이동 줄이 보이는 구간만, 이동 보기가 켜져 있을 때만 센다 */
function dayMoveSteps(d){
  if(!state.mvOn) return 0;
  return d.stops.reduce((t,s,i)=>{
    const c=mvCtx(d,i); if(!c) return t;
    const o=c.opts[Math.min(Math.max(c.h[c.sel]|0,0),c.opts.length-1)];
    return t+(parseInt(o.wk,10)||0);
  },0);
}

/* ===== 이동편 자동 생성 =====
   장소를 껐다 켜거나 삭제·추가·순서 변경해서 "앞 장소 → 다음 방문 장소"가 새로 이어졌는데 맞는 이동편이 없으면,
   Claude (sample 기능)에게 그 구간 이동편을 만들게 해 앞 장소의 mvAuto[도착 장소 이름]에 저장한다.
   이미 있는 이동편 (직접 쓴 것, 건너뛰기용, 이전에 만든 것)은 덮어쓰지 않는다. */
const legState=new Map(); // "출발>도착" -> {st:"pending"|"fail", msg}
let lastPairs=null, legTimer=null, legFlag=new Set(), legChain=Promise.resolve(), legBlocked=false;
function prevDay(di){ /* 바로 앞 일차. 갈림길 2안 이상의 첫날은 갈림길이 시작되기 전 일차를 앞으로 본다 (다른 안의 마지막 날이 아니다) */
  const d=TRIP.days[di]; if(!d) return null;
  if(d.alt&&d.alt.n>1){ const p=TRIP.days[di-1]; if(p&&p.alt&&p.alt.g===d.alt.g&&p.alt.n!==d.alt.n){ let k=di-1; while(k>=0&&TRIP.days[k].alt&&TRIP.days[k].alt.g===d.alt.g) k--; return TRIP.days[k]||null; } }
  return TRIP.days[di-1]||null;
}
function depLanes(g,arr){ /* 갈림길 g의 모든 안의 마지막 날(도착일 바로 앞)에 도시 이동 카드를 만든다 */
  const m=arr&&arr.moveMode; if(!m) return; const last={}; TRIP.days.forEach((x,i)=>{ if(x.alt&&x.alt.g===g) last[x.alt.n]=i; });
  Object.keys(last).forEach(n=>{ let i=last[n]; while(i>0&&(TRIP.days[i].moveMode||TRIP.days[i]===arr)) i--; const d=TRIP.days[i]; if(!d||d===arr||d.stops.some(s=>s.dep)) return; d.stops.push({kind:"main",name:depName(m,arr.city),memo:"",dep:1,badge:"교통편"}); });
}
function depBackfill(){ /* 도시 이동 직전 일차에 도시 이동 카드가 없으면 한 번만 채운다 */
  if(!TRIP.arrV1){ TRIP.arrV1=1; TRIP.days.forEach((d,i)=>{ if(d.moveMode&&d.city) ensureArrCard(i); }); }
  if(TRIP.depV1) return; TRIP.depV1=1; const keys=[];
  TRIP.days.forEach((d,i)=>{ if(depMove(i)&&!d.stops.some(s=>s.dep)){ ensureDepMove(i+1); keys.push(i); } }); return keys;
}
function arrSyncAll(){ TRIP.days.forEach(d=>{ const c=d.stops.filter(s=>s.arr); if(!c.length) return; const nm=String(d.fArr||"").trim(), url=safeMapUrl(d.fArrUrl)?d.fArrUrl:"";
    c.forEach(s=>{ s.badge="교통편"; s.transit=1; delete s.dur; if(!d.moveMode){ return; } s.name=(s.nameAuto===0)?s.name:(s.name||arrName(d.moveMode,d.city));
      if(nm||url){ s.q=urlQuery(url)||nm; if(url) s.url=url; else delete s.url; if(!s.memo||s.arrMemo){ s.memo="도착지: "+(nm||"지도 링크"); s.arrMemo=1; } }
      else { delete s.q; delete s.url; if(s.arrMemo){ s.memo=""; delete s.arrMemo; } } }); }); }
function depSyncAll(flag){
  arrSyncAll(); /* 도시 이동 카드에 도착 도시 일차의 출발지(구글 지도로 확인되는 공항·역·정류장)를 표시하고, 있으면 마지막 장소에서의 이동편을 계산하도록 표시한다 */
  TRIP.days.forEach((d,i)=>{ const c=d.stops.filter(s=>s.dep); if(!c.length) return; let arr=depMove(i)?TRIP.days[i+1]:null;
    if(!arr&&d.alt){ let j=i+1; while(TRIP.days[j]&&TRIP.days[j].alt&&TRIP.days[j].alt.g===d.alt.g) j++; const t=TRIP.days[j]; if(t&&t.moveMode&&t.city) arr=t; }
    if(!arr) return; const nm=String(arr.fDep||"").trim(), url=safeMapUrl(arr.fDepUrl)?arr.fDepUrl:"";
    c.forEach(s=>{ s.badge="교통편"; delete s.dur; if(nm||url){ s.q=urlQuery(url)||nm; if(url) s.url=url; else delete s.url; if(!s.memo||s.depMemo){ s.memo="출발지: "+(nm||"지도 링크"); s.depMemo=1; } }
      else { delete s.q; delete s.url; if(s.depMemo){ s.memo=""; delete s.depMemo; } } }); });
  if(flag) pairList().forEach(p=>{ if(p.nx.dep&&p.nx.q) legFlag.add(p.key); });
}
function sameLodge(a,b){ return !!(a&&b&&a.kind==="stay"&&b.kind==="stay"&&(a.grp&&a.grp===b.grp||((a.name||"").trim()&&(a.name||"").trim()===(b.name||"").trim()))); } /* 체크인 카드와 같은 숙소의 당일 숙박 카드는 이동 구간이 아니다 */
function pairList(){
  const a=[]; TRIP.days.forEach((d,di)=>d.stops.forEach((s,i)=>{ if(s.off||s.kind==="meal"||s.kind==="band") return; const nx=nextVis(d,i); if(nx&&!sameLodge(s,nx)) a.push({di,i,s,nx,key:s.name+">"+nx.name}); }));
  return a;
}
function bindLegs(){ /* 아직 도착 장소가 기록되지 않은 이동편은 목록에서 바로 다음 장소에 묶는다 (이동편은 원래 그 장소를 기준으로 쓰였다.
   미방문이어서 건너뛴 장소가 아니라, 원래 의도한 도착 장소여야 엉뚱한 곳으로 이어지지 않는다) */
  TRIP.days.forEach(d=>d.stops.forEach((s,i)=>{ if(s.off||s.kind==="meal"||s.kind==="band") return; let k=i+1; while(d.stops[k]&&d.stops[k].kind==="band") k++; const nx=d.stops[k];
    if(mvOpts(s).length&&s.mvFor===undefined) s.mvFor=nx?nx.name:""; }));
}
function legInit(){ bindLegs(); lastPairs=new Set(pairList().map(p=>p.key)); }
function legSync(noGen){
  bindLegs(); const pl=pairList(), keys=new Set(pl.map(p=>p.key));
  if(lastPairs&&!noGen) pl.forEach(p=>{ if(!lastPairs.has(p.key)&&!isPlaceholder(p.s)&&!isPlaceholder(p.nx)) legFlag.add(p.key); });
  lastPairs=keys;
  if(legFlag.size){ clearTimeout(legTimer); legTimer=setTimeout(legRun,1200); }
}
/* 식사 카드는 식당 후보 (picks)가 있어야 구간을 만들 수 있다. 미정이면 건너뛴다 */
function legPlace(s,d){
  if(s.kind==="band") return null;
  if(s.kind==="meal"){ const mq=urlQuery(s.url)||s.q; if(mq) return {name:s.name,q:mq}; const pk=(s.picks||[])[0]; return pk&&pk.name?{name:s.name+" ("+pk.name+")",q:pk.name+" "+((d&&d.city)||"")}:null; }
  if(s.kind==="stay"){ if(isPlaceholder(s)) return null; const q=urlQuery(s.url)||s.q; return q?{name:s.name,q}:null; } /* 숙소: 구글 지도 검색어나 링크가 있어야 위치를 아는 것으로 본다 (이름만으로 추측하지 않는다) */
  const q=urlQuery(s.url)||s.q; if(!q) return null; /* 구글 지도로 위치를 확인할 수 없는 장소 (검색어·지도 링크가 없음)는 이동편을 자동으로 만들지 않는다 */
  return {name:s.name,q};
}
function legPlaceLoose(s,d){ /* 구글 지도 동선 링크용: 정확한 검색어가 없으면 장소 이름 + 도시로 찾는다 (식당은 이름이 확정된 경우만) */
  const p=legPlace(s,d); if(p) return p; if(!s||s.kind==="band"||s.kind==="meal") return null; if(s.kind==="stay"&&isPlaceholder(s)) return null;
  const n=String(s.name||"").trim(); if(!n) return null; const c=String((d&&d.city)||"").trim(); return {name:n,q:n+(c&&n.indexOf(c)<0?" "+c:"")}; }
function legRun(){ legFlag=new Set(); return; /* 이동편 자동 생성은 쓰지 않는다 (구글 지도 길찾기 링크로 대체) */
  const flagged=legFlag; legFlag=new Set(); const now=pairList();
  const todo=[]; now.forEach(p=>{ if(!flagged.has(p.key)||legLookup(p.s,p.nx.name)||legState.get(p.key)) return; const d=TRIP.days[p.di]; if(!legPlace(p.s,d)||!legPlace(p.nx,d)) return; todo.push(p); });
  legGenMany(todo);
}
/* 같은 일차에서 이동편이 필요한 구간이 둘 이상이면 Claude에게 한 번에 묻는다 (구간마다 따로 묻는 것보다 빠르고 가볍다) */
function legGenMany(pairs){
  const by=new Map(); pairs.forEach(p=>{ if(!by.has(p.di)) by.set(p.di,[]); by.get(p.di).push(p); });
  by.forEach(list=>{ if(list.length<2) list.forEach(p=>genLeg(p)); else genLegBatch(list); });
}
function genLegBatch(list){ return;
  list=list.filter(p=>!(legState.get(p.key)&&legState.get(p.key).st==="pending")); if(list.length<2) return list.forEach(p=>genLeg(p));
  list.forEach(p=>legState.set(p.key,{st:"pending"})); refresh();
  legChain=legChain.then(()=>genLegBatchRun(list)).catch(()=>{});
}
function legBatchPrompt(list){
  const d=TRIP.days[list[0].di]||{}, seq=(d.stops||[]).filter(x=>!x.off).map(x=>x.name).join(" → ");
  const items=list.map((p,k)=>{ const a=legPlace(p.s,d), b=legPlace(p.nx,d); return `${k+1}. 출발: ${a.name} (구글 지도 검색어: ${a.q}) → 도착: ${b.name} (구글 지도 검색어: ${b.q})`; }).join("\n");
  const one=legPrompt(list[0]), rules=one.slice(one.indexOf("규칙:")).replace(/- JSON 배열만 출력하세요[^\n]*/,'- JSON 객체만 출력하세요 (설명, 코드 블록 금지). 키는 구간 번호 ("1", "2", …), 값은 그 구간의 이동편 배열입니다. 구간마다 이동편 2~3개, 첫 번째가 추천입니다.');
  return `여행 가이드 앱에서 같은 날 여러 구간의 이동편을 한꺼번에 만들어 주세요.
도시·일정: ${d.city||""} ${d.title||""}
하루 일정 순서 (방문 장소만): ${seq}
이 날의 기본 이동 방식: ${d.routeMode==="driving"?"자동차":d.routeMode==="transit"?"대중교통":"도보"}
만들 구간:
${items}

${rules}`;
}
async function genLegBatchRun(list){
  if(legBlocked) return list.forEach(p=>legManual(p));
  let sample=null;
  try{ if(canWriteMaster&&typeof claude!=="undefined"&&claude&&claude.use) sample=await claude.use("sample"); }catch(e){}
  if(!sample){ legBlocked=true; return list.forEach(p=>legManual(p)); }
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),90000);
  try{
    const r=await sample(legBatchPrompt(list),{modelTier:"default",cache:false,signal:ac.signal});
    let txt=String(r&&r.text||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
    const a=txt.indexOf("{"), b=txt.lastIndexOf("}"); if(a<0||b<=a) throw new Error("no-json");
    const o=JSON.parse(txt.slice(a,b+1)), miss=[];
    list.forEach((p,k)=>{ const opts=legClean(o[String(k+1)]); if(opts.length){ p.s.mvAuto=p.s.mvAuto||{}; p.s.mvAuto[p.nx.name]={opts,sel:0,at:Date.now()}; legState.delete(p.key); } else miss.push(p); });
    queueSave(); miss.forEach(p=>{ legState.delete(p.key); genLeg(p); }); refresh();
  }catch(e){
    const code=e&&e.code; if(code==="not_granted") legBlocked=true;
    list.forEach(p=>legFail(p,code==="not_granted"?"Claude 호출을 허용하지 않았어요.":code==="rate_limited"?"요청이 많아 잠시 뒤에 다시 시도해 주세요.":"이동 방법을 만들지 못했어요."));
  }finally{ clearTimeout(to); }
}
/* 하루 동선 (구글 지도): 켜 둔 장소만, 화면 순서대로. 직접 입력한 동선 (routeSrc="manual")이면 그것을 쓴다.
   구글 지도 길찾기 주소는 출발+도착+경유 9곳까지라 11곳을 넘으면 고르게 줄인다 */
function dayRoutePts(d){
  let pts=[];

const rootCity=()=>TRIP.rootCity||bcity(TRIP.days[0])||"";
function cityNights(c){ /* 그 도시에서 체크인한 날부터 그 도시의 마지막 날까지의 박 수. 체크인 카드가 없으면 첫날부터 센다 */
  const idx=TRIP.days.map((d,i)=>bcity(d)===c&&!isAltDay(d)?i:-1).filter(i=>i>=0); if(!idx.length) return null;
  let ci=idx[0]; for(const i of idx){ if(TRIP.days[i].stops.some(x=>x.kind==="stay"&&stayType(x)==="in")){ ci=i; break; } }
  return Math.max(0,idx[idx.length-1]-ci);
}
const nightsLabel=n=>n==null?"":n<=0?"당일":`${n}박 ${n+1}일`;
function heroCity(){
  if(state.city) return state.city;

}
function heroData(c){
  const root=c===rootCity(), r=(TRIP.cities&&TRIP.cities[c])||{}, lab=nightsLabel(cityNights(c));
  const fix=t=>(lab&&t)?String(t).replace(/\d+\s*박\s*\d+\s*일/,lab):(t||"");
  const tt=t=>{ const x=String(t||"").replace(/\s*(\d+\s*박\s*\d+\s*일\s*)?여행\s*가이드\s*$/,"").trim(); return x||String(t||""); }; /* 제목에서 "몇 박 며칠 여행 가이드" 문구를 뺀다 */
  const pre=String(TRIP.eyebrow||"Travel guide").split(" · ")[0].trim()||"Travel guide";
  const eb=`${pre} · ${c||""} ${lab}`.replace(/\s+/g," ").trim();
  if(root) return {root,eyebrow:eb,title:tt(fix(TRIP.title)),subtitle:fix(TRIP.subtitle),tags:TRIP.tags||[],cover:TRIP.cover,coverCredit:TRIP.coverCredit,palette:TRIP.palette||"lime"};
  return {root,eyebrow:eb,title:tt(fix(r.title))||c||"여행",subtitle:fix(r.subtitle),tags:(r.tags&&r.tags.length)?r.tags:[c],cover:r.cover,coverCredit:r.coverCredit,palette:r.palette||TRIP.palette||"lime"};
}

function snap(key){

  const now=Date.now();
  if(key&&key===lastSnapKey&&now-lastSnapT<4000&&hi>0){ hist[hi]=p; }
  else { hist=hist.slice(0,hi+1); hist.push(p); if(hist.length>80) hist.shift(); hi=hist.length-1; }
  lastSnapT=now; lastSnapKey=key||null; updUndo();
}
function updUndo(){
  document.querySelectorAll('[data-e="undo"]').forEach(b=>b.disabled=!(hi>0));

function shrink(file,max,q){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*r)); c.height=Math.max(1,Math.round(img.height*r));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error("blob")),"image/jpeg",q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src=url;
  });
}
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+"MB":Math.max(1,Math.round(n/1024))+"KB";
async function saveImage(file){
  setStatus("사진 처리 중…");
  const before=file.size||0, note=b=>before>b.size*1.15?` (${fmtSize(before)} → ${fmtSize(b.size)}로 줄임)`:` (${fmtSize(b.size)})`;
  if(assetsApi){
    try{ const b=await shrink(file,1800,.82); const r=await assetsApi.upload(b); setStatus("사진을 올렸어요"+note(b)); return r.url||("/_blob/"+r.id); }catch(e){}
  }
  const b=await shrink(file,1100,.7);
  const url=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
  setStatus("사진을 이 기기에만 저장했어요"+note(b)+(b.size>1000000?" · 1MB가 넘어 모바일 HTML 내보내기에서 빠질 수 있어요":""));
  return url;
}

  const close=()=>{ ov.remove(); document.removeEventListener("keydown",esc,true); };
  const esc=e=>{ if(e.key==="Escape"){ e.stopPropagation(); close(); } };
  document.addEventListener("keydown",esc,true);

  const setRatio=r=>{ ratio=r===0?W/H:r; if(r===null) B={x:W*.06,y:H*.06,w:W*.88,h:H*.88}; else fit(r); paint(); [...rbar.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.r===String(r)))); };

  img.onerror=()=>{ close(); setStatus("사진을 불러오지 못해 자르기를 열 수 없어요"); };

  let drag=null;
  ov.addEventListener("pointerdown",e=>{
    const c=e.target.dataset&&e.target.dataset.c;
    if(c){ const ax=c.includes("l")?B.x+B.w:B.x, ay=c.includes("t")?B.y+B.h:B.y; drag={k:"rs",ax,ay}; }

    else{
      const sx=px>=drag.ax?1:-1, sy=py>=drag.ay?1:-1, maxW=sx>0?W-drag.ax:drag.ax, maxH=sy>0?H-drag.ay:drag.ay;

function blobToDataUrl(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function shrinkBlob(b){
  try{
    if(!/^image\/(jpeg|png|webp)/.test(b.type)||typeof createImageBitmap!=="function"||typeof document==="undefined") return await blobToDataUrl(b);
    const bm=await createImageBitmap(b); const w=bm.width,h=bm.height;
    if(w<=1200&&b.size<400000) return await blobToDataUrl(b);
    const s=Math.min(1,1200/w); const cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height);
    const u=cv.toDataURL("image/jpeg",0.8); return u.length<b.size*1.4?u:await blobToDataUrl(b);
  }catch(e){ return await blobToDataUrl(b); }
}

    src=src.replace("<head>","<head>\n"+emb);

    if(downloadsApi){ try{ await downloadsApi.save({filename:name,data:src}); expNote("파일로 저장했어요"+(fail?" (사진 "+fail+"장은 못 담았어요)":"")+" · "+(src.length/1048576).toFixed(1)+"MB",false); return; }catch(e){} }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([src],{type:"text/html"})); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    expNote("파일로 저장했어요"+(fail?" (사진 "+fail+"장은 못 담았어요)":"")+" · "+(src.length/1048576).toFixed(1)+"MB",false);
  }catch(e){ expNote("내보내기에 실패했어요. 다시 눌러 주세요.",false); }
  finally{ exporting=false; }
}

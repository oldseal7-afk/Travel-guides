": \"도보: 해변에서 가까운 지하철역까지 약 600보 (약 6분)\\n탑승: Barceloneta역 (L4 노란색) · Trinitat Nova 방면\\n환승: Verdaguer역 (L5 파란색)에서 Cornellà Centre 방면으로 환승\\n하차: Collblanc역 또는 Badal역 부근에서 하차 후 도보 이동\\n도보: 하차 후 캄프 누까지 약 900보 (약 10분)\", \"mp\": \"탑승: Barceloneta metro station Barcelona\\n하차: Collblanc metro station Barcelona\"}, {\"mode\": \"taxi\", \"sum\": \"택시 · 약 20~25분 · 약 6km\", \"cost\": \"약 €12~18\", \"text\": \"바르셀로네타 해변에서 캄프 누까지 택시로 바로 이동합니다. 환승 없이 편하지만 저녁 시간대에는 교통 체증으로 시간이 더 걸릴 수 있습니다.\\n짐이 있거나 일정이 빠듯할 때 알맞습니다.\"}, {\"mode\": \"walk\", \"sum\": \"도보 약 1시간 20분 · 약 7km\", \"cost\": \"무료\", \"wk\": 9100, \"text\": \"해변에서 시내를 가로질러 캄프 누까지 걸어서 이동합니다. 거리가 길어 체력 소모가 크지만 도시 풍경을 천천히 볼 수 있습니다.\\n날씨가 좋고 시간 여유가 있을 때만 추천합니다.\"}], \"sel\": 0, \"at\": 1795151625280}, \"캄프 누\": {\"opts\": [{\"mode\": \"metro\", \"sum\": \"지하철 L5 Verdaguer 방면 환승 후 Les Corts 방면 이동 · 약 40분 · 약 9km\", \"cost\": \"1인 €2.55\", \"wk\": 2500, \"text\": \"바르셀로네타 일대나 숙소 쪽에서 캄프 누로 갈 때는 지하철로 도심을 가로질러 L3 계열 Les Corts 또는 Collblanc 방향으로 이동하는 방법이 가장 무난합니다. 역에서 경기장까지 걷는 구간이 있으니 여유 있게 출발하세요.\\n요금은 1회권 기준이며 T-casual 10회권을 쓰면 회당 더 저렴합니다.\", \"stn\": \"도보: 출발지에서 가까운 지하철역까지 약 500보 (약 5분)\\n탑승: 숙소에서 가까운 L3 또는 L5 역\\n환승: 필요 시 Diagonal, Sants Estació 등 주요 환승역 이용\\n하차: Les Corts 역 (L3 녹색)\\n도보: Les Corts 역에서 캄프 누까지 약 1,500보 (약 15분)\", \"mp\": \"탑승: Passeig de Gracia metro station Barcelona\\n하차: Les Corts metro station Barcelona\"}, {\"mode\": \"bus\", \"sum\": \"시내버스 환승 포함 · 약 45분 · 약 9km\", \"cost\": \"1인 €2.55\", \"wk\": 2000, \"text\": \"지하철 대신 시내버스로 Diagonal 대로를 따라 이동해 캄프 누 인근에서 내리는 방법입니다. 시간대에 따라 지하철보다 느릴 수 있지만 창밖으로 도시 풍경을 볼 수 있습니다.\\n정확한 노선은 구글 지도에서 출발 시각에 맞춰 선택하세요.\", \"stn\": \"도보: 출발지에서 가까운 버스 정류장까지 약 400보 (약 4분)\\n탑승: Diagonal 대로 방면 버스\\n하차: Camp Nou 인근 정류장\\n도보: 정류장에서 캄프 누까지 약 1,600보 (약 12분)\", \"mp\": \"탑승: Barcelona city bus stop Barcelona\\n하차: Camp Nou bus stop Barcelona\"}, {\"mode\": \"taxi\", \"sum\": \"택시 약 25분 · 약 9km\", \"cost\": \"약 €15~20\", \"text\": \"짐이 있거나 늦은 시간에는 택시가 편합니다. 교통 상황에 따라 20~30분 걸립니다.\\n공식 택시 승 \"cat\": \"이동\", \"title\": \"바르셀로나 공항에서 시내로\", \"city\": \"바르셀로나\", \"lead\": \"도착 터미널 (T1·T2)에 맞춰 아에로부스를 타는 방법이 가장 간단합니다.\", \"links\": {\"q\": \"Barcelona Airport El Prat\", \"yt\": \"바르셀로나 공항에서 시내 가는 법\", \"wp\": \"주제프 타라델랴스 바르셀로나 엘프라트 공항\"}, \"blocks\": [{\"t\": \"table\", \"head\": [\"수단\", \"요금\", \"시간·메모\"], \"rows\": [[\"아에로부스 A1 (T1)·A2 (T2)\", \"편도 €7.45, 왕복 €12.85\", \"24시간 운행, 5~20분 간격, 종점 플라사 카탈루냐까지 약 35분. 고딕·엘 본 숙소라면 종점에서 걸어서 10~15분\"], [\"메트로 L9 Sud\", \"공항 전용권 €5.90\", \"약 7분 간격, 시내까지 한 번 환승. 일반 1회권·T-casual은 공항역에서 안 되고 홀라 바르셀로나 카드는 됩니다\"], [\"택시\", \"미터제 약 €35~40\", \"약 30분. 짐이 많거나 일행이 있을 때\"]]}, {\"t\": \"tip\", \"label\": \"추천\", \"text\": \"도착 터미널 (T1·T2)에 맞는 아에로부스를 타고 종점 플라사 카탈루냐에서 내려 걸어가는 방법이 가장 간단합니다.\"}]}, {\"id\": \"ciutadella\", \"cat\": \"도시 가이드\", \"title\": \"개선문과 시우타데야 공원\", \"city\": \"바르셀로나\", \"lead\": \"박람회장이던 공원과 붉은 벽돌 문의 배경입니다.\", \"links\": {\"q\": \"Parc de la Ciutadella Barcelona\", \"yt\": \"시우타데야 공원 바르셀로나\", \"wp\": \"시우타델랴 공원\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"개선문은 1888년 바르셀로나 만국박람회 정문으로 지어진 모데르니스메 초기 건축입니다. 박람회장이던 시우타데야 공원은 18세기 요새 터에 만들었습니다. 공원에는 젊은 가우디가 제작에 참여한 대분수 (카스카다)와 보트 호수, 카탈루냐 의회 건물이 있습니다.\"}, {\"t\": \"h\", \"text\": \"알아둘 것\"}, {\"t\": \"list\", \"items\": [\"개선문과 공원은 모두 무료입니다.\", \"개선문에서 공원까지는 야자수 산책로를 따라 약 5분입니다.\", \"모데르니스메 흐름은 [가우디와 아르누보](note:gaudi)에서 이어서 볼 수 있습니다.\"]}]}, {\"id\": \"gaudi-life\", \"cat\": \"건축·미술\", \"title\": \"가우디의 생애\", \"city\": \"바르셀로나\", \"lead\": \"병약했던 소년에서 사그라다 파밀리아의 건축가, 그리고 무덤의 수난까지 네 시기로 정리했습니다.\", \"links\": {\"wiki\": \"안토니 가우디\", \"yt\": \"안토니 가우디 생애\"}, \"blocks\": [{\"t\": \"h\", \"text\": \"1. 유년 시절: 병약했던 소년, 그림으로 꿈을 찾다 (1852~)\"}, {\"t\": \"list\", \"items\": [\"**출생과 배경:** 스페인 카탈루냐 지방 (레우스 또는 리우돔스)의 주물 장인 집안에서 5남매 중 막내로 태어났습니다.\", \"**건강과 가족:** 어릴 적 류머티즘을 앓아 지팡이를 짚고 다닐 정도로 허약했으며, 건장했던 한 살 위 둘째 형 프란세스크가 늘 업고 다녔습니다. 형과의 각별한 관계와 형의 이른 죽음은 훗날 가우디의 삶에 큰 영향을 미쳤습니다.\", \"**건축가의 계기:** 학업 성적도 좋지 않고 몸도 약했으나, 한 친구가 그의 뛰어난 그림 실력을 알아봐 준 것을 계기로 건축가의 길을 걷게 되었습니다.\"]}, {\"t\": \"h\", \"text\": \"2. 건축가 활동과 평생의 후원자 구엘 (1878~)\"}, {\"t\": \"list\", \"items\": [\"**데뷔와 청년기:** 25세에 바르셀로나 건축전문학교에서 건축사 자격을 취득한 뒤 시청 산하 프로젝트를 맡으며 건강과 수입을 회복했습니다. 술에는 약했지만 미식을 즐기며 예술가들의 카페를 드나들어 인맥을 넓혔습니다.\", \"**명성의 시작:** 첫 주택 〈카사 비센스〉 (1883~1885)와 코미야스 후작가의 별장 작업을 계기로 이름이 알려졌고, 평생의 후원자인 에우세비 구엘 백작을 만났습니다.\", \"**전성기:** 1883년 구엘 가문의 전속 건축가가 되어 막대한 후원을 바탕으로 '구엘'의 이름이 붙은 대작들을 남겼습니다. 동시에 바르셀로나 최고 인기 건축가로서 〈카사 바트요〉, 〈카사 밀라〉 등 다수의 걸작을 설계했습니다.\"]}, {\"t\": \"h\", \"text\": \"3. 사그라다 파밀리아와 비극적인 최후 (1883~1926)\"}, {\"t\": \"list\", \"items\": [\"**미완의 역작:** 1883년부터 평생에 걸쳐 〈사그라다 파밀리아 (성가정 대성당)〉 건설에 매진했으나, 방대한 규모와 재정 문제로 생전 완공을 보지 못했습니다. 생전 공사 속도를 묻는 이들에게 \\\"나의 의뢰인 (하느님)은 서두르지 않으신다\\\"라는 유명한 말을 남겼습니다.\", \"**교통사고와 별세:** 1926년 6월 7일 저녁, 성당 작업장을 나와 산 펠립 네리 성당으로 기도를 드리러 가던 중 그란 비아 대로에서 노면전차에 치였습니다. 남루한 옷차림에 신분증이 없어 노숙자로 오인받는 바람에 택시 승차를 거부당하는 등 구조가 지연되었고, 사흘 뒤인 6월 10일 향년 73세로 세상을 떠났습니다.\", \"**안장:** 6월 12일 국가장에 준하는 애도 속에 장례식이 치러졌으며, 그가 평생을 바친 사그라다 파밀리아 지하묘지 (크립타)에 안장되었습니다.\"]}, {\"t\": \"h\", \"text\": \"4. 사후 무덤 수난기 (1936~1939)\"}, {\"t\": \"list\", \"items\": [\"1936년 스페인 내전 당시 과격주의자들이 지하묘지에 불을 질러 무덤이 훼손될 위기에 처했으나, 과거 제자였던 만화가 리카르트 오피소가 간신히 막아냈습니다.\", \"이후 공화파의 무기가 숨겨져 있을지 모른다는 이유로 경찰에 의해 무덤이 파헤쳐진 채 방치되었다가, 1939년 프랑코 군대가 바르셀로나를 점령한 뒤에야 다시 봉인되었습니다.\"]}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[가우디와 아르누보 보기](note:gaudi) · [사그라다 파밀리아 가이드](note:sagrada)\"}]}, {\"id\": \"gaudi\", \"cat\": \"건축·미술\", \"title\": \"가우디의 건축과 아르누보\", \"city\": \"바르셀로나\", \"lead\": \"자연의 유기적 곡선과 화려한 색채를 건축에 녹여낸 유럽 아르누보의 물결 속에서, 카탈루냐만의 독창적인 모더니즘으로 꽃피운 안토니 가우디의 예술 세계입니다.\", \"links\": {\"wiki\": \"안토니 가우디\", \"wp\": \"안토니 가우디\", \"yt\": \"가우디 건축 바르셀로나\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"가우디는 아르누보의 카탈루냐판인 '모데르니스메' 시기에 활동했으며, 아르누보 양식을 장식에만 쓰지 않고 건축에  적용한 건축가입니다. 일정 속 가우디 작품 4곳을 지은 순서대로 보면 곡선이 구조화되는 변화가 보입니다.\"}, {\"t\": \"h\", \"text\": \"아르누보와 카탈루냐 모데르니스메\"}, {\"t\": \"list\", \"items\": [\"아르누보는 1890~1910년 무렵 유럽 전역에 퍼진 양식입니다. 과거 양식을 베끼는 대신 덩굴·꽃·곤충 같은 자연의 곡선을 장식으로 쓰고, 철과 유리 같은 새 재료와 타일·스테인드글라스·연철 공예를 건축에 끌어들였습니다.\", \"나라마다 이름이 다릅니다. 프랑스·벨기에는 아르누보, 독일은 유겐트슈틸, 빈은 분리파, 이탈리아는 리버티, 카탈루냐는 모데르니스메입니다.\"]}, {\"t\": \"photo\", \"src\": \"img/b720da16bbd13db3ad94c003aa9ec771.jpg\", \"caption\": \"프랑스의 아르누보풍 가구\", \"credit\": \"\"}, {\"t\": \"p\", \"text\": \"**프랑스 낭시 (Nancy)파:** 루이 마조렐 (Louis Majorelle)이 대표적이며 자연의 곡선을 가구 프레임에 녹여낸 최고급 아르누보풍 목재 가구를 제작했습니다. 식물·곤충을 직접 관찰해 유리·가구·조명에 옮기는 공예품 중심이라, 건축을 뒤흔든 가우디와는 아르누보를 다르게 해석했습니다.\"}, {\"t\": \"photo\", \"src\": \"img/0740712db512a9f88bce530d452ae067.jpg\", \"caption\": \"프랑스의 아르누보 작품\"}, {\"t\": \"p\", \"text\": \"**프랑스 파리 (Paris)파:** 알폰스 무하 (Alphonse Mucha)가 대표적이며, 우아한 여인과 화려한 꽃문양, 유려한 선이 어우러진 '무하 스타일'은 상업 포스터를 순수 예술의 반열에 올렸습니다.\"}, {\"t\": \"photo\", \"src\": \"img/50f17108f1a438133bdac3ddb5a158c3.jpg\", \"caption\": \"클림트의 「키스」\"}, {\"t\": \"p\", \"text\": \"**클림트 (빈 분리파):** 구스타프 클림트는 1897년 빈 분리파를 이끈 화가입니다. 금박과 모자이크 같은 무늬로 화려하게 장식한 평면 그림이 특징입니다. 가우디가 건축을 통해 평면이 아닌 공간의 곡선으로 아르누보를 해석했다면 클림트는 회화와 장식으로 해석했다는 점이 다릅니다.\"}, {\"t\": \"h\", \"text\": \"바르셀로나에서 모데르니스메 (아르누보)가 꽃핀 배경\"}, {\"t\": \"p\", \"text\": \"**1. 산업혁명과 신흥 부르주아의 재력 (경제적 배경)**\"}, {\"t\": \"list\", \"items\": [\"**스페인 산업의 심장:** 19세기 중반 스페인에서 가장 먼저 섬유·방적 공업을 중심으로 산업혁명을 이룬 곳이 바로 카탈루냐와 바르셀로나였습니다. 아메리카 식민지 무역 (쿠바 등)에서 큰돈을 벌어 귀향한 자본가 ('인디아노스')들까지 가세하며 막대한 부가 축적되었습니다.\", \"**예술 후원 경쟁:** 새롭게 부상한 산업 자본가 (부르주아)들은 기존의 귀족들과 차별화되는 자신들만의 세련된 취향과 부를 과시하고 싶어 했습니다. 에우세비 구엘 (구엘 공원·저택 후원), 페레 밀라 (카사 밀라), 주제프 바트요 (카사 바트요) 같은 후원자들은 건축가들에게 예산에 구애받지 않는 파격적이고 전위적인 설계를 의뢰했습니다.\"]}, {\"t\": \"p\", \"text\": \"**2. 성벽 철거와 '에이샴플레 (Eixample)' 도시 확장 (공간적 배경)**\"}, {\"t\": \"list\", \"items\": [\"**중세 성벽의 해체 (1854년):** 인구 급증으로 포화 상태에 이른 구시가지 (고딕 지구)를 둘러싸고 있던 중세 성벽이 철거되면서, 드넓은 평야에 새로운 계획도시를 건설할 공간이 열렸습니다.\", \"**세르다의 격자형 신도시:** 도시계획가 일데폰스 세르다 (Ildefons Cerdà)가 설계한 바둑판 모양의 신시가지 에이샴플레 (Eixample, '확장'이라는 뜻)는 부유층의 대저택을 짓기 위한 거대한 빈 캔버스가 되었습니다. 특히 중심대로인 **그라시아 거리 (Passeig de Gràcia)** 일대는 부호들이 서로 더 화려하고 독창적인 건물을 짓기 위해 경쟁하는 '모데르니스메의 전시장' (불화의 사과 블록 등)으로 변모했습니다.\"]}, {\"t\": \"p\", \"text\": \"**3. 카탈루냐 문화 부흥 운동 '레나이셴사 (Renaixença)' (정신적 배경)**\"}, {\"t\": \"list\", \"items\": [\"**정체성 회복 열망:** 스페인 중앙정부 (마드리드)의 억압 속에서 고유 언어와 자치권을 잃었던 카탈루냐인들은 19세기 후반 문화·언어 부흥 운동인 '레나이셴사 (부흥)'를 전개했습니다.\", \"**역사와 자연의 결합:** 건축가들은 마드리드의 보수적인 아카데미 양식을 거부하고, 카탈루냐의 황금기였던 중세 고딕 양식, 이슬람 (무데하르) 타일 공예, 그리고 몬세라트 산과 지중해의 유기적인 자연 형태를 결합해 '가장 카탈루냐다운 현대 건축'을 창조하려 했습니다.\"]}, {\"t\": \"h\", \"text\": \"가우디 건축을 읽는 다섯 가지 열쇠\"}, {\"t\": \"table\", \"head\": [\"요소\", \"표현 방식\", \"만나는 곳\"], \"rows\": [[\"자연을 본뜬 구조\", \"나무처럼 가지를 뻗은 기둥과 뼈와 동굴에서 착안한 곡선. “직선은 인간의 것, 곡선은 신의 것”이라 믿었던 가우디는 자연에서 가장 완벽한 구조를 찾았습니다.\", \"사그라다 파밀리아 내부를 가득 채운 거대한 '돌 숲' 기둥\"], [\"현수선 아치 (중력이 빚어낸 아치)\", \"양끝을 잡고 늘어뜨린 사슬의 곡선을 그대로 뒤집어 세운 아치입니다. 무게가 가장 자연스럽게 땅으로 흐르기 때문에, 겉을 받치는 투박한 버팀벽 없이도 하늘 높이 솟아오를 수 있었습니다. 가우디는 실제로 사슬과 작은 추를 거꾸로 매달아 이 완벽한 균형을 계산해 냈습니다.\", \"구엘 저택의 우아한 포물선 아치 · 사그라다 파밀리아 지하 박물관의 사슬 모형\"], [\"트렌카디스 (버려진 조각에 새 생명을)\", \"깨진 타일과 유리, 도자기 조각을 이어 붙여 만든 모자이크 기법입니다. 둥근 곡면 위에도 매끄럽게 옷을 입힐 수 있을 뿐 아니라, 버려지던 자투리 자재에 화려한 생기를 불어넣었습니다.\", \"구엘 공원의 도마뱀 분수와 뱀 모양 벤치 · 구엘 저택 옥상의 굴뚝\"], [\"기하학 곡면\", \"얼핏 복잡해 보이는 곡선 천장과 창문은 사실 수많은 직선을 조금씩 비틀고 움직여 완성한 결과물입니다. 덕분에 마치 숲속 나뭇잎 사이로 스미듯 부드러운 빛이 고르게 퍼집니다.\", \"사그라다 파밀리아의 창과 천장\"], [\"소품 공예 (손끝에서 완성된 디테일)\", \"가우디에게 건축은 뼈대만 세우는 일이 아니었습니다. 대문 하나, 문고리와 타일, 스테인드글라스, 심지어 의자 하나까지 장인들과 함께 직접 빚어내며 공간 전체가 하나의 살아있는 예술품이 되도록 했습니다.\", \"까사 비센스의 야자잎 철문과 꽃 타일, 구엘 저택의 가구\"]]}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[가우디의 생애 보기](note:gaudi-life)\"}]}, {\"id\": \"vicens\", \"cat\": \"건축·미술\", \"title\": \"카사 비센스 (1883~1885)\", \"city\": \"바르셀로나\", \"lead\": \"무어 양식의 타일과 붉은 벽돌로 지은 가우디의 첫 주택입니다.\", \"links\": {\"q\": \"Casa Vicens Barcelona\", \"yt\": \"까사 비센스 바르셀로나\"}, \"blocks\": [{\"t\": \"facts\", \"rows\": [[\"시기\", \"1883-1885\"], [\"관람 포인트\", \"첫 주택. 주식 중개인 마넬 비센스의 여름 별장으로, 무어·동방 양식에서 영감을 받은 각진 형태입니다. 정원의 메리골드를 본뜬 노란 꽃 타일과 야자잎 철문. 2017년 박물관으로 공개되었습니다.\"], [\"세계유산\", \"‘안토니 가우디의 작품들’로 유네스코 세계유산에 올랐습니다 (1984년 등재, 2005년 확대).\"]]}, {\"t\": \"photo\", \"src\": \"img/2326d01c2751fb5c0f78f767e116bd17.jpg\", \"caption\": \"까사 비센스 외관\"}, {\"t\": \"p\", \"text\": \"**까사 비센스 전경** - 무어 양식에서 따온 녹색·흰색 타일과 붉은 벽돌의 주택으로 가우디의 첫 주택 작품\"}, {\"t\": \"photo\", \"src\": \"img/b0eb09ee74a63c85fe0ae2a9171c1baa.jpg\", \"caption\": \"흡연실 천장\"}, {\"t\": \"p\", \"text\": \"**흡연실 천장** - 이슬람 건축의 무카르나스 (벌집 모양 장식)를 본떠 만든 흡연실 내 파란 천장 장식으로 까사 비센스에서 가장 화려한 장식입니다.\"}, {\"t\": \"photo\", \"src\": \"img/dac8601cc6adf84f77950d32bd9bccaf.jpg\", \"caption\": \"무데하르 양식\"}, {\"t\": \"p\", \"text\": \"**무데하르 양식**: 이슬람과 기독교 양식이 혼합된 건축물로 이슬람의 무데하르 (Mudejar) 양식과 오리엔탈리즘의 영향을 받아 화려한 타일을 사용했고, 직선적인 형태를 띠고 있습니다.\"}, {\"t\": \"photo\", \"src\": \"img/575b2ce27632e9283a5a8f47d5a56d8b.webp\", \"caption\": \"자연의 방식 (외벽 타일)\", \"credit\": \"\"}, {\"t\": \"photo\", \"src\": \"img/08d52d921ffb7cd6a4f904cf1903eae1.jpg\", \"caption\": \"자연의 방식 (야자잎 철문)\"}, {\"t\": \"p\", \"text\": \"**자연의 방식**: 건축 당시 부지에 피어 있던 아프리카 금잔화와 종려나무 등에서 영감을 받아 외벽 타일과 철제 난간 (야자수 잎 문양)을 디자인했습니다.\"}, {\"t\": \"p\", \"text\": \"**5대째 이어진 장인 가문:** 가우디의 아버지 프란세스크 가우디와 외할아버지는 모두 카탈루냐 레우스 (Reus) 지방에서 구리 솥과 증류기를 두드려 만들던 구리 세공사 (Calderer)였습니다.\"}, {\"t\": \"p\", \"text\": \"**직접 망치를 든 건축가:** 대장장이 가문 출신으로서 그는 도면만 그리는 책상물림 건축가가 아니었습니다. 바르셀로나의 대장간을 수시로 드나들며 장인들과 함께 직접 쇠를 달구고 두드려 연철 (Wrought Iron) 장식을 빚어냈고, 기하학적 곡면을 금속으로 구현하는 법을 체득했습니다.\"}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[가우디와 아르누보 보기](note:gaudi)\"}]}, {\"id\": \"palau-guell\", \"cat\": \"건축·미술\", \"title\": \"구엘 저택 (1886~1888)\", \"city\": \"바르셀로나\", \"lead\": \"가우디가 후원자 구엘 가문을 위해 지은 도심 저택입니다.\", \"links\": {\"q\": \"Palau Güell Barcelona\", \"wiki\": \"구엘 저택\", \"yt\": \"구엘 저택 바르셀로나\"}, \"blocks\": [{\"t\": \"facts\", \"rows\": [[\"시기\", \"1886-1888\"], [\"관람 포인트\", \"평생 후원자 에우세비 구엘의 람블라스 옆 저택. 포물선 아치, 별하늘처럼 구멍 뚫린 중앙 돔, 트렌카디스 굴뚝이 늘어선 옥상\"], [\"세계유산\", \"‘안토니 가우디의 작품들’로 유네스코 세계유산에 올랐습니다 (1984년 등재, 2005년 확대).\"]], \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/2797344804771d4e6974292adc32afe0.jpg\", \"caption\": \"구엘 저택\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**구엘 저택**: 가우디의 재능을 알아보고 평생 든든한 버팀목이 되어준 후원자, 에우세비 구엘 백작 가족을 위해 지은 보금자리입니다. 겉모습은 묵직하고 절제되어 있지만, 문을 열고 들어서는 순간 눈이 부실 만큼 화려한 공간이 펼쳐져 ‘구엘 궁전’이라 불립니다. 젊은 가우디의 천재성이 빛나는 이곳은 1984년 유네스코 세계문화유산에 이름을 올렸습니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/eb2a8229524c5b7fb68a0e5f9a86a854.jpg\", \"caption\": \"중앙 홀 천장 돔\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**중앙 홀 천장 돔**: 밤하늘을 품은 중앙 홀 돔으로 고개를 들어 천장을 올려다보면 마치 맑은 밤하늘 아래 서 있는 듯한 착각이 듭니다. 돔에 뚫린 수많은 작은 구멍 사이로 바르셀로나의 햇빛이 별빛처럼 반짝이며 쏟아져 내립니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/7ec104851c25cfa64fe65e21880fbedb.jpg\", \"caption\": \"옥상 굴뚝\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**옥상의 굴뚝 숲**: 옥상으로 올라서면 지루한 굴뚝 대신 저마다 다른 모자를 쓴 듯 개성 넘치는 20개의 굴뚝이 반겨줍니다. 깨진 타일과 유리, 돌조각을 이어 붙인 알록달록한 옷 (트렌카디스)을 입은 굴뚝들이 동화 속 풍경을 재현합니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/1213051527afd1dfec1056e7d231c382.jpg\", \"caption\": \"포물선 아치와 철제 정문\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**포물선 아치와 철제 정문**: 귀족 손님들이 궂은 날씨에도 비를 맞지 않고 마차를 탄 채 건물 안으로 바로 들어올 수 있도록 설계한 입구입니다. 하늘로 유려하게 솟은 두 개의 포물선 아치와 그 사이를 수놓은 정교한 연철 레이스 장식에서 ‘대장장이의 아들’ 가우디의 섬세한 손길이 느껴집니다.\", \"__ind\": 0}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[가우디와 아르누보 보기](note:gaudi)\", \"__ind\": 0}]}, {\"id\": \"park-guell\", \"cat\": \"건축·미술\", \"title\": \"구엘 공원 (1900~1914)\", \"city\": \"바르셀로나\", \"lead\": \"도마뱀 분수와 86개 기둥의 홀, 물결 벤치가 있는 언덕 정원입니다.\", \"links\": {\"q\": \"Park Güell Barcelona\", \"wiki\": \"구엘 공원\", \"yt\": \"구엘 공원\"}, \"blocks\": [{\"t\": \"facts\", \"rows\": [[\"시기\", \"1900~1914\"], [\"관람 포인트\", \"60가구 전원주택 단지로 계획했지만 2채만 지어져 공원이 됐습니다. 시장으로 쓰려던 86개 기둥의 홀, 조수 주졸이 완성한 트렌카디스 벤치에서 자연을 닮은 곡선이 절정에 이릅니다\"], [\"세계유산\", \"‘안토니 가우디의 작품들’로 유네스코 세계유산에 올랐습니다 (1984년 등재, 2005년 확대).\"]]}, {\"t\": \"photo\", \"src\": \"img/6693d03695fa2d4d6f24fd7b0eb4d89c.jpg\", \"caption\": \"구엘 공원 정문 계단과 기둥의 홀\"}, {\"t\": \"p\", \"text\": \"**구엘 공원 (1900~1914)**: 알록달록한 모자이크 도마뱀 분수가 반겨주는 정문 계단을 오르면, 웅장한 86개 기둥의 홀과 시내가 내려다보이는 광장이 동화처럼 펼쳐집니다.\"}, {\"t\": \"photo\", \"src\": \"img/4d2c34e7daa17351cab5122ff386d7f9.jpg\", \"caption\": \"물결 벤치\"}, {\"t\": \"p\", \"text\": \"광장 가장자리를 따라 뱀처럼 굽이치는 벤치에 걸터앉아 보세요. 알록달록한 타일 너머로 바르셀로나의 붉은 지붕들과 푸른 지중해가 한 폭의 파노라마처럼 시원하게 펼쳐집니다.\"}, {\"t\": \"photo\", \"src\": \"img/0f8816f278123ed86c827a8bae172668.jpg\", \"caption\": \"86개 기둥의 홀\"}, {\"t\": \"p\", \"text\": \"**하늘을 떠받친 86개 기둥의 홀**: 광장 아래를 지탱하는 86개의 웅장한 도리아식 기둥 사이를 걷다 보면 고대 신전에 들어온 듯한 기분이 듭니다. 고개를 들어 천장을 올려다보면, 가우디의 천재적인 조수 주제프 마리아 주졸이 깨진 타일과 유리병 조각으로 빚어낸 둥근 태양 모양 모자이크가 화려하게 빛납니다.\"}, {\"t\": \"photo\", \"src\": \"img/16fdb1ac34a28517c86eb76e5e81a3d5.jpg\", \"caption\": \"트렌카디스 벤치\"}, {\"t\": \"p\", \"text\": \"**내 몸에 꼭 맞는 트렌카디스 벤치**: 깨진 도자기 조각을 이어 붙여 만든 이 곡선 벤치는 보기만 예쁜 예술품이 아닙니다. 가우디가 인부의 엉덩이와 등 곡선을 석고로 본떠 설계한 덕분에, 딱딱한 타일인데도 마치 내 몸에 맞춰 빚은 안락의자처럼 편안하게 등을 감싸줍니다.\"}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[가우디와 아르누보 보기](note:gaudi)\"}]}, {\"id\": \"sagrada\", \"cat\": \"건축·미술\", \"title\": \"사그라다 파밀리아\", \"city\": \"바르셀로나\", \"lead\": \"\", \"links\": {\"q\": \"Sagrada Família Barcelona\", \"wp\": \"사그라다 파밀리아\", \"yt\": \"사그라다 파밀리아 내부\"}, \"blocks\": [{\"t\": \"facts\", \"rows\": [[\"시기\", \"1883~진행 중\"], [\"관람 포인트\", \"1882년 착공 이듬해부터 가우디가 맡아 1926년 세상을 떠날 때까지 매달린 필생작입니다. 생전에 완성된 것은 탄생의 파사드와 지하 크립트 정도입니다. 2026년 2월 '예수 그리스도의 탑'이 올라 172.5m로 세계에서 가장 높은 성당이 됐고, 6월 10일 가우디 서거 100주기에 공개됐습니다\"], [\"세계유산\", \"‘안토니 가우디의 작품들’로 유네스코 세계유산에 올랐습니다 (1984년 등재, 2005년 확대).\"]]}, {\"t\": \"photo\", \"src\": \"img/554c6683aa8e62ddd9c20d4e078e6876.jpg\", \"caption\": \"사그라다 파밀리아 전경\"}, {\"t\": \"p\", \"text\": \"**사그라다 파밀리아**: 사그라다 파밀리아 전경입니다. 1882년 착공해 1984년 유네스코 세계문화유산으로 지정되었으며, 가우디 서거 100주년인 2026년 2월 높이 172.5m의 중앙 '예수 그리스도의 탑' 십자가가 완성되면서 세계에서 가장 높은 성당이 되었습니다.\"}, {\"t\": \"photo\", \"src\": \"img/35538ee444d048745dd124b516096c7e.jpg\", \"caption\": \"서쪽 수난의 파사드\"}, {\"t\": \"p\", \"text\": \"**서쪽 수난의 파사드**: 사그라다 파밀리아의 서쪽 외벽으로, 예수 그리스도의 고난과 죽음, 그리고 부활을 주제로 한 공간입니다. 동쪽 탄생의 파사드가 생명의 환희를 화려한 곡선으로 노래한다면, 이곳은 해가 지는 서쪽을 향해 자리하여 비극적이고 엄숙한 분위기를 극대화합니다.\"}, {\"t\": \"photo\", \"src\": \"img/8ec782370e4a91a16eaccdd0cb9949a1.jpg\", \"caption\": \"동쪽 탄생의 파사드\"}, {\"t\": \"p\", \"text\": \"**동쪽 탄생의 파사드**: 사그라다 파밀리아의 동쪽 외벽으로, 예수 그리스도의 탄생과 유년 시절, 그리고 생명의 환희를 주제로 한 공간입니다. 안토니 가우디가 생전에 직접 지휘하여 대부분 완성한 유일한 파사드이며, 떠오르는 아침 해를 정면으로 마주하며 새로운 생명의 시작을 상징합니다.\"}, {\"t\": \"photo\", \"src\": \"img/fdae450ce8d7192cfc764d94571e7c70.jpg\", \"caption\": \"본당\"}, {\"t\": \"p\", \"text\": \"**본당** - 안토니 가우디가 자연에서 영감을 받아 설계한 거대한 '돌의 숲'이자 빛의 공간입니다. 전통적인 고딕 성당의 어둡고 무거운 분위기에서 벗어나, 하늘로 뻗은 나무 기둥과 다채로운 자연광이 어우러져 숲속을 걷는 듯한 경이로운 분위기를 자아냅니다.\"}, {\"t\": \"photo\", \"src\": \"img/373364cf89f118cf0c4a0c2ad3f51ecb.jpg\", \"caption\": \"서쪽 창 스테인드글라스\"}, {\"t\": \"p\", \"text\": \"서쪽 창의 스테인드글라스는 주황색, 빨간색, 노란색 등 따뜻한 계열의 유리로 채워져 해질녘 석양이 통과할 때 그리스도의 열정과 희생을 상징하는 붉은 빛으로 본당을 물들입니다.\"}, {\"t\": \"photo\", \"src\": \"img/3828faeee5a9e9322e928ee1479e6a6f.jpg\", \"caption\": \"동쪽 창 스테인드글라스\"}, {\"t\": \"p\", \"text\": \"동쪽 창의 스테인드글라스는 청록색, 파란색, 연두색 등 차가운 계열의 유리로 장식되어 아침 햇살이 비출 때 새벽의 생명력과 희망을 표현합니다.\"}, {\"t\": \"h\", \"text\": \"가이드\"}, {\"t\": \"p\", \"text\": \"1882년 첫 돌을 놓고 144년째 짓고 있는 성당입니다. 가우디는 1883년부터 1926년 6월 10일 세상을 떠날 때까지 이 건물에 매달렸습니다. 2026년 2월 20일 한가운데 「예수 그리스도의 탑」에 높이 17m 십자가의 마지막 조각을 올려 172.5m가 되면서 세계에서 가장 높은 성당이 됐고, 가우디 서거 100주년인 6월 10일에는 교황 레오 14세가 이 탑을 축복했습니다. 정문이 될 영광의 파사드 등은 아직 공사 중입니다.\"}, {\"t\": \"h\", \"text\": \"표와 입장\"}, {\"t\": \"p\", \"text\": \"공식 홈페이지 (sagradafamilia.org)에서 사면 기본 €26, 가이드 투어 €30, 탑 포함 €36, 가이드와 탑 포함 €40입니다.\"}, {\"t\": \"list\", \"items\": [\"2026년에는 몇 주 전에 매진되는 일이 많으니 날짜가 정해지면 바로 예약하세요. 표에 적힌 시간에 맞춰 들어가야 하고 보안 검색이 있어 15분쯤 일찍 도착하는 게 좋습니다.\", \"표에 이름이 들어가 신분을 확인한다는 안내가 있으니 여권을 챙기세요. 성당이라 어깨와 무릎을 가리는 옷이 안전합니다.\", \"탑은 탄생 쪽과 수난 쪽 중 하나를 골라 엘리베이터로 올라가고, 좁은 나선 계단으로 걸어 내려옵니다.\"]}, {\"t\": \"h\", \"text\": \"추천 동선 (약 2시간)\"}, {\"t\": \"steps\", \"items\": [\"**탄생의 파사드 (동쪽)**: 가우디 생전에 대부분 완성된 유일한 파사드로, 아침 해를 정면으로 받습니다. **3개의 출입문:** 기독교의 세 가지 덕목인 사랑 (중앙, 예수), 소망 (왼쪽, 요셉), 믿음 (오른쪽, 마리아)을 상징하는 세 개의 문으로 구성되어 있습니다. **주요 조각과 디테일:** 성가족 (예수, 마리아, 요셉)의 탄생 장면을 비롯해 성가대 천사들, 동방박사, 목동들, 그리고 거북이·카멜레온·달팽이 등 카탈루냐 지역의 다양한 동식물 조각이 벽면을 가득 채우고 있습니다. 중앙 상단에는 영원한 생명을 상징하는 녹색 사이프러스 나무와 비둘기 조각이 세워져 있습니다.\", \"**내부**: 기둥이 나무처럼 가지를 치며 천장을 받쳐 '돌의 숲'을 이룹니다. 기둥은 받는 무게에 따라 반암·현무암·화강암·사암으로 재료와 색이 다릅니다. 9시 입장이면 동쪽 창의 파랑·초록 빛이 가장 좋고, 서쪽 창의 빨강·주황은 오후에 타오릅니다.\", \"**탑 (예약했다면)**: 방문객은 별도의 타워 통합 티켓을 구매해 탄생의 파사드 탑 또는 수난의 파사드 탑 중 한 곳을 선택해 올라갈 수 있습니다. 두 곳 모두 올라갈 때는 엘리베이터를 타고, 내려올 때는 좁은 나선형 돌계단 약 400~500개를 걸어서 내려옵니다.\", \"**지하 박물관**: **사그라다 파밀리아 박물관**은 입장권으로 자유롭게 관람할 수 있는 반지하 전시 공간입니다. 가우디가 중력을 이용해 아치 구조를 계산했던 거꾸로 매단 사슬 모형 (현수선 실험), 원본 설계 도면, 석고 모형과 3D 프린팅 작업실을 직접 볼 수 있습니다. **지하 예배당 (크립트)과 가우디 무덤**은 1882년 착공 당시 가장 먼저 지어진 신고딕 양식의 예배당입니다. 내부의 '카르멜 산의 성모 경당' 바닥 아래에는 1926년 트램 사고로 세상을 떠난 안토니 가우디가 영면해 있습니다.\", \"**수난의 파사드 (서쪽)**: 가우디 사후 카탈루냐 조각가 호셉 마리아 수비라치 (Josep Maria Subirachs)가 1986년부터 약 20년간 약 100여 개의 조각상을 제작했습니다. 가우디의 유작을 모방하지 않고 날카로운 직선과 추상적 면 분할을 사용해 비극성을 극대화했습니다. 조각 관람 순서는 아래에 따로 정리했습니다.\", \"**포토 스팟: [가우디 광장](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+de+Gaud%C3%AD+Barcelona)**: 연못 건너편 벤치 쪽에서 성당을 바라보면 웅장한 대성당의 전체 모습과 수면에 비친 반영 (데칼코마니)을 한 프레임에 담을 수 있습니다.\"]}, {\"t\": \"h\", \"text\": \"수난의 파사드 조각 관람 순서\"}, {\"t\": \"list\", \"items\": [\"**건축적 특징과 스타일:** 곡선과 자연주의 양식이 돋보이는 탄생의 파사드와 달리, 직선적이고 거칠며 뼈대만 앙상하게 남은 듯한 기하학적 형태로 설계되었습니다. 가우디는 사람들이 이 파사드를 보고 두려움과 경외감을 느끼길 바라며 의도적으로 투박하고 직선적인 디자인을 구상했습니다.\", \"**S자 동선으로 보는 조각 관람 순서:** 수비라치는 예수가 골고다 언덕을 오르던 길을 형상화하여, 파사드 아래층 왼쪽에서 시작해 역 S자 형태로 상승하며 총 18개 장면을 감상하도록 배치했습니다.\", \"1층 (수난의 시작, 왼쪽 → 오른쪽): 최후의 만찬, 유다의 입맞춤 (배신), 겟세마네 동산의 체포, 예수를 세 번 부인하고 통곡하는 베드로 조각이 차례로 이어집니다.\", \"2층 (재판과 십자가의 길, 오른쪽 → 왼쪽): 기둥에 묶여 채찍질당하는 예수 (중앙 입구 기둥), 손을 씻으며 책임을 회피하는 빌라도, 예수의 땀을 닦아준 베로니카의 수건, 십자가를 대신 진 구레네 사람 시몬이 묘사되어 있습니다.\", \"3층 및 최상단 (죽음과 부활, 왼쪽 → 오른쪽): 십자가에 못 박힌 예수 (중앙 상단), 예수의 옷을 두고 제비뽑기하는 로마 병사들, 무덤에 안치되는 장면과 빈 무덤을 거쳐 최상단의 부활 및 승천 조각으로 마무리됩니다.\", \"**유다의 입맞춤과 마방진:** 예수를 배신하는 유다의 조각 옆에는 가로·세로·대각선 어느 방향으로 더해도 합이 예수가 십자가에 못 박힌 나이인 '33'이 되는 숫자 마방진이 새겨져 있습니다.\", \"**채찍질 당하는 예수:** 기둥에 묶인 채 채찍질 당하는 예수의 조각은 관람객들에게 가장 강렬한 인상을 주는 작품 중 하나입니다.\", \"**승천하는 예수:** 파사드 가장 꼭대기 종탑 사이에는 부활하여 승천하는 황금빛 예수 조각상이 자리하고 있습니다.\"]}, {\"t\": \"tip\", \"label\": \"참고\", \"text\": \"탑은 계획상 18개 (12사도, 4복음사가, 성모, 예수)입니다. 가장 높은 예수 그리스도의 탑을 몬주익 언덕보다 조금 낮게 한 것은 사람의 작품이 신의 창조물을 넘어선 안 된다는 가우디의 뜻이라고 전해집니다. [가우디와 아르누보 보기](note:gaudi)\"}]}, {\"id\": \"gothic\", \"cat\": \"도시 가이드\", \"title\": \"엘 본·고딕 지구 산책 코스\", \"city\": \"바르셀로나\", \"lead\": \"키스의 벽에서 레이알 광장까지 중세 골목 9곳을 순서대로 걷습니다.\", \"links\": {\"q\": \"Catedral de Barcelona\", \"yt\": \"https://www.youtube.com/watch?v=XzUEadYPEEc&t=215s\"}, \"blocks\": [{\"t\": \"tip\", \"label\": \"길찾기\", \"text\": \"[구글 지도에서 전체 동선 보기](https://www.google.com/maps/dir/?api=1&origin=Pla%C3%A7a+d%27Isidre+Nonell+Barcelona&destination=Pla%C3%A7a+Reial+Barcelona&waypoints=Catedral+de+Barcelona%7CPla%C3%A7a+del+Rei+Barcelona%7CPla%C3%A7a+de+Sant+Jaume+Barcelona%7CPont+del+Bisbe+Barcelona%7CPla%C3%A7a+de+Sant+Felip+Neri+Barcelona%7CEl+Call+Barcelona%7CCarrer+d%27Avinyo+Barcelona&travelmode=walking)\"}, {\"t\": \"h\", \"text\": \"장소 안내\"}, {\"t\": \"steps\", \"items\": [\"[키스의 벽](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+d%27Isidre+Nonell+Barcelona) (El món neix en cada besada) — 사진가 조안 폰트쿠베르타 (Joan Fontcuberta)가 1714년 바르셀로나 함락 300주년인 2014년에 만든 가로 8m, 세로 3.8m의 포토 모자이크입니다. 신문 독자들이 보낸 '자유의 순간' 사진 수천 장을 작은 타일에 인쇄해 붙여서, 가까이서는 사진 하나하나가, 멀리서는 입맞춤 장면이 보입니다. 비스베 거리 구름다리 가까이, 대성당 옆 작은 광장 (Plaça d'Isidre Nonell)에 숨어 있어 사람들이 몰리기 전인 이른 아침이 사진 찍기 좋습니다.\", \"[바르셀로나 대성당](https://www.google.com/maps/search/?api=1&query=Catedral+de+Barcelona) — 13~15세기 카탈루냐 고딕 성당 (정면은 19세기 말 네오고딕). 회랑 안뜰에서 흰 거위 13마리를 키우는데, 13살에 순교한 수호성인 에울랄리아를 기리는 것입니다. 옥상 테라스 전망도 가능합니다.\", \"[왕의 광장](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+del+Rei+Barcelona) (Plaça del Rei) — 바르셀로나 백작과 아라곤 왕들의 궁전이 둘러싼 중세 광장입니다. 콜럼버스가 첫 항해를 마치고 여기서 왕을 만났다는 이야기가 있고, 아래에는 로마 유적이 묻혀 있습니다.\", \"[산트 자우메 광장](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+de+Sant+Jaume+Barcelona) — 로마 시대 도시 광장 (포럼)이 있던 자리. 카탈루냐 자치정부 청사와 바르셀로나 시청이 마주보고 있습니다.\", \"[비스베 거리](https://www.google.com/maps/search/?api=1&query=Pont+del+Bisbe+Barcelona) (Carrer del Bisbe) — 대성당 옆 골목. 두 건물을 잇는 레이스 같은 네오고딕 구름다리 (1928년)가 고딕 지구의 대표 사진 장소입니다.\", \"[산트 펠립 네리 광장](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+de+Sant+Felip+Neri+Barcelona) — 성당 앞 작고 조용한 광장. 스페인 내전 때인 1938년 폭격으로 아이들을 포함해 많은 사람이 숨진 곳으로, 벽에 파편 자국이 그대로 남아 있습니다.\", \"[유대인 지구](https://www.google.com/maps/search/?api=1&query=MUHBA+El+Call+Barcelona) (El Call) — 중세 유대인이 모여 살던 골목. 1391년 폭동으로 공동체가 사라졌고, 미로처럼 좁은 길과 옛 시나고그 터가 남아 있습니다.\", \"[아비뇽 거리](https://www.google.com/maps/search/?api=1&query=Carrer+d%27Avinyo+Barcelona) (Carrer d’Avinyó) — 피카소 「아비뇽의 처녀들」의 제목이 이 거리에서 왔다는 설이 있는 곳. 지금은 편집숍과 바가 이어집니다.\", \"[레이알 광장](https://www.google.com/maps/search/?api=1&query=Pla%C3%A7a+Reial+Barcelona) — 야자수와 아케이드가 둘러싼 19세기 광장. 가운데 가로등은 젊은 가우디의 첫 공모전 당선 작품입니다.\"]}, {\"t\": \"tip\", \"label\": \"참고\", \"text\": \"레이알 광장에는 타블라오 Los Tarantos가 있어 플라멩코 공연 일정과 붙이기 쉽습니다. [플라멩코 가이드 보기](note:flamenco)\"}]}, {\"id\": \"miro\", \"cat\": \"건축·미술\", \"title\": \"호안 미로\", \"city\": \"바르셀로나\", \"lead\": \"별과 새, 원색의 기호들로 카탈루냐의 태양과 순수한 동심을 화폭에 수놓은 초현실주의의 거장\", \"links\": {\"q\": \"Fundació Joan Miró Barcelona\", \"wp\": \"호안 미로\", \"yt\": \"호안 미로 작품 세계\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/2ee4d7a938811b1c7fa1683f438062bc.jpg\", \"caption\": \"\", \"credit\": \"\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"미로 (1893~1983)는 바르셀로나에서 태어난 화가입니다. 카탈루냐 시골 풍경을 그리던 시골 청년이 파리에서 피카소와 입체파, 초현실주의를 차례로 거치며 별·새·여인 같은 단순한 기호로 세상을 나타내는 자기만의 그림 언어를 만들었습니다.\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"**초기 — 카탈루냐의 땅 (1910년대)**: 가족 농장이 있던 몬트로이그의 들판과 마을을 그렸습니다. 야수파·세잔에게서 배운 강한 색에, 풀잎 하나·달팽이 한 마리까지 똑같은 무게로 그리는 세밀한 묘사가 특징입니다.\", \"**피카소와 입체파 (1920년 무렵)**: 1920년 파리에서 같은 카탈루냐 출신 선배 피카소를 만났고, 피카소는 미로의 자화상을 사서 평생 간직했습니다.\", \"**초현실주의 (1924년~)**: 이성의 통제 없이 떠오르는 생각을 그대로 옮기는 ‘자동기술’과 꿈을 중시한 흐름입니다. 미로는 달리처럼 꿈을 사진처럼 그리지 않고, 손이 가는 대로 그은 선과 떠다니는 형체로 무의식을 표현했습니다.\", \"**기호의 언어 확립 (1940년대~)**: 「별자리」 연작 (1940~41)에서 별·새·여인·눈 같은 기호를 가는 선으로 잇고 검정·빨강·파랑·노랑 원색으로 채우는 자기만의 언어를 완성했습니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"미로의 기호 읽기\", \"__ind\": 0}, {\"t\": \"table\", \"head\": [\"기호\", \"흔한 해석\"], \"rows\": [[\"별·달·해\", \"우주와 밤, 시적인 꿈\"], [\"새\", \"땅과 하늘을 잇는 존재, 자유\"], [\"여인\", \"대지와 생명, 풍요\"], [\"사다리\", \"현실에서 벗어나는 ‘탈출의 사다리’\"], [\"눈\", \"보는 행위, 무의식의 시선\"], [\"원색과 굵은 검은 선\", \"빨강·노랑·파랑·초록을 넓은 여백 위에 단순하고 강하게\"]], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"시기별 대표작\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/cff4a24260c329fa69a83764d7ce2706.jpg\", \"caption\": \"초기 · 「농장 (La Masia)」 1921~22\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**「농장 (La Masia)」 (1921~22)**: 가족이 여름을 보내던 몬트로이그 농장의 마당을 그린 그림입니다. 1921년 여름 몬트로이그에서 시작해 파리 작업실에서 약 9개월 만에 끝냈습니다. 큰 나무, 덮개 달린 수레, 둥근 방앗간, 밭의 식물을 크고 작은 구분 없이 똑같은 정성으로 그려 농장의 ‘목록’처럼 만든 것이 특징입니다. 미로 스스로 이 그림을 ‘시골 생활 전체의 요약’이자 이후 작업의 출발점으로 여겼습니다. 헤밍웨이가 1925년 5,000프랑에 사서 평생 아꼈고, 부인 메리가 1987년 기증해 지금은 미국 워싱턴 국립미술관에 소장되어 있습니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/e5429a8fcc1aff36f78919d7c9375630.jpg\", \"caption\": \"입체파 · 「자화상」 1919\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**「자화상」 (1919)**: 정면을 똑바로 바라보는 단순하고 엄격한 얼굴로, 로마네스크 미술의 단단함에 비교되는 초기작입니다. 피카소가 사서 평생 간직했고, 1978년 피카소 컬렉션의 일부로 프랑스 국가에 들어가 지금은 파리 피카소 미술관 소장품입니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/eae2ccda614cafb7d7c5d1398664a829.jpg\", \"caption\": \"초현실주의 · 「어릿광대의 사육제」 1924~25\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**「어릿광대의 사육제」 (1924~25)**: 초현실주의로 넘어간 첫 대표작입니다. 미로는 가난해 굶주리던 때 집에 돌아와 환각처럼 떠오른 형체를 그린 것이 출발이라고 했고, 광대의 배에 뚫린 구멍이 그 허기를 가리킨다는 해석이 있습니다. 왼쪽 사다리 (눈과 귀가 달려 있습니다)는 미로가 ‘탈출과 상승’의 상징이라 한 것이고, 창문 속 검은 삼각형은 에펠탑입니다. 미국 버팔로의 미술관에 있습니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/52cce13a708329a6f7de81586f677e9c.jpg\", \"caption\": \"기호의 언어 · 「별자리」 연작 중 「샛별 (L'estel matinal)」 1940\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**「샛별」 (1940)**: 「별자리」 연작 23점 중 하나입니다. 2차 대전 중 노르망디의 바랭빌에서 연작을 시작했고, 독일군이 프랑스를 침공하자 스페인으로 돌아와 마요르카 팔마에서 1941년에 마무리했습니다. 가는 선으로 별·새·여인을 잇고 원색을 곳곳에 찍은 작은 종이 그림 (약 38×46cm)이라 미로의 ‘기호 언어’가 완성된 순간으로 꼽힙니다. 미로가 부인 필라르에게 주었다가 호안 미로 재단 (바르셀로나)에 기증된 작품입니다. 전시 여부는 방문 전 확인하세요.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/884e0a095fcc48319baa2e8cd7c4760e.jpg\", \"caption\": \"기호의 언어 · 「여인과 새」 1983 (조각)\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**「여인과 새」 (1983)**: 호안 미로 공원에 서 있는 높이 22m의 조각으로, 옛 도살장 터를 공원으로 바꾸면서 시가 1980년 의뢰했습니다. 콘크리트 구조물에 도예가 조안 가르디 아르티가스가 깨진 타일 조각 (트렌카디스)을 붙여 완성했고, 몸통의 검은 세로 틈에서 여인의 모습을 읽을 수 있습니다. 미로는 이 작품과 공원 개장을 직접 보지 못했습니다.\", \"__ind\": 0}, {\"t\": \"h\", \"text\": \"바르셀로나의 미로 작품\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/20ade3bb711d0af47a74da59bfd596b5.jpg\", \"caption\": \"\", \"credit\": \"\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"** Pla de l’Os 모자이크 (1976)**: 보케리아 앞 람블라스 바닥에 깔린 작품으로, 바다로 오는 사람을 맞이합니다.\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/9912256e5122844793a7520b799272f7.jpg\", \"caption\": \"\", \"credit\": \"\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"**바르셀로나 공항 T2 외벽의 도자 벽화 (1970)**: — 하늘로 오는 사람을 맞이하는 작품으로, 도예가 조셉 요렌스 아르티가스와 함께 만들었습니다.\", \"__ind\": 0}]}, {\"id\": \"camp-nou\", \"cat\": \"스포츠\", \"title\": \"캄프 누 관람 가이드\", \"city\": \"바르셀로나\", \"lead\": \"리모델링 중인 캄프 누에서는 박물관, 360도 영상관, 공사 전망대 세 곳을 차례로 돌아봅니다.\", \"links\": {\"wiki\": \"캄프 누\", \"yt\": \"캄프 누 투어\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"FC 바르셀로나의 홈구장 캄프 누는 에스파이 바르사(Espai Barça) 프로젝트로 재건축 중입니다. 그래서 예전처럼 라커룸과 선수 터널, 벤치, 그라운드를 걷는 코스가 아니라, 아래 세 구역을 이어서 관람합니다.\"}, {\"t\": \"facts\", \"rows\": [[\"① 전시 공간\", \"Barça Museum · 약 2,400㎡\"], [\"② 영상관\", \"Spotify Camp Nou Live · 360도 몰입형\"], [\"③ 전망대\", \"경기장 공사 현장 조망 구역\"], [\"준비물\", \"스마트폰과 이어폰 (디지털 오디오가이드)\"], [\"덜 붐비는 시간\", \"이른 시간대, 또는 오후 3시 이후\"]]}, {\"t\": \"photo\", \"src\": \"img/eb0ba0c6811de7bcd42438e6991893af.jpg\", \"caption\": \"\", \"credit\": \"\"}, {\"t\": \"h\", \"text\": \"1. Barça Museum: 약 2,400㎡ 규모 전시 공간\"}, {\"t\": \"list\", \"items\": [\"**구성과 동선:** 1899년 클럽 창단 이후의 역사, 주요 트로피 컬렉션, 요한 크루이프와 리오넬 메시 관련 전시(발롱도르·골든슈 등), 남녀 1군 팀 기록, 인터랙티브·시청각 설치물까지 약 18개 섹션으로 이어집니다.\", \"**관람 팁:** 디지털 오디오가이드가 지원되므로 스마트폰과 이어폰을 미리 준비하는 것이 좋습니다. 오전 10시~오후 2시에는 단체·현장 관람객이 몰리는 편이어서, 이른 시간대나 오후 3시 이후 방문이 상대적으로 여유롭습니다.\"]}, {\"t\": \"photo\", \"src\": \"img/d96c5ad06586445726c499e4c882250f.jpg\", \"caption\": \"\", \"credit\": \"\"}, {\"t\": \"h\", \"text\": \"2. Spotify Camp Nou Live: 360도 몰입형 영상관\"}, {\"t\": \"list\", \"items\": [\"**특징:** 벽면과 공간을 감싸는 대형 프로젝션과 사운드로 경기장의 열기와 클럽의 상징적 장면을 입체적으로 체험하는 영상 공간입니다.\", \"**관람 팁:** 전시 동선 중간에 있으며 조명과 음향 연출이 크고 입체적입니다. 빛이나 큰 소리에 민감하다면 동선을 조절해서 관람하세요.\"]}, {\"t\": \"h\", \"text\": \"3. 경기장 공사 전망대 (Construction Viewpoint)\"}, {\"t\": \"list\", \"items\": [\"**특징:** 에스파이 바르사 프로젝트로 재건축 중인 경기장 현장을 지정된 전망 구역에서 내려다보며, 규모와 공정의 변화를 확인하는 코스입니다.\", \"**관람 팁:** 라커룸, 선수 터널, 벤치, 그라운드를 직접 걷는 코스가 아닙니다. 완공된 스탠드를 보는 관람이 아니라 리모델링 현장을 조망하는 코스라고 기대치를 잡고 둘러보세요.\"]}, {\"t\": \"tip\", \"label\": \"함께 보기\", \"text\": \"[예약 체크리스트와 입장료 요약](note:booking)\"}]}, {\"id\": \"montserrat\", \"cat\": \"자연·성지\", \"title\": \"몬세라트\", \"city\": \"몬세라트\", \"lead\": \"기암괴석이 빚어낸 신비로운 바위산 품에 천년 수도원이 고요히 자리해, 장엄한 절경과 경건한 울림을 선사하는 카탈루냐의 성지입니다.\", \"links\": {\"q\": \"Montserrat Monastery\", \"wiki\": \"몬세라트\", \"wp\": \"몬세라트 수도원\", \"yt\": \"몬세라트 수도원 검은 성모\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"바르셀로나 북서쪽에 솟은 톱니 모양 바위산 (카탈루냐어로 ‘톱으로 자른 산’)으로, 가장 높은 산헤로니가 1,236m입니다. 강 하구에 쌓인 자갈과 모래가 굳은 역암이 비바람에 깎여 지금의 봉우리가 됐고, 11세기에 세운 베네딕토회 수도원이 카탈루냐 신앙의 중심입니다.\"}, {\"t\": \"photo\", \"src\": \"img/cfee8752fce21a1dc76e0847ed9e29f9.jpg\", \"caption\": \"바실리카와 수도원 전경\"}, {\"t\": \"photo\", \"src\": \"img/d0bb15c704b2c71eebebc3873cb0f2ef.jpg\", \"caption\": \"수도원 내부\", \"credit\": \"\"}, {\"t\": \"h\", \"text\": \"2시간 관람 동선\"}, {\"t\": \"steps\", \"items\": [\"**도착·주차**: 수도원 앞 유료 주차장에 세우세요. 길가 주차는 금지입니다.\", \"**[바실리카](https://www.google.com/maps/search/?api=1&query=Basilica+de+Montserrat)와 모레네타 (검은 성모)**: 광장에서 산악 전경을 감상한 뒤 대성당 내부의 검은 성모상을 알현합니다. 알현은 시간 지정 예약제라 공식 웹사이트에서 통합 입장권 (€23)을 미리 예매하는 편이 좋습니다. 성당은 오전 8:00~10:30, 오후 12:00~18:25에 열립니다.\", \"**몬세라트 박물관**: 통합 입장권에 포함되며 10:00~17:45 운영합니다. 엘 그레코, 카라바조, 피카소, 달리, 모네 등의 회화와 성물을 실내에서 볼 수 있어 겨울철에 알맞습니다.\", \"**[산 조안 푸니쿨라](https://www.google.com/maps/search/?api=1&query=Funicular+de+Sant+Joan+Montserrat)**: 수도원 단지 출구, 산 헤로니 가는 길 쪽에서 탑니다. 최대 경사 65%, 길이 503m를 올라 해발 약 1,000m 전망대에 닿습니다. 위에서 20~30분 걸으며 수도원과 바위 봉우리를 내려다보세요.\", \"시우라나 또는 와이너리로 출발합니다.\"]}, {\"t\": \"h\", \"text\": \"알아둘 것\"}, {\"t\": \"list\", \"items\": [\"**소년 합창단 에스콜라니아**: 월~금 13:00에 「살베」와 몬세라트 성모 찬가 「비롤라이」를 10~15분 부릅니다. 일요일·축일은 12:00이고, 토요일과 학교 방학에는 없습니다. 오전에 도착하는 일정으로는 듣기 어려우니, 꼭 듣고 싶다면 시우라나를 빼고 와이너리 예약을 15:30 이후로 미루세요.\", \"**가우디의 흔적**: 수도원에서 산타 코바 (성모상이 발견됐다는 동굴)로 내려가는 로사리오 길에 가우디가 설계한 [영광의 첫 번째 신비 (부활)](https://www.google.com/maps/search/?api=1&query=Primer+Misteri+de+Gl%C3%B2ria%2C+Cam%C3%AD+del+Rosari+Monumental%2C+Collbat%C3%B3) (1900~1907년)가 있습니다. 몬세라트의 톱니 바위가 사그라다 파밀리아 탑의 영감이 됐다는 이야기도 흔히 전해집니다.\"]}]}, {\"id\": \"priorat\", \"cat\": \"와인\", \"title\": \"프리오랏: 검은 점판암 위의 가르나차·카리냥\", \"city\": \"프리오랏\", \"lead\": \"스페인에서 최고 등급을 받은 두 산지 중 하나입니다.\", \"links\": {\"q\": \"Gratallops Priorat\", \"yt\": \"프리오랏 와인 산지\", \"wp\": \"프리오라트 포도주\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"일정 속 와이너리 두 곳은 따로 정리했습니다. [셀레르 마스 도이스](note:mas-doix) · [클로스 모가도르](note:clos-mogador)\"}, {\"t\": \"h\", \"text\": \"지역 개요와 등급 (DOQ)\"}, {\"t\": \"photo\", \"src\": \"img/579d0c745a60e0bc9527d8f89e97422e.webp\", \"caption\": \"점판암 토양 아래 뿌리를 깊이 내린 포도나무 모습\", \"credit\": \"\"}, {\"t\": \"list\", \"items\": [\"**최고 등급 산지:** 스페인에서 가장 높은 등급인 DOCa (카탈루냐어로 DOQ)를 받은 곳은 리오하와 프리오랏 두 곳뿐입니다. 프리오랏은 2000년 카탈루냐, 2009년 스페인 정부의 인정을 받았습니다.\", \"**위치와 지형:** 카탈루냐 남서쪽 타라고나 주에 있고, 몬트상 산자락의 가파른 협곡을 따라 계단식 비탈 (코스테르)이 이어집니다. 마스 도이스가 있는 포볼레다와 클로스 모가도르가 있는 그라타요프스도 이 안에 있습니다.\", \"**점판암 토양 (일리코렐라,Ilicorella):** 붉고 검은 점판암에 석영 맥이 섞인 토양입니다. 약 3억~4억 년 전 고생대에 만들어진 오래된 바위라 겉흙이 10~15cm밖에 안 되고, 뿌리는 바위 틈의 얇은 점토층에서 물과 양분을 찾아 깊이 파고듭니다. 그래서 수확량이 아주 적고 농축된 미네랄 풍미가 납니다.\"]}, {\"t\": \"h\", \"text\": \"역사와 현대적 부흥\"}, {\"t\": \"list\", \"items\": [\"**12세기 기원:** 1194년 스칼라 데이 (Scala Dei) 수도원의 카르투시오회 수도사들이 포도를 심기 시작했습니다. 수도원장 (prior)이 다스린 땅이라 ‘프리오랏’이라는 이름이 생겼고, 수도사들은 1835년 수도원이 국유화될 때까지 포도밭을 가꿨습니다.\", \"**필록세라의 타격:** 19세기 후반 포도나무 뿌리 해충 필록세라 (Phylloxera)로 밭이 황폐해지고 사람들이 마을을 떠났습니다.\", \"**1989년 품질 혁명:** 르네 바르비에 (클로스 모가도르), 알바로 팔라시오스, 다프네 글로리앙 (클로스 에라스무스), 조셉 류이스 페레스 (마스 마르티넷), 카를레스 파스트라나 (클로스 데 로박)가 그라타요프스에 모여 잊혀 가던 산지를 되살렸습니다. 처음 세 빈티지 (1989~91)는 한 셀러에서 함께 만든 와인을 다섯 개 라벨로 나눠 냈고, 이번에 찾는 클로스 모가도르가 그 다섯 중 하나입니다.\"]}, {\"t\": \"h\", \"text\": \"포도 품종과 재배\"}, {\"t\": \"list\", \"items\": [\"**레드 중심:** 압도적으로 레드 와인 산지이고 화이트와 로제는 소량입니다. 토착 품종인 가르나차 (Garnacha)와 카리녜나 (Cariñena)가 중심이며, 카리녜나가 가장 널리 심어져 있습니다.\", \"**이름이 헷갈리는 포도:** 같은 포도도 나라마다 이름이 달라 라벨이 헷갈립니다. 가르나차는 프랑스에서 그르나슈, 카리녜나는 프랑스에서 카리냥이라 부릅니다.\", \"**국제 품종:** 카베르네 소비뇽, 시라, 메를로도 쓰입니다. 마스 도이스는 토착 품종을 지키려고 카베르네와 메를로를 접붙여 바꿨고, 클로스 모가도르는 카베르네 소비뇽을 일부 섞습니다.\", \"**낮은 수확량:** 허용 수확량 (레드 헥타르당 6,000kg)보다 실제 수확량이 훨씬 적어 포도의 맛과 향이 진하게 응축됩니다.\", \"**비유해 보기:** 가르나차가 중심이라 샤토뇌프 뒤 파프와 견줘 보기 좋고, 르네 바르비에는 오래된 카리냥을 숙성된 바롤로에 비유합니다.\"]}, {\"t\": \"h\", \"text\": \"와인 스타일과 숙성 등급\"}, {\"t\": \"p\", \"text\": \"가르나차와 카리녜나 단일 품종이나 두 품종 블렌딩이 기본이고, 1990년대 이후에는 카베르네 소비뇽·시라·메를로를 섞은 와인도 늘었습니다. 라벨의 숙성 용어는 스페인 공통 기준으로 레드는 아래와 같습니다.\"}, {\"t\": \"table\", \"head\": [\"등급\", \"총 숙성\", \"그중 오크\"], \"rows\": [[\"**크리안사** (Crianza)\", \"2년 이상\", \"6개월 이상\"], [\"**리제르바** (Reserva)\", \"3년 이상\", \"1년 이상\"], [\"**그랑 리제르바** (Gran Reserva)\", \"5년 이상\", \"2년 이상\"]]}, {\"t\": \"h\", \"text\": \"와인 밭의 등급 (Els Noms de la Terra)\"}, {\"t\": \"p\", \"text\": \"2019년 공개한 등급은 부르고뉴처럼 산지에서 마을, 구획, 단일 포도밭 순으로 올라갑니다.\"}, {\"t\": \"table\", \"head\": [\"단계\", \"등급\", \"이 가이드의 와인\"], \"rows\": [[\"1\", \"DOQ Priorat\", \"Doix\"], [\"2\", \"비 데 빌라 (마을)\", \"Les Crestes\"], [\"3\", \"비 데 파라헤 (구획)\", \"Manyetes\"], [\"4\", \"비냐 클라시피카다 (단일 포도밭)\", \"Clos Mogador\"], [\"5\", \"**그랑 비냐 클라시피카다**\", \"1902\"]]}, {\"t\": \"tip\", \"label\": \"예약\", \"text\": \"셀레르 마스 도이스는 홈페이지에서, 클로스 모가도르는 이메일로 방문 예약을 합니다.\"}]}, {\"id\": \"mas-doix\", \"cat\": \"와인\", \"title\": \"셀레르 마스 도이스 (포볼레다)\", \"city\": \"프리오랏\", \"lead\": \"백 년 넘은 노포도에서 만드는 포볼레다의 가족 와이너리입니다.\", \"links\": {\"q\": \"Celler Mas Doix Poboleda\", \"yt\": \"마스 도이스 프리오랏 와이너리\", \"wp\": \"프리오라트 포도주\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"프리오랏 북서쪽 끝, 포볼레다 마을에 자리한 가족 경영 와이너리입니다. 1998년 도익스(Doix)와 야고스테라(Llagostera) 가문이 함께 설립했으며, 1850년부터 이어오다 필록세라(포도나무 뿌리 해충) 피해로 한때 멈췄던 포도 재배의 역사를 다시 꽃피웠습니다. 마을 뒤편의 몬트상 산맥과 모요 산맥이 거친 바람을 막아주는 천혜의 지형 속에 자리하고 있습니다.\"}, {\"t\": \"photo\", \"src\": \"img/c20dc130db989a774d4d1c2a4799632d.webp\", \"caption\": \"\", \"credit\": \"\"}, {\"t\": \"facts\", \"rows\": [[\"위치\", \"포볼레다 (Poboleda), 프리오랏 북서쪽. 시우라나에서 차로 40~45분 (약 27km)\"], [\"시작\", \"1998년 (가문의 포도 재배는 1850년부터)\"], [\"포도밭\", \"약 23ha. 옛 포도밭을 되살리고 새 밭을 더했습니다 (DOQ 프리오랏 소개 기준)\"], [\"품종\", \"가르나차 (그르나슈), 카리녜나 (카리냥). 수령 높은 노포도가 중심\"], [\"대표 와인\", \"**Doix** (노포도 카리녜나 중심 레드), **Les Crestes**, **Salanques** (레드), **Murmuri**, **Salix** (화이트), **1902** (단일 포도밭 레드)\"], [\"방문 시간\", \"월~토 10:30 · 12:30 · 16:30 (수확철에도 엽니다). 1/1, 1/6, 부활절, 5/1, 8/15, 9/11, 12/25~26 휴무, 12/31 오후 휴무\"], [\"인원\", \"2~16명\"]]}, {\"t\": \"h\", \"text\": \"대표 와인의 포도품종·평점·구매가격\"}, {\"t\": \"table\", \"head\": [\"와인\", \"품종\", \"평점\", \"구매가\"], \"rows\": [[\"**Doix**\", \"카리녜나, 가르나차\", \"4.4\", \"€102\"], [\"**Les Crestes**\", \"가르나차 80%, 카리녜나·시라 각 10%\", \"3.9\", \"€24.60\"], [\"**Salanques**\", \"가르나차, 카리녜나, 시라\", \"4.1\", \"€43.60\"], [\"**1902** (**그랑 비냐 클라시피카다**)\", \"카리녜나\", \"4.5~4.6\", \"€425\"]]}, {\"t\": \"h\", \"text\": \"와인별 떼루아\"}, {\"t\": \"list\", \"items\": [\"**공통:** 포볼레다 (Poboleda) 마을의 포도밭 여섯 곳은 모두 검은 편암 토양인 율리코렐라 (llicorella) 위에 있습니다. 해발 340m 안팎으로 프리오랏에서도 서늘한 편이고, 가파른 비탈 (코스테르) 에서 수확량을 아주 낮게 유지합니다.\", \"**Doix:** 등급은 일반 DOQ Priorat입니다. 4헥타르 Doix 포도밭에서 나옵니다. 천연 원형극장처럼 파인 가파른 비탈이고 해발 350~500m입니다. 1902년에 심은 카리녜나와 약 80년 된 가르나차를 쓰고, 신품 프랑스 오크에서 16개월 숙성합니다.\", \"**Les Crestes:** 등급은 포볼레다 마을 단위인 비 데 빌라 (Vi de Vila)입니다. 3헥타르의 가장 어린 포도밭입니다. 10~25년 된 가르나차가 중심 (약 80%) 이고 카리녜나와 시라가 각 10% 들어갑니다. 중고 프랑스 오크에서 8~10개월 숙성해 가볍고 과실향이 풍부합니다.\", \"**Salanques:** 등급은 확인하지 못했습니다. 3헥타르의 가파른 포도밭으로, 70~90년 된 가르나차와 카리녜나를 씁니다. 해발은 자료마다 350m 안팎에서 450m까지 차이가 있습니다.\", \"**1902:** 등급은 **그랑 비냐 클라시피카다**입니다 (2019년 빈티지부터). Doix 포도밭 안에서도 가장 오래된, 1902년에 심은 카리녜나만 골라 만듭니다. 토살 덴 보우 (Tossal d’en Bou) 구획은 남서향 율리코렐라 비탈로 해발 350~450m이고, 수확량이 매우 낮아 생산량이 아주 적습니다.\"]}, {\"t\": \"p\", \"text\": \"포도밭 면적과 해발은 와이너리 소개와 수입사 자료마다 조금씩 다릅니다. 시음할 때 직원에게 직접 물어보면 가장 정확합니다.\"}, {\"t\": \"h\", \"text\": \"시음 코스와 요금\"}, {\"t\": \"table\", \"head\": [\"코스\", \"와인\", \"시간\", \"1인 요금\"], \"rows\": [[\"3종\", \"Murmuri, Les Crestes, Salanques\", \"45분~1시간\", \"€30\"], [\"5종\", \"3종 + Doix, Salix\", \"1시간~1시간 15분\", \"€40\"], [\"7종\", \"5종 + 1902, 1903\", \"1시간 30분\", \"€80\"]]}, {\"t\": \"p\", \"text\": \"모두 와이너리와 포도밭 방문이 포함되고, 2~6명 기준 요금입니다 (7~12명은 €26·€35·€70). 영어로 진행되고, 프리오랏 관광청 안내 기준이라 예약할 때 공식 홈페이지에서 다시 확인하세요.\"}, {\"t\": \"h\", \"text\": \"어떤 코스를 고를까\"}, {\"t\": \"list\", \"items\": [\"일정에 잡은 시간은 약 1.5시간이라 시간이 딱 맞는 것은 7종입니다. 클로스 모가도르가 이어지니 여유가 필요하면 5종도 좋습니다.\", \"2인 기준 5종은 €80, 7종은 €160입니다.\", \"**1902**는 ‘토살 덴 보우 (Tosal d’en Bou)’ 단일 포도밭 와인으로, 2020년 말 기준 프리오랏의 최상급 ‘**그랑 비냐 클라시피카다**’ 세 와인 중 하나입니다. 이 등급이 궁금하면 [프리오랏 가이드](note:priorat)의 등급표를 먼저 보세요.\", \"산도 높은 드라이 레드가 취향이라면 노포도 카리녜나가 중심인 Doix와 1902를 눈여겨보세요.\"]}, {\"t\": \"h\", \"text\": \"알아두면 좋은 이야기\"}, {\"t\": \"list\", \"items\": [\"2019년부터 캐나다 출신 와인 생산자 클리프 리드 (Cliff Lede, 미국 나파밸리)와 협업을 시작했습니다.\", \"프리오랏 와이너리 대부분이 그렇듯 아르베키나 올리브로 만든 올리브 오일도 함께 팝니다.\"]}, {\"t\": \"tip\", \"label\": \"예약 방법\", \"text\": \"방문 1~2일 전까지 홈페이지나 전화로 예약합니다. \"}]}, {\"id\": \"clos-mogador\", \"cat\": \"와인\", \"title\": \"클로스 모가도르 (그라타요프스)\", \"city\": \"프리오랏\", \"lead\": \"프리오랏 부활을 이끈 ‘빅 파이브’ 중 하나입니다.\", \"links\": {\"q\": \"Clos Mogador Gratallops\", \"yt\": \"클로스 모가도르 프리오랏\", \"wp\": \"프리오라트 포도주\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"프리오랏 부활을 이끈 ‘빅 파이브’ 와이너리 중 하나입니다. 프랑스계 와인 집안의 르네 바르비에 3세가 부인 이사벨 마이어와 1979년 그라타요프스에 작은 땅을 사서 가르나차, 카리녜나, 시라, 카베르네 소비뇽을 심으며 시작했고, 1989년 다섯 와이너리의 첫 공동 빈티지에서 첫 와인을 냈습니다.\"}, {\"t\": \"facts\", \"rows\": [[\"위치\", \"그라타요프스 (Gratallops), Camí Manyetes. 마을에서 걸어서 5분쯤\"], [\"시작\", \"1979년 (첫 빈티지 1989년)\"], [\"가문\", \"바르비에 집안은 1870년 필록세라 때 프랑스에서 건너와 타라고나에 와이너리를 세웠습니다 (DOQ 프리오랏 소개)\"], [\"대표 와인\", \"**Clos Mogador** (비냐 클라시피카다 레드), **Manyetes** (파라트게 레드), **Com Tu** (몬트상 레드)\"], [\"생산량\", \"연 약 5만 병\"], [\"방문\", \"예약제입니다. 1~2일 전에는 이메일로 예약하세요. 시간과 요금은 공식 사이트에서 확인한 값이 없어 예약 때 물어보세요\"]]}, {\"t\": \"h\", \"text\": \"대표 와인의 포도품종·평점·구매가격\"}, {\"t\": \"table\", \"head\": [\"와인\", \"품종\", \"평점\", \"구매가\"], \"rows\": [[\"**Clos Mogador**\", \"가르나차 45%, 카리녜나 29%, 시라 16%, 카베르네 소비뇽 10%\", \"4.4\", \"€76.61\"], [\"**Manyetes**\", \"카리녜나\", \"4.3\", \"문의\"], [\"**Com Tu**\", \"가르나차\", \"4.1~4.2\", \"약 €35\"]]}, {\"t\": \"h\", \"text\": \"와인별 떼루아\"}, {\"t\": \"list\", \"items\": [\"**공통:** 그라타요프스 (Gratallops) 의 포도밭은 검은 편암과 석영이 섞인 율리코렐라 토양입니다. 시우라나 강 위로 계단식 밭이 거대한 원형극장처럼 펼쳐지고, 유기농으로 재배합니다.\", \"**Clos Mogador:** 등급은 비냐 클라시피카다 (Vinya Classificada)입니다. 1979년 르네 바르비에가 사들인 20헥타르 본원 포도밭의 와인입니다. 평균 해발 약 450m (자료마다 350~800m 차이) 이고 가르나차 약 45%, 카리녜나 약 29%, 시라 약 16%, 카베르네 소비뇽 약 10%를 섞습니다. 비율은 빈티지마다 달라집니다.\", \"**Manyetes:** 등급은 비 데 파라헤 (Vi de Paratge)입니다 (2018년 빈티지부터, 이전에는 비 데 빌라). 그라타요프스 마을 안 마녜테스 (Manyetes) 라는 구획 하나에서만 나옵니다. 남향의 가파른 율리코렐라 계단식 밭이고 아주 오래된 카리녜나가 중심이며, 수확량이 매우 낮습니다. 2018년부터 비 데 파라헤 (Vi de Paratge) 로 분류됩니다.\", \"**Com Tu:** 프리오랏 등급 체계에 속하지 않습니다. 프리오랏이 아니라 인접한 DO 몬트상 (Montsant) 에서 2014년부터 만드는 가르나차 중심 레드입니다.\"]}, {\"t\": \"h\", \"text\": \"왜 가볼 만한가\"}, {\"t\": \"list\", \"items\": [\"**역사적 상징성과 로맨틱한 이야기:** 르네 바르비에 (René Barbier) 가 1979년 버려진 가파른 편암 (율리코렐라) 언덕의 가능성을 믿고 터를 잡았고, 1989년 첫 빈티지로 프리오랏의 부활을 이끌었습니다. 프리오랏 와인의 살아 있는 역사 속에서 부부가 함께 와인을 마신다는 것 자체가 특별한 기억이 됩니다.\", \"**떼루아와 투어:** 오래된 포도밭이 펼쳐진 가파른 언덕을 둘러보는 투어가 인상적이고, 지중해의 햇살과 몬트상 산맥이 감싸는 웅장한 자연 속에서 낭만적인 분위기를 즐길 수 있습니다. 투어 방식은 예약할 때 물어보세요.\", \"**우아하고 섬세한 풍미:** 거칠고 강하기만 하다는 스페인 와인의 선입견과 달리, 가르나차 (Garnacha) 와 카리녜나 중심으로 실크처럼 부드러운 타닌, 신선한 과일 향, 우아한 여운을 냅니다.\", \"가르나차가 중심이라 샤토뇌프 뒤 파프와 견줘 보기 좋고, 르네 바르비에는 오래된 카리녜나를 숙성된 바롤로에 비유합니다.\"]}]}, {\"id\": \"flamenco\", \"cat\": \"공연\", \"title\": \"플라멩코 공연\", \"city\": \"바르셀로나\", \"lead\": \"카탈루냐 음악당의 정식 공연과 매일 열리는 타블라오 세 곳입니다.\", \"links\": {\"q\": \"Palau de la Música Catalana Barcelona\", \"yt\": \"바르셀로나 플라멩코 공연\", \"wp\": \"플라멩코\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"플라멩코는 스페인 남부 안달루시아에서 나온 음악·춤으로, 노래 (칸테), 기타 (토케), 춤 (바일레)에 손박수 (팔마스)와 발구르기가 더해집니다. 곡의 리듬과 분위기에 따라 ‘팔로’라는 갈래로 나뉘며, 슬픈 솔레아, 빠르고 흥겨운 불레리아, 남성적인 파루카 등이 있습니다. 유네스코 인류무형문화유산이기도 합니다.\"}, {\"t\": \"photo\", \"src\": \"img/4eb8fb500ab8b94a26a3a797df0683b5.jpg\", \"caption\": \"카탈루냐 음악당 (Palau de la Música Catalana) 내부\"}, {\"t\": \"h\", \"text\": \"Gran Gala Flamenco — 카탈루냐 음악당\"}, {\"t\": \"facts\", \"rows\": [[\"공연장\", \"1905~1908년 도메네크 이 몬타네르가 지은 모데르니스메 음악당으로, 유네스코 세계유산에 오른 유일한 공연장입니다. 태양 모양 스테인드글라스와 무대 양옆 조각이 명물입니다\"], [\"공연 내용\", \"카스타네트·부채·긴 드레스 등으로 여러 팔로를 차례로 보여주는 무대. 약 75분, 중간 휴식 없음\"], [\"가격\", \"€35~75, 좌석 등급 VIP·A·B·C. 2인 기준 약 €70~150\"], [\"일정\", \"매일 열지 않습니다. 2026년 11~12월은 주로 일요일 21:30과 일부 화요일 (20:00 또는 21:30), 2027년은 1월 1일 뒤 3월부터 다시 열립니다. 여행 날짜가 정해지면 [공식 사이트](https://palaumusica.cat/en/gran-gala-flamenco_927626)에서 해당 날 공연이 있는지 먼저 확인하세요\"], [\"감상 팁\", \"춤을 가까이 보고 싶다면 1층 중앙 좌석이 좋습니다\"]]}, {\"t\": \"h\", \"text\": \"타블라오 (작은 무대에서 음료나 저녁을 먹으며 보는 주점)\"}, {\"t\": \"p\", \"text\": \"음악당 공연이 없는 날에는 아래 세 곳이 매일 열립니다. 가격은 날짜와 좌석에 따라 달라지니 예매 때 확인하세요.\"}, {\"t\": \"list\", \"items\": [\"**[Tablao Flamenco Cordobés](https://www.google.com/maps/search/?api=1&query=Tablao+Flamenco+Cordob%C3%A9s+Barcelona)**: 1970년부터 람블라스에서 이어온 대표 타블라오. 약 70분, 하루 4회 (약 17:40·19:15·21:00·22:30). 공연+음료 €46~48, 뷔페 저녁 포함 €82~. 처음 보는 사람에게 가장 무난합니다.\", \"**[Los Tarantos](https://www.google.com/maps/search/?api=1&query=Los+Tarantos+Pla%C3%A7a+Reial+Barcelona)**: 1963년부터 레이알 광장에 있는 가장 오래된 타블라오. 공연이 약 40분으로 짧고 €25~부터입니다. 겨울에는 18:30·19:30·20:30 회차가 있고 입석에 가까울 수 있어 일찍 가는 편이 좋습니다.\", \"**[El Tablao de Carmen](https://www.google.com/maps/search/?api=1&query=El+Tablao+de+Carmen+Poble+Espanyol+Barcelona)**: 몬주익 언덕 위 스페인 마을 (Poble Espanyol) 안의 안달루시아풍 안뜰 무대. 저녁 식사와 함께 보는 공연이 하루 두 차례이고 €68~85부터입니다. 몬주익 일몰 뒤에 이어 가기 좋습니다.\"]}, {\"t\": \"tip\", \"label\": \"주의\", \"text\": \"일몰·야경 일정이 있는 날은 공연 시간이 겹치지 않게 고르세요.\"}]}, {\"id\": \"booking\", \"cat\": \"준비\", \"title\": \"예약 체크리스트와 입장료 요약\", \"city\": \"바르셀로나\", \"lead\": \"빨리 매진되는 순서로 정리했습니다.\", \"blocks\": [{\"t\": \"h\", \"text\": \"예약이 필요한 곳들\"}, {\"t\": \"check\", \"items\": [\"사그라다 파밀리아: 일몰 2시간 전 입장 시간으로 온라인 예약 (모바일 티켓, 여권 지참)\", \"구엘 공원 기념물 구역: 일몰 1시간 전 시간대로 시간 지정 예약 (예약 시각부터 30분 안 입장)\", \"렌터카: 바르셀로나 시내 픽업과 공항 반납 (국제운전면허증·여권·신용카드 준비, 종합보험 확인)\", \"셀레르 마스 도이스: 홈페이지에서 시음 예약\", \"클로스 모가도르: 이메일로 방문 예약\", \"몬세라트: 검은 성모 알현 통합 입장권 예매 (날짜·시간 지정)\", \"카사 밀라·카사 바트요: 온라인 티켓 (시간 지정, 비 오는 날 카사 밀라 옥상 폐장 안내 확인)\", \"피카소 미술관: 온라인 예약 (선택 일정이면 일정이 정해진 뒤)\", \"카탈루냐 음악당 Gran Gala Flamenco 또는 타블라오: 여행 날짜에 공연이 있는지 확인 후 예매 (선택)\", \"공항 이동 수단: 아에로부스는 예약 없이 탑승, 도착 터미널 (T1·T2) 확인\"]}, {\"t\": \"h\", \"text\": \"입장료 요약 (1인 기준)\"}, {\"t\": \"table\", \"head\": [\"장소\", \"요금\", \"메모\"], \"rows\": [[\"사그라다 파밀리아\", \"€26~\", \"기본 €26, 탑 포함 €36\"], [\"카사 밀라\", \"€25~\", \"에센셜 온라인 기준\"], [\"카사 바트요\", \"€29~\", \"블루 티켓 기준, 옥상은 실버 이상\"], [\"몬세라트 통합 입장권\", \"€23\", \"검은 성모 알현·박물관 포함\"], [\"피카소 미술관 (선택)\", \"€14\", \"온라인\"], [\"구엘 저택 (선택)\", \"€15\", \"오디오가이드 포함\"], [\"몬주익 성·케이블카 (선택)\", \"성 €5~12, 케이블카 왕복 €14~17\", \"자료마다 달라 공식 사이트 확인 필요\"], [\"구엘 공원 기념물 구역\", \"공식 사이트 확인 필요\", \"시간 지정 예약\"], [\"호안 미로 미술관\", \"공식 사이트 확인 필요\", \"화~토 10–20, 일 10–19, 월 휴관\"], [\"공항 아에로부스\", \"편도 €7.45\", \"왕복 €12.85\"]]}, {\"t\": \"h\", \"text\": \"출처\"}, {\"t\": \"list\", \"items\": [\"사그라다 파밀리아 공식 홈페이지 (sagradafamilia.org): 티켓 종류와 요금\", \"카탈루냐 음악당 공식 사이트 (palaumusica.cat): Gran Gala Flamenco 일정과 요금\", \"카사 밀라·카사 바트요·피카소 미술관·몬세라트·구엘 저택 각 공식 사이트: 요금과 운영 시간 (이전 일정표 작성 때 확인한 값이며, 예약 전 재확인을 권합니다)\"]}]}, {\"id\": \"porto-airport\", \"cat\": \"이동\", \"title\": \"포르투 공항에서 시내로\", \"city\": \"포르투\", \"lead\": \"공항에서 시내까지는 메트로 E선이 가장 싸고, 짐이 많으면 우버·택시가 편합니다.\", \"links\": {\"q\": \"Porto Francisco Sá Carneiro Airport\", \"yt\": \"포르투 공항에서 시내 가는 법\"}, \"blocks\": [{\"t\": \"table\", \"head\": [\"수단\", \"요금\", \"시간·메모\"], \"rows\": [[\"메트로 E선 (보라색)\", \"Z4 1회권 약 €2.30 + 안단테 카드 €0.60 (처음 한 번) = 약 €2.90\", \"06:00~01:00, 약 20분 간격, 트린다드까지 약 25~30분. 타기 전 노란 단말기에 꼭 찍기. Z4는 첫 개찰 후 75분 동안 환승 포함\"], [\"우버·볼트\", \"€15~22\", \"20~25분. 공항 승차 구역이 택시와 따로 있음\"], [\"택시\", \"€20~30\", \"20~25분. 도착층 바로 앞 승강장\"]]}, {\"t\": \"p\", \"text\": \"상벤투~리베이라 숙소라면 트린다드에서 D선 (노란색)으로 갈아타 두 정거장 뒤 상벤투에서 내립니다. 리베이라까지는 내리막을 걸어 약 10분입니다.\"}]}, {\"id\": \"porto-intro\", \"cat\": \"도시 가이드\", \"title\": \"포르투의 역사\", \"city\": \"포르투\", \"lead\": \"\", \"links\": {\"q\": \"Porto Portugal\", \"wp\": \"포르투\", \"yt\": \"포르투 여행 도시 소개\"}, \"blocks\": [{\"t\": \"h\", \"text\": \"포르투의 역사\"}, {\"t\": \"p\", \"text\": \"포르투의 역사는 로마 시대의 쌍둥이 항구 정착지에서 출발해 포르투갈 건국의 기틀이 되었고, 이후 대항해시대의 조선·무역 거점과 포트 와인 산업의 중심지로 발전하며 오늘날의 모습을 갖추었습니다.\"}, {\"t\": \"h\", \"text\": \"1. 기원과 이름의 탄생 (로마 시대 ~ 중세 초기)\"}, {\"t\": \"list\", \"items\": [\"칼레(Cale)와 포르투스(Portus): 기원전 1세기경 로마 제국이 이베리아반도를 지배하면서 도우루강 하구에 교역 거점을 세웠습니다. 강 남쪽 언덕(현 빌라 노바 드 가이아)의 정착지인 칼레(Cale)와 북쪽 강변의 항구인 포르투스(Portus)가 결합해 포르투스 칼레(Portus Cale)라 불렸고, 이 이름이 훗날 포르투갈(Portugal)이라는 국호의 어원이 되었습니다.\", \"포르투칼레 백작령과 건국의 출발점: 9세기 이슬람 세력으로부터 이 지역을 되찾은 뒤 '포르투칼레 백작령'이 세워졌습니다. 12세기 초 이곳을 다스리던 아폰수 엔히크스(Afonso Henriques)가 독립을 선포하고 초대 국왕 아폰수 1세가 되면서, 포르투는 포르투갈 왕국 탄생의 핵심 무대가 되었습니다.\"]}, {\"t\": \"h\", \"text\": \"2. 대항해시대와 '내장(Tripeiros)'의 전설 (14~16세기)\"}, {\"t\": \"list\", \"items\": [\"엔히크 왕자와 조선업의 중심: 1394년 포르투에서 태어난 엔히크 왕자(항해왕자)가 대항해시대를 열면서 포르투의 조선소와 항구는 전성기를 맞이했습니다. 미라가이아(Miragaia) 조선소에서는 아프리카와 신대륙을 향하는 카라벨선이 쉴 새 없이 건조되었습니다.\", \"포르투 사람들의 자부심, 트리페이루스(Tripeiros): 1415년 북아프리카 세우타 원정을 떠나는 함대를 위해 포르투 시민들은 도시의 모든 좋은 살코기를 군량으로 내어주고, 정작 자신들은 남은 소 내장(트리파스)으로 스튜를 끓여 먹었습니다. 이 일화에서 유래한 '트리페이루스(내장 먹는 사람들)'는 오늘날까지도 포르투 시민을 부르는 자랑스러운 별칭이자, 대표 향토 음식 트리파스 아 모다 두 포르투의 기원이 되었습니다.\"]}, {\"t\": \"h\", \"text\": \"3. 포트 와인의 탄생과 영국과의 동맹 (17~18세기)\"}, {\"t\": \"list\", \"items\": [\"메슈엔 조약과 주정강화와인의 등장: 1703년 영국과 포르투갈이 체결한 메슈엔 조약(Methuen Treaty)으로 포르투갈 와인에 관세 특혜가 주어지면서 영국 상인들이 대거 포르투로 몰려들었습니다. 긴 항해 동안 와인이 변질되는 것을 막기 위해 발효 중인 와인에 브랜디를 첨가한 것이 오늘날의 포트 와인(Port Wine)이 되었습니다.\", \"세계 최초의 원산지 통제(1756년): 폼발 후작은 와인의 품질과 가격을 보호하기 위해 도우루 계곡의 포도밭 경계를 법으로 지정하고 전매 회사를 설립했습니다. 이는 프랑스 보르도나 샴페인보다 앞선 세계 최초의 와인 원산지 명칭 보호(DOC) 제도로 평가받습니다.\", \"바로크 건축의 황금기: 와인 무역으로 막대한 부를 축적한 포르투는 이탈리아 건축가 니콜라우 나소니(Nicolau Nasoni) 등을 초빙해 클레리구스 탑과 성당을 비롯한 화려한 바로크 양식의 도시 경관을 완성했습니다.\"]}, {\"t\": \"h\", \"text\": \"4. 자유주의 수호와 근대화 (19세기 ~ 현대)\"}, {\"t\": \"list\", \"items\": [\"'불굴의 도시(Invicta)' 칭호: 19세기 초 나폴레옹 군대의 침략에 맞서 격렬히 저항했으며, 1832~1833년 포르투갈 내전 당시에는 자유주의 세력의 최후 보루로서 1년 넘게 포위 공격을 버텨냈습니다. 이 공로로 마리아 2세 여왕으로부터 '고대롭고, 매우 고귀하며, 언제나 충성스럽고, 굴복하지 않는 도시(Invicta)'라는 공식 칭호를 받았습니다.\", \"산업화와 철교 건설: 19세기 후반 섬유·금속 산업이 발달하면서 상벤투역과 팔라시오 다 볼사(증권거래소 궁전)가 건립되었고, 1886년 동루이스 1세 다리가 완공되며 도우루강 양안이 하나로 연결되었습니다. 1996년에는 이러한 중세부터 근대까지의 중층적인 역사 가치를 인정받아 구시가지 전체가 유네스코 세계문화유산에 등재되었습니다.\"]}]}, {\"id\": \"azulejo\", \"cat\": \"건축\", \"title\": \"아줄레주\", \"city\": \"포르투\", \"lead\": \"포르투에서 가장 많이 보게 될 파란 타일 이야기입니다.\", \"links\": {\"q\": \"Capela das Almas, Porto\", \"yt\": \"포르투 아줄레주 타일 명소\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/00f343b7deddad8355ef48dcfb627048.jpg\", \"caption\": \"아줄레주\"}, {\"t\": \"list\", \"items\": [\"아줄레주는 유약을 바르고 그림을 그려 구운 타일입니다. 이슬람 세계의 타일 장식이 스페인을 거쳐 들어왔고, 17~18세기에 파랑·하양 그림 타일이 포르투갈의 상징이 됐습니다.\", \"포르투에서 사진으로 가장 유명한 파란 외벽은 대부분 20세기 초에 18세기 양식을 되살려 붙인 것입니다. 상벤투역 (1905~1916), 알마스 성당 (1929), 산투 일드폰수 성당 (1932)이 그렇고, 진짜 18세기 아줄레주는 대성당 회랑에서 볼 수 있습니다.\"]}, {\"t\": \"tip\", \"label\": \"감상 팁\", \"text\": \"타일마다 유약의 농담과 붓 터치가 달라, 햇빛의 각도에 따라 짙은 코발트블루에서 은은한 하늘빛까지 표정이 바뀝니다.\"}, {\"t\": \"tip\", \"label\": \"장소별 가이드\", \"text\": \"[알마스 성당](note:alma) · [산투 일드폰수 성당](note:ildefonso) · [상벤투역](note:sao-bento)\"}]}, {\"id\": \"alma\", \"cat\": \"건축\", \"title\": \"알마스 성당 (산타 카타리나 예배당)\", \"city\": \"포르투\", \"lead\": \"외벽 전체가 파란 아줄레주로 덮인 작은 성당입니다.\", \"links\": {\"q\": \"Capela das Almas, Porto\", \"yt\": \"포르투 알마스 성당 아줄레주\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"포르투의 대표적인 쇼핑 거리인 산타 카타리나 거리(Rua de Santa Catarina)에 자리한 성당으로, 건물 외벽을 가득 채운 푸른빛 아줄레주(Azulejo) 타일 장식으로 널리 알려진 곳입니다. 번화가 한복판에서 고요하고 단정한 종교 건축의 분위기를 마주할 수 있으며, 외관 감상과 내부 관람을 가볍게 묶어 둘러보기 좋습니다.\"}, {\"t\": \"h\", \"text\": \"역사와 건축 특징\"}, {\"t\": \"list\", \"items\": [\"18세기 건립과 전신: 원래 인근에 있던 '영혼의 성당(Capela das Almas)'이 18세기 말 도시 정비 과정에서 철거되면서, 1790년대 후반 산타 카타리나 거리 위치로 옮겨 지어지며 오늘날의 모습을 갖추게 되었습니다.\", \"아줄레주 외벽 장식: 1929년 아줄레주 거장 에두아르두 레이트(Eduardo Leite)의 디자인 아래 약 15,000~16,000장에 달하는 푸른색·흰색 타일이 외벽에 부착되었습니다. 타일 벽화에는 아시시의 성 프란시스코와 알렉산드리아의 성 카타리나의 생애와 주요 일화가 섬세하게 묘사되어 있습니다.\", \"내부 공간: 화려한 푸른 외관과 달리 실내는 흰 벽과 깔끔한 목조·석조 요소가 어우러진 차분하고 단정한 구조로 되어 있어 미사와 기도가 이루어지는 성당 본연의 분위기를 느낄 수 있습니다.\"]}, {\"t\": \"tip\", \"label\": \"TIP\", \"text\": \"외벽이 아침 햇살을 정면으로 받을 때 푸른빛이 가장 선명합니다. 길 건너 산타 카타리나 거리의 보도가 좁으니 사진을 찍을 때 지나가는 사람과 차량을 살피세요.\"}]}, {\"id\": \"ildefonso\", \"cat\": \"건축\", \"title\": \"산투 일드폰수 성당\", \"city\": \"포르투\", \"lead\": \"바탈랴 광장 위쪽 계단 위의 아줄레주 성당입니다.\", \"links\": {\"q\": \"Igreja de Santo Ildefonso, Porto\", \"yt\": \"산투 일드폰수 성당 포르투\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"중세 은둔소 자리에 18세기 전반 세운 바로크 성당입니다. 외벽의 약 1만 1,000장은 1932년 조르즈 콜라수가 그린 것으로, 성 일데폰소의 생애와 성체를 상징하는 장면입니다.\"}, {\"t\": \"tip\", \"label\": \"추천 팁\", \"text\": \"바탈랴 광장 위쪽 돌계단 위에 서 있어, 계단 아래에서 올려다보면 쌍둥이 종탑과 푸른 타일 파사드가 한 폭의 그림처럼 어우러집니다.\"}]}, {\"id\": \"sao-bento\", \"cat\": \"건축\", \"title\": \"상벤투역\", \"city\": \"포르투\", \"lead\": \"기차역 홀 벽을 가득 채운 아줄레주 패널을 보러 갑니다.\", \"links\": {\"q\": \"Estação de São Bento, Porto\", \"yt\": \"상벤투역 아줄레주 포르투\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/15736b3954859d095a3259eabe0e6f83.jpg\", \"caption\": \"상벤투역\"}, {\"t\": \"p\", \"text\": \"16세기 베네딕도회 수녀원 자리에 세워 1916년 문을 연 기차역입니다. 홀 벽의 타일 약 2만 장 (551㎡)은 조르즈 콜라수가 1905~1916년 11년에 걸쳐 완성했습니다. 파란 큰 패널은 주앙 1세와 필리파 왕비의 포르투 입성 (1387), 세우타 정복 (1415) 같은 역사 장면이고, 색이 들어간 위쪽 띠에는 지방의 농촌 생활과 교통수단의 발달이 그려져 있습니다. 입장료는 없습니다.\"}, {\"t\": \"tip\", \"label\": \"이어서 보기\", \"text\": \"1387년 주앙 1세와 필리파가 혼인한 곳이 포르투 대성당이라, 상벤투역 패널과 이야기가 이어집니다. [포르투 대성당 가이드 보기](note:se-porto)\"}]}, {\"id\": \"se-porto\", \"cat\": \"건축\", \"title\": \"포르투 대성당\", \"city\": \"포르투\", \"lead\": \"로마네스크 요새 성당에 고딕 회랑과 바로크 장식이 더해진 구시가의 중심입니다.\", \"links\": {\"q\": \"Sé do Porto\", \"yt\": \"포르투 대성당 회랑 아줄레주\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/b5ad8677caa4c9a16f5c55fe37cebf8c.jpg\", \"caption\": \"포르투 대성당\"}, {\"t\": \"p\", \"text\": \"12~13세기 로마네스크 요새 같은 성당에 14세기 고딕 회랑, 18세기 바로크 장식이 더해졌습니다. 회랑 벽은 1729~1731년 발렌팀 드 알메이다가 그린 아줄레주로 덮여 있는데, 구약의 「아가」, 성모의 생애, 오비디우스의 「변신」 이야기입니다. 1387년 주앙 1세와 필리파 드 랭커스터가 혼인한 곳입니다. 회랑 입장은 €3입니다.\"}, {\"t\": \"tip\", \"label\": \"추천 팁\", \"text\": \"대성당 앞 광장 테라스는 붉은 지붕과 도우루강이 내려다보이는 가장 유서 깊은 전망 포인트입니다. 스페인 산티아고 순례길 (포르투갈 길)의 출발점이기도 해서, 바닥에서 순례자를 뜻하는 가리비 표식을 찾아보는 재미가 있습니다.\"}]}, {\"id\": \"ribeira\", \"cat\": \"도시 가이드\", \"title\": \"리베이라 강변\", \"city\": \"포르투\", \"lead\": \"색색의 좁은 집들이 도우루강을 따라 이어지는 구시가의 강변입니다.\", \"links\": {\"q\": \"Cais da Ribeira, Porto\", \"yt\": \"포르투 리베이라 강변\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"구시가의 강변으로, 색색의 좁은 집들이 강을 따라 이어집니다. 맞은편 가이아 강변에 떠 있는 납작한 나무배 ‘라벨루 (rabelo)’는 예전에 도우루 계곡에서 포트 와인 통을 실어 나르던 배입니다.\"}]}, {\"id\": \"lello\", \"cat\": \"건축\", \"title\": \"렐루서점\", \"city\": \"포르투\", \"lead\": \"1906년 문을 연, 아르누보 곡선이 가득한 서점입니다.\", \"links\": {\"q\": \"Livraria Lello, Porto\", \"yt\": \"포르투 렐루서점 내부 아르누보\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/f66534de0e2cb419cefd20be3346282f.jpg\", \"caption\": \"렐루서점\"}, {\"t\": \"p\", \"text\": \"1906년 건축가 자비에르 에스테베스 (Xavier Esteves)가 설계한 서점입니다. 신고딕 양식의 웅장한 외관 속에 아르누보 곡선과 화려한 장식을 품어 ‘세계에서 가장 아름다운 서점’ 중 하나로 꼽힙니다. 2026년 개업 120주년에 국가기념물로 재지정되었습니다.\"}, {\"t\": \"h\", \"text\": \"놓치지 말아야 할 관람 포인트\"}, {\"t\": \"list\", \"items\": [\"**붉은 소용돌이 계단:** 서점 한가운데서 2층으로 뻗어 올라가는 붉은 목조 계단이 상징입니다. 나뭇잎과 덩굴처럼 휘어지는 아르누보 곡선이 압권이고, 《해리 포터》 호그와트의 움직이는 계단 영감을 받았다는 이야기로도 유명합니다 (아래 ‘오해와 진실’ 참고).\", \"**스테인드글라스 천장:** 2층 천장의 길이 8m 대형 스테인드글라스가 자연광을 부드럽게 걸러 쏟아냅니다. 중앙에는 서점 모토인 라틴어 “Decus in Labore (노동 속의 품격)”가 새겨져 있습니다.\", \"**나무를 닮은 기둥과 목조 서가:** 고딕풍 책장과 기둥은 원목처럼 보이지만 실제로는 석고에 정교하게 채색해 나무 질감을 낸 것입니다.\", \"**《어린 왕자》 테마 공간:** 2층에 생텍쥐페리 《어린 왕자》 초판본과 특별 에디션을 모은 작은 전시 공간이 있습니다.\"]}, {\"t\": \"h\", \"text\": \"입장권 예매와 방문 팁\"}, {\"t\": \"list\", \"items\": [\"**사전 온라인 예약 필수 (시간 지정 바우처제):** 현장 매표소에서는 당일 입장권을 구하기 어렵고 대기 줄이 깁니다. 공식 웹사이트에서 날짜와 입장 시간대를 정해 예매하세요.\", \"**실버 바우처 (약 €8~10):** 지정된 시간에 입장하는 기본 티켓으로, 서점에서 책을 사면 입장권 금액만큼 할인됩니다.\", \"**골드 바우처 (약 €15.95):** 우선 입장과 함께 렐루서점이 낸 특별 에디션 도서 (‘The Collection’ 시리즈 등) 1권을 교환해 갈 수 있습니다.\", \"**인파를 피하는 시간대:** 내부가 좁아 사람이 몰리면 계단 사진 찍기가 어렵습니다. 오픈 직후 (09:00 첫 타임), 점심시간 (13:00~14:30), 마감 1시간 전 (18:00 무렵)이 여유롭습니다.\", \"**운영 시간:** 매일 09:00~19:00. 예약 시간보다 10~15분 일찍 도착해 해당 시간대 대기 줄에 서세요.\"]}, {\"t\": \"tip\", \"label\": \"해리포터의 영감? 오해와 진실\", \"text\": \"오랫동안 호그와트 계단의 모델이라는 이야기로 유명했지만, J.K. 롤링은 2020년 SNS에서 이 서점에 가 본 적도 없고 호그와트와 관련이 없다고 직접 밝혔습니다. 그래도 공간 자체가 품은 동화 같은 아름다움은 그대로입니다.\"}, {\"t\": \"tip\", \"label\": \"예약\", \"text\": \"입장권 금액은 렐루 서점 출판 책을 사면 그만큼 차감됩니다.\"}]}, {\"id\": \"clerigos\", \"cat\": \"건축\", \"title\": \"클레리구스 탑과 성당\", \"city\": \"포르투\", \"lead\": \"포르투 구시가 어디서나 보이는 바로크 종탑입니다.\", \"links\": {\"q\": \"Torre dos Clérigos, Porto\", \"yt\": \"클레리구스 탑 포르투 야경\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"이탈리아 건축가 니콜라우 나소니가 18세기에 완성한 포르투갈 바로크 건축의 걸작입니다. 타원형 본당과, 옛 항구의 등대 역할을 했던 76m 종탑이 구시가의 중심을 이룹니다. 나선형 돌계단 240개를 올라 꼭대기에 서면 붉은 지붕과 도우루강, 가이아의 와인 롯지가 360도로 펼쳐집니다.\"}, {\"t\": \"tip\", \"label\": \"TIP\", \"text\": \"상층 계단과 정상 난간이 매우 좁으니 백팩은 앞으로 메고 오르세요. 오픈 직후 (09:00)나 일몰 1시간 전이 여유롭고, 바로 옆 렐루서점 (도보 2분)과 묶어 걷기 좋습니다.\"}, {\"t\": \"photo\", \"src\": \"img/b4f147151444edec246f0434522f0a7a.jpg\", \"caption\": \"성당 내부 조명 쇼\"}, {\"t\": \"p\", \"text\": \"**스피리투스 (Spiritus) 라이트쇼:** 해가 지면 성당 내부의 타원형 벽면과 천장이 캔버스로 변합니다. 페르난두 페소아의 시에서 영감을 받은 입체 영상과 음악이 약 30분간 성당을 채웁니다.\"}]}, {\"id\": \"luis-bridge\", \"cat\": \"건축\", \"title\": \"동 루이스 1세 다리\", \"city\": \"포르투\", \"lead\": \"상판과 하판을 모두 걸을 수 있는 포르투의 상징 철교입니다.\", \"links\": {\"q\": \"Ponte Luís I, Porto\", \"wp\": \"동 루이스 1세 다리\", \"yt\": \"동 루이스 1세 다리 포르투\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"1881~1886년 에펠의 동업자였던 테오필 세리그가 설계한 철교입니다. 폭 172m 아치는 개통 당시 같은 형식 중 세계에서 가장 길었습니다. 상판 (1886년 개통)은 메트로 D선과 보행자가, 강변 높이의 하판은 2023년부터 대중교통·자전거·보행자만 다닙니다. 상류의 마리아 피아 다리 (1877)는 에펠 회사가 직접 만든 철도교입니다.\"}]}, {\"id\": \"gaia\", \"cat\": \"도시 가이드\", \"title\": \"가이아 강변과 유람선\", \"city\": \"포르투\", \"lead\": \"강 건너 가이아에서 리베이라를 마주 보고 걷거나 배로 둘러봅니다.\", \"links\": {\"q\": \"Cais de Gaia, Vila Nova de Gaia\", \"yt\": \"포르투 6개 다리 유람선 도우루강\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"빌라 노바 드 가이아(Vila Nova de Gaia) 도우루강변을 따라 조성된 수변 산책로이자 선착장 일대로, 동루이스 1세 다리 아래 강변 풍경과 와인 셀러·테라스·유람선 승선장이 어우러진 곳입니다. 포르투 구시가지(히베이라)와 강을 사이에 두고 마주 보며 산책과 식사, 강변 휴식을 즐기기 좋습니다.\"}, {\"t\": \"h\", \"text\": \"6개 다리 유람선\"}, {\"t\": \"p\", \"text\": \"가이아 강변 선착장이나 포르투 강변에서 출발하는 도우루강 6개 다리 유람선 투어는 전통 목선(라벨루 보트·Rabelo)이나 유람선을 타고 약 50분간 강 위에서 포르투와 가이아를 잇는 6개 다리와 양안의 풍경을 감상하는 대표 수상 코스입니다. 강 위에서 바라보는 철교와 언덕, 와인 저장고의 구도가 도보 산책과는 또 다른 시야를 제공합니다.\"}, {\"t\": \"list\", \"items\": [\"코스와 매력: 도우루강을 따라 이동하며 6개의 다리와 수변 경관을 한눈에 담을 수 있으며, 가이드 또는 오디오 해설을 통해 다리와 강의 역사를 접할 수 있습니다.\", \"이용 팁: 운항 회차와 막배 시각이 계절과 선사에 따라 다르므로 현장 선착장이나 예매처에서 출발 시간을 확인하는 것이 좋고, 강 위 바람을 고려해 편한 복장을 갖추는 것이 좋습니다.\", \"기본 운영: 매일 운항 (출항 간격 및 막배 시각은 계절·선사별 상이, 보통 오전~오후 시간대 운영)\"]}]}, {\"id\": \"graham\", \"cat\": \"와인\", \"title\": \"그라함스 포트 롯지\", \"city\": \"포르투\", \"lead\": \"그라함스 포트 롯지(Graham's 1890 Lodge)는 빌라 노바 드 가이아(Vila Nova de Gaia) 언덕 정상에 자리한 포트 와인 명가로, 200년이 넘는 세월 동안 영국 왕실 행사와 국빈 만찬에 오르며 최상급 빈티지 포트의 기준을 세워온 상징적인 공간입니다.\", \"links\": {\"q\": \"Graham's Port Lodge, Vila Nova de Gaia\", \"yt\": \"그라함스 포트 롯지 투어 시음\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"포트 와인 시음과 와이너리 투어를 겸하는 곳입니다. 투어와 시음은 약 2시간이고, 코스별 요금은 일정 카드에서 확인하세요.\", \"__ind\": 0}, {\"t\": \"h\", \"text\": \"역사와 가문의 계승\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"스코틀랜드 직물 상인에서 와인 명가로(1820년): 스코틀랜드 글래스고 출신의 윌리엄과 존 그라함 형제가 포르투에서 직물 무역을 하던 중, 외상값 대신 포도주 27통을 받으면서 와인 사업에 뛰어들었습니다.\", \"1890년 가이아 롯지 건립: 와인의 품질과 명성이 높아지자 1890년 대서양 바닷바람이 불어오는 가이아 언덕 높은 곳에 화강암 셀러를 세웠으며, 이후 영국 엘리자베스 2세 여왕의 즉위 기념식과 윌리엄 왕자의 결혼식 등 왕실 공식 행사에 헌정되며 권위를 확고히 했습니다.\", \"시밍턴 패밀리(Symington Family)의 인수: 1970년, 19세기부터 도우루 계곡에서 포도밭을 일궈온 시밍턴 가문이 그라함스를 인수했습니다. 현재도 5세대에 걸쳐 가족 경영을 이어가며 세계적인 빈티지 포트 생산자로 명성을 지키고 있습니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"포도밭과 핵심 포도 품종\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"그라함스 와인의 기틀은 도우루 계곡 상류(Cima Corgo 및 Douro Superior)의 편암(Schist) 토양에 자리한 5개의 핵심 농장(킨타 두스 말베두스(Quinta dos Malvedos), 투아, 라제스, 빌라 벨랴, 발레 드 말다스)에서 생산되는 포도입니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"대표 와인 라인업\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"빈티지 포트 (Vintage Port): 작황이 유독 뛰어난 해에만 선별 생산하며, 오크통에서 2년 숙성 후 병입해 수십 년간 병 숙성을 거칩니다. 짙은 자줏빛과 폭발적인 베리류 풍미가 특징입니다.\", \"레이트 보틀드 빈티지 (LBV): 단일 빈티지의 포도를 오크통에서 4~6년간 숙성한 뒤 병입해, 구매 즉시 디캔팅 없이도 빈티지 포트에 준하는 깊은 풍미를 즐길 수 있습니다.\", \"숙성 토니 포트 (Aged Tawny Port - 10·20·30·40년): 작은 오크통(파이프)에서 오랜 시간 산화 숙성을 거쳐 호박빛을 띠며, 말린 무화과·구운 아몬드·캐러멜·오렌지 껍질의 복합적인 아로마가 돋보입니다.\", \"식스 그레이프스 (Six Grapes Reserve): 그라함스의 시그니처 리저브 루비 포트로, 과거 와인 메이커가 최상급 오크통에 포도 송이 기호 6개를 표시하던 전통에서 유래했습니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"와이너리 관람 가이드\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"웅장한 화강암 숙성고: 두께 1m에 달하는 화강암 벽체와 높은 목재 트러스 지붕이 대서양의 서늘한 해풍과 어우러져 연중 이상적인 온·습도를 유지합니다. 내부에는 약 2,000여 개의 오크통과 15,000리터 규모의 대형 배트(Vat)가 정연하게 늘어서 있습니다.\", \"빈티지 셀러(Vintage Cellar)와 박물관: 19세기 후반부터 이어진 희귀 올드 빈티지 병들이 잠들어 있는 아카이브 공간과, 1890년 건립 당시의 포도 압착기·수기 장부·왕실 헌정 기록을 전시한 박물관 구역이 관람의 깊이를 더합니다.\", \"시음 공간과 전망 테라스: 클래식 테이스팅 룸은 물론, 최고급 빈티지와 30·40년 숙성 토니를 프라이빗하게 시음하는 빈티지 룸(Vintage Room)이 마련되어 있습니다. 시음 후 야외 테라스와 레스토랑 비눔(Vinum)에서는 동루이스 1세 다리와 도우루강, 포르투 구시가지가 한눈에 들어오는 압도적인 파노라마 전망을 만끽할 수 있습니다.\"], \"__ind\": 0}, {\"t\": \"tip\", \"label\": \"\", \"text\": \"방문 팁: 모든 투어는 사전 예약제 소규모 가이드 투어(영어·포르투갈어·스페인어 등 진행)로 운영되며, 가이아 언덕 상단에 위치하므로 도보 이동 시 가파른 오르막을 감안해 우버·볼트(Bolt)를 이용하면 한결 수월하게 도착할 수 있습니다.\", \"__ind\": 0}]}, {\"id\": \"madrid-airport\", \"cat\": \"이동\", \"title\": \"마드리드 공항에서 시내로\", \"city\": \"마드리드\", \"lead\": \"공항에서 시내까지는 메트로 8호선이 가장 싸고, 솔·오페라 숙소라면 택시 정액이 가장 편합니다.\", \"links\": {\"q\": \"Adolfo Suarez Madrid-Barajas Airport\", \"yt\": \"마드리드 공항에서 시내 가는 법\"}, \"blocks\": [{\"t\": \"table\", \"head\": [\"수단\", \"요금\", \"시간·메모\"], \"rows\": [[\"메트로 8호선\", \"일반 요금 + 공항 추가요금 €3 = 약 €4.50~5\", \"06:00~01:30, 누에보스 미니스테리오스까지 T1·T2·T3 약 12분, T4 약 20분. 솔까지는 10호선 → 트리부날에서 1호선으로 갈아타 40~50분. 2026년 6월부터 개찰구에서 카드 터치 결제 가능\"], [\"공항 급행버스 203번\", \"€5\", \"24시간, 낮 15~20분 간격, 아토차까지 약 40분. 아토차 정차는 06:00~23:30만, 밤엔 시벨레스가 종점\"], [\"택시\", \"정액 €33\", \"약 30분. 솔·오페라 숙소라면 도착과 출국 모두 가장 편함\"]]}, {\"t\": \"p\", \"text\": \"T4는 T1·T2·T3와 떨어져 있어 무료 셔틀버스로 오갑니다. 항공권의 터미널을 먼저 확인하세요.\"}, {\"t\": \"tip\", \"label\": \"출국일\", \"text\": \"국제선은 출발 3시간 전 공항 도착을 기준으로, 16:00 출발이 항공편 시간에 맞는지 확인하세요.\"}]}, {\"id\": \"royal-palace\", \"cat\": \"건축\", \"title\": \"마드리드 왕궁\", \"lead\": \"서유럽 최대 규모를 자랑하는 스페인 왕실의 공식 관저. 3,400여 개의 화려한 방과 바로크·신고전주의 건축미, 고야의 걸작과 스트라디바리우스 현악기 등 압도적인 예술 컬렉션을 품은 문화의 보고입니다.\", \"links\": {\"q\": \"Palacio Real de Madrid\", \"yt\": \"마드리드 왕궁\"}, \"blocks\": [{\"t\": \"h\", \"text\": \"건축미와 내부 핵심 관람 동선\"}, {\"t\": \"p\", \"text\": \"1734년 크리스마스이브에 옛 알카사르 (9세기 이슬람 요새에서 출발한 왕궁)가 불타자, 펠리페 5세가 같은 자리에 새로 지은 궁전입니다. 유바라의 설계를 이어받은 사케티가 다시는 불타지 않도록 돌로 지었고 (1738~1755), 1764년 카를로스 3세가 처음 입주했습니다. 방이 3,418개, 바닥면적 약 13만 5천㎡로 서유럽에서 가장 큰 왕궁입니다. 다만 국왕 부부는 교외 사르수엘라 궁에 살고, 이곳은 국가 행사에만 씁니다.\"}, {\"t\": \"steps\", \"items\": [\"중앙 대계단 (Escalera Principal): 프란시스코 사바티니가 설계한 70여 개의 단일 대리석 계단과 웅장한 천장 프레스코화가 어우러져 궁전 입장과 동시에 압도적인 위용을 전합니다.\", \"왕좌의 방 (Salón del Trono): 붉은 벨벳 벽면과 황금 장식, 조반니 바티스타 티에폴로의 천장 프레스코화가 결합된 최고 격식의 알현실로 스페인 제국의 권위를 상징합니다.\", \"가스파리니 살롱 & 갈라 연회장 (Salón de Gasparini & Comedor de Gala): 로코코·신고전주의가 어우러진 섬세한 벽면 자수·금속 세공 장식과 화려한 국빈 만찬 테이블 세팅을 통해 왕실의 연회 문화를 엿볼 수 있습니다.\", \"왕실 무기 박물관 (Real Armería): 합스부르크·부르봉 왕실이 사용한 마상 창 시합용 갑옷, 의전용 투구, 정교한 부조 장식의 방패와 검류가 전시된 유럽 최정상급 무구 컬렉션입니다.\", \"왕실 약국 (Real Farmacia) & 스트라디바리우스 컬렉션: 18~19세기 도자기·유리 약병과 조제 기구가 보존된 왕실 보건 공간과 세계적 명기의 현악기 앙상블(팔라티노 4중주단 등) 및 고야·벨라스케스 등 왕실 소장 회화가 관람의 깊이를 더합니다.\"]}, {\"t\": \"h\", \"text\": \"동선 효율을 높이는 외부 연계 스폿\"}, {\"t\": \"list\", \"items\": [\"알무데나 대성당 (Catedral de la Almudena): 왕궁 남쪽 광장을 사이에 두고 마주한 마드리드 주교좌 성당으로, 신고전주의 외관과 네오고딕 내부, 현대적 채플이 공존하는 독특한 건축 양식을 보여줍니다.\", \"오리엔테 광장 (Plaza de Oriente): 왕궁 정면 동쪽과 왕립극장을 잇는 직사각형 광장으로, 중앙 기마상과 대칭 화단 너머로 궁전 파사드 전체를 조망하기 좋습니다.\", \"사바티니 정원 (Jardines de Sabatini): 왕궁 북측에 자리한 3단 계단식 신고전주의 정원으로, 기하학적인 분수·조각상과 함께 궁전의 북측 외관을 감상하며 산책하기에 알맞습니다.\"]}], \"city\": \"마드리드\"}, {\"id\": \"debod\", \"cat\": \"건축\", \"title\": \"데보드 신전\", \"lead\": \"마드리드 한가운데 있는 진짜 고대 이집트 신전입니다.\", \"links\": {\"q\": \"Templo de Debod Madrid\", \"yt\": \"마드리드 데보드 신전 일몰\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"마드리드 한가운데 있는 진짜 고대 이집트 신전입니다. 기원전 2세기 초 누비아 (이집트 남부)의 메로에 왕 아디칼라마니가 아문과 이시스에게 바친 작은 예배당에서 시작해, 프톨레마이오스 왕조와 로마 아우구스투스 시대에 커졌습니다. 1960년대 아스완 하이댐으로 누비아 유적이 물에 잠길 위기에 처하자 스페인이 유네스코의 구조 작업 (아부심벨 등)을 도왔고, 이집트가 감사의 뜻으로 1968년 기증했습니다. 돌을 하나하나 옮겨 다시 세워 1972년 7월 20일 공개했는데, 원래의 동서 방향을 지켰습니다 (문들의 순서는 원래와 다릅니다). 연못에 비친 신전 너머로 하늘이 물드는 일몰이 명물이니, 해 지기 20~30분 전에 도착하세요.\"}], \"city\": \"마드리드\"}, {\"id\": \"sol\", \"cat\": \"도시 가이드\", \"title\": \"푸에르타 델 솔\", \"lead\": \"15세기 성벽의 문 ‘태양의 문’에서 이름이 왔습니다.\", \"links\": {\"q\": \"Puerta del Sol Madrid\", \"yt\": \"마드리드 솔 광장\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"15세기 성벽의 문 ‘태양의 문’에서 이름이 왔습니다. 18세기 우체국 건물 (Casa de Correos, 지금은 마드리드 주정부 청사) 앞 바닥에 스페인 국도의 기점 ‘킬로메트로 세로 (0km)’ 동판이 있습니다. 이 건물 시계탑 종소리에 맞춰 12월 31일 자정에 포도 12알을 먹는 새해 풍습이 전국에 생중계됩니다. 알칼라 거리 입구의 ‘곰과 마드로뇨 나무’ 동상 (1967)은 마드리드 문장을 형상화한 것으로, 시민들의 대표 약속 장소입니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"plaza-mayor\", \"cat\": \"도시 가이드\", \"title\": \"마요르 광장\", \"lead\": \"펠리페 3세 때 완공된 (1619) 합스부르크 시대 광장으로, 129×94m 직사각형을 붉은 황토색 건물과 237개의 철제 발코니가 감쌉니다.\", \"links\": {\"q\": \"Plaza Mayor Madrid\", \"yt\": \"마드리드 마요르 광장\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"펠리페 3세 때 완공된 (1619) 합스부르크 시대 광장으로, 129×94m 직사각형을 붉은 황토색 건물과 237개의 철제 발코니가 감쌉니다. 북쪽의 벽화 건물이 가장 먼저 지어진 ‘카사 데 라 파나데리아 (빵집 조합 건물)’이고, 가운데 기마상이 펠리페 3세입니다. 투우와 종교재판 (아우토 다 페)까지 열리던 광장으로, 몇 차례 화재 뒤 다시 지어졌습니다. 남서쪽 ‘아르코 데 쿠치예로스’ 계단으로 내려가면 동굴식 메손 (선술집) 골목이 이어지는데, 일정의 메손 델 참피뇬도 이 일대에 있습니다. 12월엔 크리스마스 마켓이 섭니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"retiro\", \"cat\": \"도시 가이드\", \"title\": \"레티로 공원\", \"city\": \"마드리드\", \"lead\": \"17세기 왕실 휴양 정원에서 시민의 공원이 된 마드리드 대표 도심 공원. 프라도 미술관 바로 동쪽이라 관람 뒤 산책 코스로 이어집니다.\", \"links\": {\"q\": \"Parque del Retiro Madrid\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"17세기 스페인 왕실의 휴양용 정원으로 조성된 뒤 19세기 말 시민들에게 개방된 마드리드의 대표 도심 공원입니다.\", \"__ind\": 0}, {\"t\": \"h\", \"text\": \"기본 정보 및 이용 팁\", \"__ind\": 0}, {\"t\": \"facts\", \"rows\": [[\"운영 시간 (동절기 10~3월)\", \"매일 06:00–22:00\"], [\"운영 시간 (하절기 4~9월)\", \"매일 06:00–24:00\"], [\"입장료\", \"무료 (공원 내 수정궁·벨라스케스 궁전 전시 포함)\"], [\"추천 소요 시간\", \"핵심 스폿 도보 일주 기준 약 1시간 30분~2시간\"]], \"__ind\": 0}, {\"t\": \"sh\", \"text\": \"주요 진입 게이트\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"**알칼라 문 방면** (Puerta de la Independencia): 북서쪽 메인 입구\", \"**펠리페 4세 문** (Puerta de Felipe IV): 프라도 미술관 동쪽 출구에서 도보 3분\"], \"__ind\": 1}, {\"t\": \"tip\", \"label\": \"겨울철 유의사항\", \"text\": \"12월 말~1월 초 마드리드는 일교차가 크고 아침·해 질 녘 공원 안쪽 수변이 쌀쌀하므로 방풍 외투를 챙기는 것이 좋습니다. 강풍·폭설 등 기상 악화 시 안전을 위해 조기 폐쇄될 수 있습니다.\", \"__ind\": 1}, {\"t\": \"h\", \"text\": \"핵심 관람 포인트 4선\", \"__ind\": 0}, {\"t\": \"sh\", \"text\": \"대연못 & 알폰소 12세 기념비\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"([대연못 지도](https://www.google.com/maps/search/?api=1&query=Estanque+Grande+del+Retiro+Madrid)) Estanque Grande & Monumento a Alfonso XII. 공원 중앙을 차지하는 인공 호수와 반원형 열주 회랑이 어우러진 상징적인 공간입니다.\", \"__ind\": 1}, {\"t\": \"p\", \"text\": \"연못 서쪽 선착장에서 노 젓는 보트(45분 기준, 유료)를 탈 수 있으며, 오후 늦게 서쪽에서 비치는 햇살이 기념비 대리석에 닿을 때 사진 색감이 가장 선명합니다.\", \"__ind\": 1}, {\"t\": \"sh\", \"text\": \"수정궁\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"([수정궁 지도](https://www.google.com/maps/search/?api=1&query=Palacio+de+Cristal+Madrid)) Palacio de Cristal. 1887년 필리핀 박람회 당시 온실 용도로 지어진 철골·유리 건축물로, 레이나 소피아 미술관의 별관 전시 공간으로 운영됩니다.\", \"__ind\": 1}, {\"t\": \"p\", \"text\": \"건물 앞 작은 연못의 백조·오리와 유리 외벽에 반사되는 주변 플라타너스 숲이 어우러져 공원에서 가장 포토제닉한 구역입니다. 내부 보수 공사 일정에 따라 외관 관람만 가능할 수 있습니다.\", \"__ind\": 1}, {\"t\": \"sh\", \"text\": \"벨라스케스 궁전\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"([벨라스케스 궁전 지도](https://www.google.com/maps/search/?api=1&query=Palacio+de+Vel%C3%A1zquez+Madrid)) Palacio de Velázquez. 수정궁 바로 북쪽에 자리한 19세기 붉은 벽돌·세라믹 타일 양식의 전시관입니다. 수정궁과 마찬가지로 레이나 소피아 미술관이 기획하는 현대미술 전시가 무료로 열립니다.\", \"__ind\": 1}, {\"t\": \"sh\", \"text\": \"타락천사 분수\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"([타락천사 분수 지도](https://www.google.com/maps/search/?api=1&query=Fuente+del+%C3%81ngel+Ca%C3%ADdo+Madrid)) Fuente del Ángel Caído. 공원 남쪽 산책로에 위치한 분수로, 루시퍼가 천국에서 추방되는 순간을 묘사한 세계적으로 드문 공공 조각상입니다. 조각상이 놓인 지점의 해발 고도가 공교롭게도 정확히 666m라는 점으로 유명합니다.\", \"__ind\": 1}, {\"t\": \"h\", \"text\": \"추천 동선 (프라도 미술관 연계 · 약 1시간 30분)\", \"__ind\": 0}, {\"t\": \"steps\", \"items\": [\"프라도 미술관 동쪽 출구 — 여기서 출발합니다.\", \"펠리페 4세 문 진입 — 출구에서 도보 3분입니다.\", \"파르테레 정원 (Parterre) 통과\", \"대연못 & 알폰소 12세 기념비\", \"벨라스케스 궁전\", \"수정궁\", \"북서쪽 알칼라 문 (Puerta de Alcalá) 방향으로 퇴장 — 그랑비아·살라망카 지구로 이동하기 쉽습니다.\"], \"__ind\": 0}, {\"t\": \"tip\", \"label\": \"길찾기\", \"text\": \"[구글 지도에서 전체 동선 보기](https://www.google.com/maps/dir/?api=1&origin=Museo+del+Prado+Madrid&destination=Puerta+de+Alcal%C3%A1+Madrid&waypoints=Puerta%20de%20Felipe%20IV%20Madrid%7CEstanque%20Grande%20del%20Retiro%20Madrid%7CPalacio%20de%20Vel%C3%A1zquez%20Madrid%7CPalacio%20de%20Cristal%20Madrid&travelmode=walking)\", \"__ind\": 0}]}, {\"id\": \"segovia-aqueduct\", \"cat\": \"마드리드 근교\", \"title\": \"세고비아 수도교\", \"lead\": \"1세기 후반~2세기 초 로마 플라비우스 왕조~트라야누스 시대에 지은 것으로 보이며, 15km 넘게 떨어진 아세베다 강의 물을 구시가 끝 알카사르까지 끌어왔습니다.\", \"links\": {\"q\": \"Acueducto de Segovia\", \"yt\": \"세고비아 로마 수도교\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"1세기 후반~2세기 초 로마 플라비우스 왕조~트라야누스 시대에 지은 것으로 보이며, 15km 넘게 떨어진 아세베다 강의 물을 구시가 끝 알카사르까지 끌어왔습니다. 아소게호 광장에서 가장 높아 28.1m, 아치는 167개입니다. 2만 개가 넘는 과다라마 화강암 블록을 모르타르 (접착제) 없이 무게와 힘의 균형만으로 쌓았고, 돌마다 보이는 작은 홈은 집게로 돌을 들어 올릴 때 쓴 자리입니다. 1072년 이슬람군의 공격으로 아치 36개가 상했다가 15세기 가톨릭 공동왕 때 복원됐고, 20세기까지 실제로 물을 날랐습니다. 1985년 구시가와 함께 세계유산이 됐습니다. 아치 옆 돌계단 (포스티고 델 콘수엘로 방향)을 오르면 수도교를 눈높이에서 볼 수 있습니다 (무료·24시간).\"}], \"city\": \"마드리드\"}, {\"id\": \"segovia-cathedral\", \"cat\": \"마드리드 근교\", \"title\": \"세고비아 대성당\", \"lead\": \"‘대성당의 귀부인 (Dama de las catedrales)’이라는 별명을 가진, 스페인에서 마지막으로 지어진 고딕 대성당입니다.\", \"links\": {\"q\": \"Catedral de Segovia\", \"yt\": \"세고비아 대성당\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"‘대성당의 귀부인 (Dama de las catedrales)’이라는 별명을 가진, 스페인에서 마지막으로 지어진 고딕 대성당입니다. 원래 대성당은 알카사르 앞에 있었는데 1520년 코무네로스 반란 때 부서져, 마요르 광장 옆으로 옮겨 1525년부터 새로 지었습니다 (옛 성당 터가 지금의 알카사르 앞 펠리페 2세 정원입니다). 탑은 스페인에서 손꼽히게 높습니다. 일반 입장 €4, 월~토 9:30~18:30·일 13:30~18:30이고, 탑은 가이드 투어로만 오릅니다 (성당+탑 €7).\"}], \"city\": \"마드리드\"}, {\"id\": \"segovia-alcazar\", \"cat\": \"마드리드 근교\", \"title\": \"세고비아 알카사르\", \"lead\": \"두 강이 만나는 바위 절벽 끝에 선 성으로, 뾰족한 슬레이트 지붕 덕에 ‘디즈니 성의 모델’로 자주 불립니다.\", \"links\": {\"q\": \"Alcazar de Segovia\", \"yt\": \"세고비아 알카사르\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"두 강이 만나는 바위 절벽 끝에 선 성으로, 뾰족한 슬레이트 지붕 덕에 ‘디즈니 성의 모델’로 자주 불립니다. 1474년 12월 13일 이사벨 1세가 이곳에서 나와 마요르 광장의 성당 앞에서 카스티야 여왕으로 즉위했고, 1570년 펠리페 2세가 왕비 아나 데 아우스트리아와 결혼식을 올렸습니다. 1764년부터 왕립 포병학교가 쓰다가 1862년 3월 6일 큰 불로 화려한 무데하르 천장들이 타 버렸고, 1882~1896년 복원됐습니다. 지금 보는 ‘갤리선의 방’, ‘솔방울의 방’, 카스티야 왕들의 조각이 띠처럼 둘린 ‘왕들의 방’ 천장은 그때 되살린 것입니다.\"}, {\"t\": \"tip\", \"label\": \"관람 팁\", \"text\": \"궁전+포병 박물관 €7, 후안 2세 탑까지 €10이며, 탑은 표를 살 때만 고를 수 있습니다. 1440~1465년에 세운 탑은 좁은 나선 계단 152개를 올라 정상에서 25분까지 머물 수 있고, 시가지·대성당·과다라마 산맥이 한눈에 들어옵니다. 11~3월은 10:00~18:00 (매표는 30분 전 마감). 성을 가장 예쁘게 보려면 아래 계곡 쪽 전망대나 엘 파랄 수도원 회랑에서 올려다보세요.\"}, {\"t\": \"tip\", \"label\": \"코치니요 아사도 (새끼돼지 통구이)\", \"text\": \"젖먹이 새끼돼지를 화덕에 구운 세고비아 명물입니다. 이름난 메손에서는 껍질은 바삭하고 속은 부드럽다는 걸 보여 주려고 칼 대신 접시 가장자리로 고기를 자른 뒤, 그 접시를 바닥에 던져 깨는 퍼포먼스를 합니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"granja\", \"cat\": \"마드리드 근교\", \"title\": \"라 그랑하 왕궁\", \"lead\": \"스페인 첫 부르봉 왕 펠리페 5세가 어린 시절을 보낸 베르사유를 그리워하며 1721년부터 지은 여름 궁전이라 ‘스페인의 베르사유’로 불립니다.\", \"links\": {\"q\": \"Palacio Real de La Granja de San Ildefonso\", \"yt\": \"라 그랑하 왕궁\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"스페인 첫 부르봉 왕 펠리페 5세가 어린 시절을 보낸 베르사유를 그리워하며 1721년부터 지은 여름 궁전이라 ‘스페인의 베르사유’로 불립니다. 루이 14세의 건축가에게 배운 카를리에가 설계한 146ha의 프랑스식 정원에 신화 조각 분수 26개가 있고, ‘명성의 분수’는 물줄기가 40m까지 솟습니다. 다만 옛 수력 장치를 아끼려고 분수는 정해진 축일에만 틀어서 겨울에는 대개 꺼져 있습니다. 대신 궁전 안 태피스트리 박물관과 대리석의 방이 볼만하고, 붙어 있는 왕립 성당에는 펠리페 5세와 왕비 이사벨 데 파르네시오가 묻혀 있습니다 (엘 에스코리알이 아닌 곳에 묻힌 드문 왕입니다). 궁전 입장 €9.\"}], \"city\": \"마드리드\"}, {\"id\": \"toledo-cathedral\", \"cat\": \"마드리드 근교\", \"title\": \"톨레도 대성당\", \"lead\": \"1226년 착공한 스페인 수석 대주교좌 (Catedral Primada)로, 2026년이 착공 800주년입니다.\", \"links\": {\"q\": \"Catedral Primada de Toledo\", \"yt\": \"톨레도 대성당 트란스파렌테\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"1226년 착공한 스페인 수석 대주교좌 (Catedral Primada)로, 2026년이 착공 800주년입니다. 꼭 볼 것은 세 가지입니다. ① 엘 트란스파렌테: 주제단 뒤 회랑의 고딕 천장을 뚫어 햇빛이 성체 보관소로 떨어지게 만든 바로크 제단으로, 나르시소 토메가 아들들과 1729~1732년 대리석·벽옥·청동으로 만들었습니다. 정오 무렵 빛이 가장 극적이고, 오른쪽 아래에 토메의 서명이 숨어 있습니다. ② 성구실: 엘 그레코의 「엘 엑스폴리오 (옷이 벗겨지는 그리스도)」와 루카 조르다노의 천장화가 있고, 카라바조·티치아노·고야 등의 그림이 걸린 작은 미술관입니다. ③ 14~17세기 스테인드글라스. 입장 €12로 성당·박물관·회랑, 엘 그레코 그림, (가능하면) 탑까지 들어가며 관광 팔찌에는 포함되지 않습니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"santo-tome\", \"cat\": \"마드리드 근교\", \"title\": \"산토 토메 성당\", \"lead\": \"엘 그레코의 「오르가스 백작의 매장」 (1586)이 그림 속 주인공의 무덤 바로 위, 화가가 처음 의도한 자리에 걸려 있습니다.\", \"links\": {\"q\": \"Iglesia de Santo Tome Toledo\", \"yt\": \"산토 토메 성당 엘 그레코 오르가스 백작\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"엘 그레코의 「오르가스 백작의 매장」 (1586)이 그림 속 주인공의 무덤 바로 위, 화가가 처음 의도한 자리에 걸려 있습니다. 아래는 지상의 장례식, 위는 천상으로 올라가는 영혼으로 나뉘고, 아래 줄 귀족들 사이에서 관람자를 바라보는 얼굴이 엘 그레코 자신, 왼쪽 아래 소년이 그의 아들이라고 전해집니다. 입장 €4, 관광 팔찌 포함.\"}], \"city\": \"마드리드\"}, {\"id\": \"toledo-jewish\", \"cat\": \"마드리드 근교\", \"title\": \"유대인 지구의 두 시나고그\", \"lead\": \"산타 마리아 라 블랑카는 이슬람 장인의 무데하르 양식으로 지은 유대교 회당으로, 하얀 말굽 아치 기둥이 숲처럼 늘어서 있습니다.\", \"links\": {\"q\": \"Sinagoga de Santa Maria la Blanca Toledo\", \"yt\": \"톨레도 유대인 지구 시나고그\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"산타 마리아 라 블랑카는 이슬람 장인의 무데하르 양식으로 지은 유대교 회당으로, 하얀 말굽 아치 기둥이 숲처럼 늘어서 있습니다. ‘이슬람 장인이 유대인을 위해 짓고 15세기 초 기독교 교회가 된’ 세 문화의 상징입니다. 200m 떨어진 트란시토 시나고그는 1357년 무렵 페드로 1세의 재무관 사무엘 레비가 지은 회당으로, 화려한 석고 장식의 기도실과 함께 1971년부터 세파르디 (스페인계 유대인) 박물관으로 쓰입니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"san-juan-reyes\", \"cat\": \"마드리드 근교\", \"title\": \"산 후안 데 로스 레예스 수도원\", \"lead\": \"가톨릭 공동왕 (이사벨·페르난도)이 1476년 토로 전투 승리를 기념하며 자신들의 무덤으로 쓰려고 지은 프란치스코회 수도원입니다 (결국 그라나다 왕실 예배당에 묻혔습니다). 이사벨 양식 (후기…\", \"links\": {\"q\": \"Monasterio de San Juan de los Reyes Toledo\", \"yt\": \"톨레도 산 후안 데 로스 레예스\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"가톨릭 공동왕 (이사벨·페르난도)이 1476년 토로 전투 승리를 기념하며 자신들의 무덤으로 쓰려고 지은 프란치스코회 수도원입니다 (결국 그라나다 왕실 예배당에 묻혔습니다). 이사벨 양식 (후기 고딕)의 2층 회랑이 아름답고, 바깥벽에는 그라나다 정복 때 풀려난 기독교 포로들의 쇠사슬이 걸려 있습니다. 관광 팔찌 포함.\"}], \"city\": \"마드리드\"}, {\"id\": \"reina-sofia\", \"cat\": \"미술\", \"title\": \"레이나 소피아 미술관 「게르니카」\", \"lead\": \"「게르니카」는 1937년 4월 26일 독일 공군이 바스크 마을 게르니카를 폭격한 소식을 듣고, 피카소가 파리 작업실에서 5월 1일~6월 4일에 그린 가로 약 7.8m의 흑백 대작입니다.\", \"links\": {\"q\": \"Museo Reina Sofia Madrid\", \"yt\": \"소피아 미술관 게르니카\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"「게르니카」는 1937년 4월 26일 독일 공군이 바스크 마을 게르니카를 폭격한 소식을 듣고, 피카소가 파리 작업실에서 5월 1일~6월 4일에 그린 가로 약 7.8m의 흑백 대작입니다. 스페인 공화국 정부가 파리 만국박람회 스페인관을 위해 의뢰했고, 피카소는 스페인에 민주적 자유가 돌아올 때까지 보내지 말라며 뉴욕 현대미술관 (MoMA)에 맡겼습니다. 프랑코 사후인 1981년 9월 10일 이베리아 항공 정기편으로 처음 스페인 땅을 밟았고 (착륙 후 기장이 승객들에게 알렸다는 일화가 있습니다), 프라도 별관의 방탄유리 뒤에 걸렸다가 1992년 이곳으로 옮겼습니다. 지금도 대여 요청을 거절하며 이 방을 떠나지 않습니다. 주변 방의 습작과 제작 과정 사진을 함께 보면 소·말·전구·우는 여인이 어떻게 자리 잡았는지 따라갈 수 있습니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"prado\", \"cat\": \"미술\", \"title\": \"프라도 미술관\", \"lead\": \"후안 데 비야누에바가 1785년 자연사 박물관으로 설계한 신고전주의 건물을, 페르난도 7세가 왕실 회화 박물관으로 바꿔 1819년 11월 311점으로 문을 열었습니다.\", \"links\": {\"q\": \"Museo del Prado Madrid\", \"yt\": \"프라도 미술관\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"후안 데 비야누에바가 1785년 자연사 박물관으로 설계한 신고전주의 건물을, 페르난도 7세가 왕실 회화 박물관으로 바꿔 1819년 11월 311점으로 문을 열었습니다. 지금은 약 2만 7천 점 가운데 1,500점 정도를 전시합니다. 2021년 프라도 거리와 레티로 공원 일대가 ‘빛의 풍경 (Paisaje de la Luz)’이라는 이름으로 세계유산이 됐습니다.\"}, {\"t\": \"tip\", \"label\": \"그 밖에, 그리고 동선\", \"text\": \"반 데르 바이덴 「십자가에서 내려지심」, 엘 그레코 「가슴에 손을 얹은 기사」, 루벤스 「삼미신」도 놓치기 아깝습니다. 0층 보스·플랑드르 → 1층 벨라스케스·엘 그레코 → 0층 고야 ‘검은 그림’ 순으로 돌면 3시간 안에 핵심을 볼 수 있습니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"las-meninas\", \"cat\": \"미술\", \"title\": \"벨라스케스 「시녀들」 (12번 방)\", \"lead\": \"왕녀 마르가리타와 시녀들, 그림을 그리는 화가 자신, 뒤쪽 거울 속 국왕 부부가 한 화면에 있어 ‘누가 누구를 보고 있는가’로 수백 년째 논쟁이 이어지는 작품입니다.\", \"links\": {\"q\": \"Museo del Prado Madrid\", \"yt\": \"벨라스케스 시녀들 해설\"}, \"blocks\": [{\"t\": \"photo\", \"src\": \"img/bbe3fdfe8ab7a485233054d87caaab85.jpg\", \"caption\": \"\", \"credit\": \"\", \"__ind\": 0}, {\"t\": \"h\", \"text\": \"1. 작품 기본 정보 및 역사적 배경\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"작가: 디에고 벨라스케스 (Diego Velázquez, 1599–1660)\", \"제작 연도: 1656년\", \"기법 및 크기: 캔버스에 유채, 318 × 276 cm\", \"소장처: 마드리드 프라도 미술관 (12번 전시실)\"], \"__ind\": 0}, {\"t\": \"p\", \"text\": \"17세기 스페인 합스부르크 왕조의 국왕 펠리페 4세의 궁정 화가였던 벨라스케스는 말년에 이 작품을 완성했습니다. 당시 스페인은 쇠퇴기에 접어들었지만, 궁정 내 예술적 성취는 최고조에 달했습니다. 벨라스케스는 화가가 단순한 기술자(장인)가 아니라 지적인 예술가임을 증명하고자 했으며, 이 그림은 그가 스페인 최고 귀족 기사단인 산티아고 기사단(Order of Santiago)의 일원이 되고자 했던 열망과도 맞닿아 있습니다.\", \"__ind\": 0}, {\"t\": \"h\", \"text\": \"2. 화면 속 인물 분석 (총 11명 + 1마리)\", \"__ind\": 0}, {\"t\": \"steps\", \"items\": [\"마르가리타 테레사 공주 (중앙): 당시 5세였던 펠리페 4세와 마리아나 왕비의 딸입니다. 빛을 가장 강하게 받으며 화면의 실질적인 주인공 역할을 합니다.\", \"디에고 벨라스케스 본인 (좌측 거대한 캔버스 뒤): 붓과 팔레트를 들고 캔버스 뒤에서 정면(관람자 쪽)을 응시하고 있습니다. 가슴에는 붉은색 산티아고 기사단 십자가가 그려져 있습니다.\", \"펠리페 4세 국왕과 마리아나 왕비 (중앙 뒷벽 거울 속): 흐릿하게 반사된 모습으로 등장합니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"3. 이 작품이 걸작인 이유: 4가지 핵심 감상 포인트\", \"__ind\": 0}, {\"t\": \"photo\", \"src\": \"img/8033335ba1efa09c4d0fe92032796bd4.jpg\", \"caption\": \"\", \"credit\": \"\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"그림 속 주요 인물들(공주, 벨라스케스, 난쟁이 마리바르볼라, 문가의 호세 니에토)은 모두 캔버스 밖의 정면을 바라보고 있습니다. 그들이 바라보는 대상은 누구일까요?\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"첫째는 그림을 보고 있는 관람자(우리)입니다.\", \"둘째는 뒷벽 거울 속에 비친 펠리페 4세 부부입니다. 즉, 관람자가 작품 앞에 서는 순간, 관람자는 왕과 왕비가 서 있던 자리(모델의 위치)에 서게 됩니다. 벨라스케스는 우리가 그림을 보는 것이 아니라, 그림 속 인물들이 우리를 구경하는 듯한 기묘한 역전 현상을 만들어냈습니다.\"], \"__ind\": 0}], \"city\": \"마드리드\"}, {\"id\": \"garden-delights\", \"cat\": \"미술\", \"title\": \"보스 「쾌락의 정원」 (56A번 방)\", \"lead\": \"낙원, 쾌락의 세상, 지옥을 그린 세 폭 제단화로, 펠리페 2세가 몹시 아껴 침실에 걸어 뒀다는 이야기가 전합니다.\", \"links\": {\"q\": \"Museo del Prado Madrid\", \"yt\": \"보스 쾌락의 정원 해설\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"낙원, 쾌락의 세상, 지옥을 그린 세 폭 제단화로, 펠리페 2세가 몹시 아껴 침실에 걸어 뒀다는 이야기가 전합니다. 날개를 닫으면 바깥면에 유리구슬 안에 담긴 천지창조의 세상이 나옵니다. 초현실주의자들에게 큰 영감을 준 그림이라 앞의 미로 섹션과 이어서 보면 좋습니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"goya\", \"cat\": \"미술\", \"title\": \"고야 「1808년 5월 3일」과 ‘검은 그림’\", \"lead\": \"「5월 3일」은 나폴레옹 군의 시민 처형을 정면으로 그려 근대 반전 회화의 출발점으로 꼽힙니다 (「5월 2일」과 나란히 걸려 있습니다). ‘검은 그림’ 14점은 고야가 말년 (1819~1823…\", \"links\": {\"q\": \"Museo del Prado Madrid\", \"yt\": \"고야 1808년 5월 3일 검은 그림\"}, \"blocks\": [{\"t\": \"p\", \"text\": \"「5월 3일」은 나폴레옹 군의 시민 처형을 정면으로 그려 근대 반전 회화의 출발점으로 꼽힙니다 (「5월 2일」과 나란히 걸려 있습니다). ‘검은 그림’ 14점은 고야가 말년 (1819~1823)에 귀가 먼 채 살던 집의 벽에 직접 그린 것을 떼어 캔버스로 옮긴 것으로, 「아들을 삼키는 사투르누스」가 대표작입니다. 전날 본 「게르니카」로 이어지는 흐름이라 함께 기억해 두세요.‘검은 그림’을 그리게 된 사연 — 고야는 1792년 병을 앓아 청력을 잃었고, 1819년에는 마드리드 근교 만사나레스 강변의 집 ‘킨타 델 소르도 (귀먹은 이의 집)’를 사서 이사했습니다. 그 무렵 다시 목숨이 위태로울 만큼 크게 앓았고, 나폴레옹 전쟁 이후 페르난도 7세의 절대왕정이 돌아와 자유주의자들을 압박하던 시기였습니다. 늙은 궁정화가가 자신의 집 벽에 팔지 않을 그림을 직접 그렸는데, 제목도 설명도 남기지 않았습니다. 14점 모두 후대가 붙인 이름이고, 1870년대에 벽에서 떼어 캔버스로 옮겨 프라도에 들어왔습니다. 고야는 1824년 프랑스 보르도로 떠난 뒤 다시 돌아오지 못했습니다.사투르누스가 아들을 잡아먹는 이유 — 로마 신화의 사투르누스 (그리스 신화의 크로노스)는 ‘자기 자식 중 하나가 왕좌를 빼앗을 것’이라는 예언을 듣고, 태어난 아이들을 차례로 삼켜 버리는 신입니다 (마지막 아들 제우스만 살아남아 아버지를 몰아냅니다). 권력을 잃는 두려움 때문에 자기 피붙이를 파괴하는 이야기인 셈입니다. 고야는 이 신화를 미화한 신화화가 아니라, 눈이 튀어나온 채 미친 듯 살을 물어뜯는 노인으로 그렸습니다. 해석은 여러 갈래입니다. 자기 권력을 지키려 자기 국민을 잡아먹는 폭군 (페르난도 7세의 스페인), 전쟁으로 자기 아들들을 잃은 스페인 자신, 모든 것을 삼키는 시간, 그리고 늙어 가는 고야 자신의 절망과 죽음에 대한 공포로 읽는 등입니다. 고야가 직접 뜻을 밝힌 적이 없어 정답이 있는 그림은 아닙니다.\"}], \"city\": \"마드리드\"}, {\"id\": \"madrid-history\", \"cat\": \"도시 가이드\", \"title\": \"마드리드를 알고 보면\", \"city\": \"마드리드\", \"lead\": \"요새에서 출발해 1561년 수도가 된 도시의 짧은 역사입니다.\", \"links\": {\"q\": \"Madrid Spain\", \"yt\": \"마드리드 역사\"}, \"blocks\": [{\"t\": \"list\", \"items\": [\"마드리드의 시작은 9세기 이슬람 에미르 무함마드 1세가 세운 요새이고, 그 요새 자리가 지금의 왕궁입니다. 왕궁 옆에 그때의 성벽 일부가 남아 있습니다.\", \"마드리드가 수도가 된 건 1561년 펠리페 2세가 궁정을 톨레도에서 옮기면서입니다. 그래서 톨레도를 ‘옛 수도’라 부르고, 톨레도 대성당이 지금도 스페인 수석 대주교좌입니다.\", \"마드리드 토박이를 ‘가토 (고양이)’라 부르는 건, 1085년 알폰소 6세가 마드리드를 함락할 때 한 병사가 고양이처럼 성벽을 기어올라 깃발을 꽂았다는 전설에서 왔습니다.\"]}]}, {\"id\": \"port-wine\", \"cat\": \"와인\", \"title\": \"포트와인 : 발효 중 증류주를 넣어 발효를 멈춘 와인\", \"lead\": \"도루 계곡에서만 기르는 포도로 만든 달콤한 주정 강화 와인입니다.\", \"links\": {\"yt\": \"포트 와인\"}, \"blocks\": [{\"t\": \"list\", \"items\": [\"와인 발효 도중 도수 77% 안팎의 포도 증류주 (아과르덴트)를 넣어 효모의 발효를 멈춥니다. 알코올로 분해되지 않고 남은 포도당 때문에 단 맛이 특징이며, 알코올은 20%로 도수가 높습니다.\", \"포도는 도루 계곡에서만 기릅니다. 1756년 폼발 후작이 경계석을 세워 구획한 도루는 세계 최초로 법으로 경계를 정한 와인 산지로 꼽히고, 2001년 유네스코 세계유산 (알투 도루 와인 산지)이 됐습니다.\", \"1986년까지는 포트를 반드시 빌라 노바 드 가이아에서 수출하므로, 지금도 대형 하우스의 숙성고 (롯지)가 강 남쪽 가이아 언덕에 몰려 있습니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"루비와 토니 포트의 구분\", \"__ind\": 0}, {\"t\": \"p\", \"text\": \"루비(Ruby)와 토니(Tawny) 포트는 같은 포르투갈 도우루 계곡의 포도로 만들지만, 어떤 크기의 용기에서 얼마나 공기와 접촉하며 숙성하는가에 따라 색, 향, 질감, 가격대까지 완전히 다른 와인으로 나뉩니다.\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"루비 포트 (과일 본연의 에너지 보존): 공기를 차단한 큰 통에서 짧게(보통 2~3년) 숙성한 뒤 병에 담기 때문에, 포도가 가진 짙은 색소와 갓 수확한 검은 베리류의 싱싱하고 강렬한 과실 풍미가 그대로 유지됩니다. 상위 등급인 LBV나 빈티지 포트로 갈수록 타닌과 응축미가 깊어집니다.\", \"토니 포트 (시간과 산소가 빚은 고소함): 작은 오크통에서 수년에서 수십 년 동안 미세한 산소와 꾸준히 반응하며 숙성됩니다. 이 과정에서 붉은 색소는 갈색(Tawny, 황갈색)으로 변하고, 풋풋한 생과일 향은 사라지는 대신 구운 견과류, 말린 과일, 토피, 은은한 향신료의 복합미가 자리 잡습니다.\"], \"__ind\": 0}, {\"t\": \"table\", \"head\": [\"계열\", \"이름\", \"숙성 방식\", \"맛\"], \"rows\": [[\"루비\", \"Ruby · Reserve\", \"큰 탱크·통에서 2~3년\", \"신선한 붉은 과일, 가장 대중적\"], [\"\", \"LBV (Late Bottled Vintage)\", \"단일 빈티지를 오크통에서 4~6년 숙성 후 병입\", \"빈티지 포트보다 일찍 마시기 좋음\"], [\"\", \"Vintage\", \"작황이 뛰어난 해에만 선언, 일찍 병입해 병에서 수십 년 숙성\", \"가장 진하고 오래 감, 침전물이 있어 디캔팅\"], [\"토니\", \"Tawny · Tawny Reserve\", \"오크통 숙성\", \"호박색, 견과·캐러멜\"], [\"\", \"10·20·30·40년 등\", \"여러 해 와인을 섞어 표기 연수의 숙성감을 맞춤\", \"오래될수록 말린 과일·견과 향이 짙어짐\"], [\"\", \"Colheita\", \"단일 빈티지 토니, 오크통에서 7년 이상\", \"라벨에 수확 연도\"], [\"화이트·로제\", \"White · Rosé\", \"—\", \"토닉워터와 섞어 아페리티프로\"]], \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"단맛이 부담되면 루비보다 가볍고 견과 향이 도는 토니 쪽이 편합니다. 가이아의 포트 업계 사람들도 점심에 20년 토니를 즐겨 마신다고 합니다.\"], \"__ind\": 0}, {\"t\": \"h\", \"text\": \"음용법과 페어링 팁\", \"__ind\": 0}, {\"t\": \"list\", \"items\": [\"적정 온도: 루비·LBV·빈티지 포트는 16~18°C(약간 서늘한 실온), 토니 포트는 12~14°C, 화이트 포트는 6~10°C로 차갑게 칠링해 마실 때 가장 밸런스가 좋습니다.\", \"음식 페어링: 루비·LBV·빈티지 - 다크 초콜릿, 베리류 디저트, 블루치즈(스틸턴·고르곤졸라), 구운 스테이크 소스 / 숙성 토니(10·20·30년) - 에그타르트(파스텔 드 나타), 아몬드·호두 타르트, 크렘 브륄레, 숙성 하드 치즈(콩테·만체고), 견과류·하몽\", \"보관 기간: 일반 와인보다 알코올과 당도가 높아 개봉 후 산화 속도가 느립니다. 빈티지 포트는 개봉 후 2~3일 내 음용을 권장하지만, LBV는 1~2주, 숙성 토니 포트는 냉장 보관 시 1~2개월 이상도 맛을 잘 유지합니다.\"], \"__ind\": 0}], \"city\": \"포르투\"}, {\"id\": \"cava\", \"cat\": \"와인\", \"title\": \"까바: 샴페인과 같은 방식의 카탈루냐 스파클링\", \"lead\": \"병 속에서 2차 발효시키는 카탈루냐 스파클링으로, 산지보다 숙성 등급을 보세요.\", \"links\": {\"q\": \"wine 까바: 샴페인과 같은 방식의 카탈루냐 스파클링\", \"yt\": \"까바 스파클링 와인 등급\"}, \"blocks\": [{\"t\": \"list\", \"items\": [\"샴페인처럼 병 안에서 2차 발효시켜 거품을 만들고, 효모 앙금과 함께 병에서 숙성합니다. 1872년 산 사두르니 다노이아의 조셉 라벤토스 (코도르니우)가 페네데스 토착 품종으로 처음 만들었습니다.\", \"코도르니우 셀러는 가우디와 같은 시대의 모데르니스메 건축가 푸이그 이 카다팔크가 설계했고, 1976년 국가 역사·예술 기념물이 됐습니다. 앞의 아르누보 설명과 이어지는 곳입니다.\", \"전통 블렌드는 마카베우·샤렐로·파레야다 세 품종이고, 그중 샤렐로가 흔히 뼈대와 숙성력을 맡습니다.\", \"까바는 카탈루냐 밖 일부 지역에서도 만들 수 있어서, 산지보다 숙성 등급을 보는 편이 품질을 가늠하기 쉽습니다.\"]}, {\"t\": \"table\", \"head\": [\"등급\", \"병 속 최소 숙성\", \"특징\"], \"rows\": [[\"Cava de Guarda\", \"9개월\", \"신선하고 과일 향 중심, 가장 흔한 등급\"], [\"Cava de Guarda Superior Reserva\", \"18개월\", \"빈티지 표기, 향이 깊어짐\"], [\"Cava de Guarda Superior Gran Reserva\", \"30개월\", \"Brut Nature·Extra Brut·Brut만 허용, 구운 빵·견과 향\"], [\"Cava de Guarda Superior de Paraje
